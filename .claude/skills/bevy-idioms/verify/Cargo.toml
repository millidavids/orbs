# **Its own workspace, deliberately.** This package sits inside the repo tree but
# is not a member of it, and cargo refuses that combination unless one side says
# so: without this table, `cargo check` here answers *"current package believes
# it's in a workspace when it's not"* and the harness CLAUDE.md points sessions at
# cannot be run at all. An empty table here rather than `workspace.exclude` at the
# root, so the skill stays self-contained if it is ever copied elsewhere.
[workspace]

[package]
name = "bevy_verify"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.19"

[lints.rust]
dead_code = "allow"
unused_variables = "allow"
unused_imports = "allow"
