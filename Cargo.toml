[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# `0.<feature>.<iteration>` until release: the minor names the feature in hand,
# the patch a ROADMAP box ticked within it. No public API, so no semver to keep
# until 1.0, the Steam release (§19).
version = "0.20.22"
edition = "2024"
# Bevy 0.20 needs 1.97.1; declared, so an old toolchain is a clear error.
rust-version = "1.98"
license = "GPL-3.0-or-later"
repository = "https://github.com/millidavids/orbs"
authors = ["Blackhearth Studios"]

# Lints are configured once here and inherited by every crate via
# `[lints] workspace = true`. Per-crate lint config drifts.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unexpected_cfgs = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
# Selective pedantic and nursery, each added after a sweep found real defects.
cast_precision_loss = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
must_use_candidate = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"
unwrap_used = "warn"

# A read-only helper taking `&mut World` locks out every shared borrower.
needless_pass_by_ref_mut = "warn"

# An eager default allocated per vocabulary entry per keystroke.
or_fun_call = "warn"

# A byte-wise `ends_with(".log")` once left a `FEED.LOG` immune to sabotage.
case_sensitive_file_extension_comparisons = "warn"

# `stdin.lock()` in a `match` scrutinee holds the lock across every arm.
significant_drop_in_scrutinee = "warn"

# Cheap and mechanical.
missing_const_for_fn = "warn"
redundant_clone = "warn"
implicit_clone = "warn"
redundant_closure_for_method_calls = "warn"
match_like_matches_macro = "warn"
unnecessary_debug_formatting = "warn"

# Already clean; the ones a hurried change breaks.
uninlined_format_args = "warn"
manual_let_else = "warn"
redundant_else = "warn"
explicit_iter_loop = "warn"
semicolon_if_nothing_returned = "warn"
items_after_statements = "warn"
needless_collect = "warn"
map_unwrap_or = "warn"

# Not enabled, each looked at site by site:
#
# - `redundant_pub_crate` fights CLAUDE.md's visibility rule.
# - `needless_pass_by_value`: every hit is a system's `Res<T>`.
# - `suboptimal_flops`: `mul_add` changes render rounding for nothing.
# - `trivially_copy_pass_by_ref` would split one paint signature.
# - `unreadable_literal` would break `0xC0FFEE`, a hex word.
# - `module_name_repetitions`: the re-exported path does not repeat.
# - `option_if_let_else` reads worse here.
# - `similar_names` is noise.
# - `match_same_arms` would merge `Verb::signature`'s reasoned `PLACE` arms.
# - `too_many_lines`: `render::grid::build` is one hot operation.

[workspace.dependencies]
# ECS — used standalone in orbs-sim. NEVER depend on `bevy` there. See CLAUDE.md.
bevy_ecs = "0.20"

# ChaCha8 is stable across platforms and releases, as StdRng is not;
# `rng::every_stream_draws_what_it_always_has` pins the values.
rand = { version = "0.10", default-features = false, features = ["std"] }
rand_chacha = "0.10"

thiserror = "2.0"
tracing = "0.1"

# Content files (rule 6). `serde` is derive-only: nothing reaches the
# filesystem from the sim.
serde = { version = "1.0", features = ["derive"] }
toml = "1"

# The platform's app-data directory, for towers and settings, via
# `save::chosen` (§13). It pulls MPL-2.0 `option-ext`, GPL-compatible, which
# §19's licence table records.
dirs = "7"

# The CLIs only; never the sim, which takes command lines as a player does.
clap = { version = "4.5", features = ["derive"] }

# Our code unoptimised, dependencies optimised, as Bevy recommends (§19).
[profile.dev]
opt-level = 0
debug = "line-tables-only"

# Every dependency, built once and cached.
[profile.dev.package."*"]
opt-level = 3

# The sim at 1 even in debug, since Bevy's generic ECS code compiles where it is
# instantiated: the tests 417s to 132s, for a slower cold rebuild (§19).
[profile.dev.package.orbs-sim]
opt-level = 1

[profile.dev.package.orbs-balance]
opt-level = 1

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
