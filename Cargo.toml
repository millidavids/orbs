[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# **`0.<phase>.<step>` until release**, tracking docs/ROADMAP.md rather than the
# public API — there is no public API and no consumer outside this workspace, so
# the semver contract has nothing to describe yet. What a reader wants from the
# number before release is *where in the plan is this*, and that is what it says.
#
# It becomes ordinary semver at 1.0, and the switch is one-way: DESIGN.md §19
# records it so the jump from `0.<phase>` to `1.<minor>` is not read as a phase.
version = "0.14.5"
edition = "2024"
# bevy_ecs 0.19 requires 1.95. Declaring it makes the resolver MSRV-aware and
# turns "too old toolchain" into a clear error instead of a cryptic type failure.
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/millidavids/orbs"
authors = ["Blackhearth Studios"]

# Lints are configured once here and inherited by every crate via
# `[lints] workspace = true`. Per-crate lint config drifts.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unexpected_cfgs = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
# Selective pedantic and nursery — the whole groups are too noisy, these earn
# their keep. Each was added after a sweep that found real defects, not because
# the lint sounded good.
cast_precision_loss = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
must_use_candidate = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"
unwrap_used = "warn"

# A read-only helper that demands `&mut World` cannot be called from anywhere
# holding a shared borrow, for no reason its body can point at. Four in
# `execute/` did.
needless_pass_by_ref_mut = "warn"

# `get_or_insert` built an `Incomplete` — allocating a `Vec` — once per
# vocabulary entry per keystroke, then threw it away because the slot was taken.
or_fun_call = "warn"

# `ends_with(".log")` is a byte comparison, so a `FEED.LOG` in the content file
# would spawn without its sabotage marker and be silently immune.
case_sensitive_file_extension_comparisons = "warn"

# `stdin.lock()` in a `match` scrutinee holds the lock across every arm.
significant_drop_in_scrutinee = "warn"

# Cheap and mechanical; ~40 accessors were missing it.
missing_const_for_fn = "warn"
redundant_clone = "warn"
implicit_clone = "warn"
redundant_closure_for_method_calls = "warn"
match_like_matches_macro = "warn"
unnecessary_debug_formatting = "warn"

# Already clean across the workspace, so these cost nothing to hold and are the
# ones a hurried change is most likely to break.
uninlined_format_args = "warn"
manual_let_else = "warn"
redundant_else = "warn"
explicit_iter_loop = "warn"
semicolon_if_nothing_returned = "warn"
items_after_statements = "warn"
needless_collect = "warn"
map_unwrap_or = "warn"

# NOT enabled, and deliberately. Each was looked at site by site rather than
# waved away, and the count is what a sweep would report today:
#
# - `redundant_pub_crate` (108) fights CLAUDE.md's visibility rule, which asks
#   for `pub(crate)` on shared items regardless of the module's own visibility.
# - `needless_pass_by_value` (47) — every one is an ECS system parameter, where
#   taking `Res<T>`/`ResMut<T>` by value *is* the signature Bevy requires. The
#   two in `orbs-sim` are `bevy_ecs` systems in tests, same thing.
# - `suboptimal_flops` (14) suggests `mul_add`, which changes rounding in the
#   render maths for no measured gain.
# - `trivially_copy_pass_by_ref` (12) would make `&Screen` and `&PaneTransition`
#   by-value while `&Sim`, `&Line` and `&Panel` beside them must stay by
#   reference. One consistent paint signature is worth more than six bytes.
# - `unreadable_literal` (8) would break `0xC0FFEE`, a hex *word* that reads
#   worse with separators in it.
# - `module_name_repetitions` (6) flags `record::RecordKind`, which is
#   re-exported as `orbs_render::RecordKind` — the repetition does not exist on
#   the public path anyone types.
# - `option_if_let_else` (4) turns multi-line `match` arms into `map_or_else`
#   with two closures. It is in nursery because it often reads worse; here it
#   does.
# - `similar_names` (4) is noise.
# - `match_same_arms` (1) would merge `Verb::signature`'s three `PLACE` arms,
#   each carrying its own §19 reasoning for why that verb takes a place. The
#   comments are the valuable part.
# - `too_many_lines` (1) is `render::grid::build` at 104. It walks the frame and
#   emits quads — one operation, in the hot path, and splitting it would scatter
#   the vertex emission. CLAUDE.md's 300-line rule is about files.

[workspace.dependencies]
# ECS — used standalone in orbs-sim. NEVER depend on `bevy` there. See CLAUDE.md.
bevy_ecs = "0.19"

# Determinism: ChaCha8 is reproducible across platforms and stable across
# releases, which StdRng explicitly is not. Replay and offline/online parity
# depend on this.
rand = { version = "0.9", default-features = false, features = ["std"] }
rand_chacha = "0.9"

thiserror = "2.0"
tracing = "0.1"

# Content files (DESIGN.md §12, CLAUDE.md rule 6): prose and recipes live in
# TOML, never as string literals in Rust. `serde` is derive-only here — no
# runtime, no async, nothing that reaches the filesystem from inside the sim.
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"

# The balance harness's CLI, and nowhere else (DESIGN.md §13). `derive` only —
# it never reaches the sim, which takes its input as command lines exactly as a
# player does.
clap = { version = "4.5", features = ["derive"] }

# **Our code unoptimised, our dependencies optimised.** It was `opt-level = 1`
# for everything, which is the worst of both: Bevy's ~126 crates were built at a
# level that does not make them fast, and *our* code — the only code that
# changes — paid optimisation on every edit.
#
# This is Bevy's own recommendation, and it fits a text game especially well:
# nothing here is a hot loop that needs our own code optimised to be playable at
# 1 Hz.
#
# **The one thing that could have suffered got faster.** `orbs-balance` drives
# hundreds of thousands of sim ticks and is the standing instrument CLAUDE.md
# says to run after anything touching the world, so dropping `orbs-sim` to 0 was
# the real risk here. Measured, `sweep --ticks 7200` went **22.24s → 17.74s** of
# user CPU: the sim's hot path is `bevy_ecs` archetype iteration, and that crate
# gaining two optimisation levels outweighs our own code losing one. Every rate
# in the table was unchanged to four decimal places.
[profile.dev]
opt-level = 0
debug = "line-tables-only"

# Every dependency, including all of Bevy. Built once and then cached, so the
# level costs nothing on an ordinary rebuild and buys a game that runs properly
# while being developed.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
