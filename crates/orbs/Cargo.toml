[package]
name = "orbs"
description = "O.R.B.S. — Bevy frontend. The Steam product."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
orbs-sim = { path = "../orbs-sim" }
orbs-render = { path = "../orbs-render" }

# Content hot-reload (CLAUDE.md rule 6). The watcher lives *here*, not in
# orbs-sim: rule 8 forbids async in the sim, rule 3 makes a frontend a caller
# rather than a host, and a watcher inside the sim would make every headless
# test touch the filesystem. `notify` runs a background thread and hands work
# over a channel, which a system drains on a tick boundary.
notify = "8.0"

# No bevy_text / bevy_ui: every screen is terminal content drawn by our own
# cell-grid renderer. See DESIGN.md §13.
bevy = { version = "=0.19.0", default-features = false, features = [
    "std", "async_executor", "multi_threaded",
    "bevy_winit", "bevy_window", "bevy_input_focus",
    "bevy_render", "bevy_core_pipeline", "bevy_sprite", "bevy_sprite_render",
    "bevy_mesh", "bevy_image", "bevy_camera", "bevy_color",
    "bevy_asset", "bevy_state", "bevy_log",
    "bevy_audio", "vorbis",
    "png",
    "serialize",
] }

[target.'cfg(target_os = "linux")'.dependencies]
bevy = { version = "=0.19.0", default-features = false, features = ["x11", "wayland"] }

[features]
# Dev only, never shipped: links Bevy as a shared library so an edit does not
# re-link the whole engine. Measure before adopting it — see docs/SETUP.md.
fast-compile = ["bevy/dynamic_linking"]

[lints]
workspace = true
