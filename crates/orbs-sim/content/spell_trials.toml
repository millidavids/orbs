# Lines the scrivener is tested on, and never taught (DESIGN.md §19, *the scrivener*).
#
# See `content::Trials`. Every line here is literal — no `{slots}` — and a test
# holds that none of them is a line either corpus teaches, because a trial the
# reader has seen measures its memory, and its memory is excellent.
#
# # Reading a trial
#
#   said    what the player wrote
#   reads   what the orb should hear. Absent: the line must come back exactly as
#           written — a comment, a canonical line, a sentence asking for nothing
#   lenient leaving the line alone also passes
#   never   readings that must never come back, because they would run a spell
#           meaning the opposite of what was written. Scored apart; zero is the
#           only acceptable count
#   tags    exactly one shape, and any number of styles
#
# # What the orb should hear keeps the player's words
#
# The scrivener never binds a name — `parser::resolve` does that at cast, in the
# room. So *"when the mortar is free"* reads `if mortar is idle`, not `if
# mortar_and_pestle is idle`, and a typo reads back as the typo.
#
# # Write it unlike the corpus
#
# Contractions, capitals, punctuation, typos, the short names players actually
# use, names the reader has never seen, digits and number words, archaic and
# terse registers, and phrasings nobody wrote into `spellings.toml`.

