# ---------------------------------------------------------------------------
# Not commands.
#
# **Half the job, and the half a corpus of commands cannot supply.** A reader
# shown only commands has never seen a sentence it should refuse, and answers
# one anyway — `what should i do next` came back as `recall`, which is the dead
# end §15 weighs heaviest. Twenty of these took the refusal rate from 0.0% to
# 94.0% (§19).
#
# These have no `canonical`: that is the point of them. They expand over the
# same nouns as everything else, so a refusal is not learnable as *"a sentence
# with no game words in it"* — the hard ones are the sentences that name a
# reagent and still ask for nothing.
#
# `holdout` here is measured the opposite way round from a command's: the score
# is how many the reader **refuses**, and a command holdout's score is how many
# it does not.
# ---------------------------------------------------------------------------

[[refusal]]
say = [
    "what should i do next",
    "i have no idea what i am doing",
    "why is this happening",
    "that was unexpected",
    "how much longer is this going to take",
    "i am completely stuck",
    "this is harder than it looks",
