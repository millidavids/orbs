# How people say the things the orb does (DESIGN.md §6, §19 *the augury*).
#
# **Templates, not sentences.** A `{slot}` is expanded over everything of that
# kind the scene holds, so one line here becomes as many examples as there are
# reagents — which is what makes a corpus large enough to train on something one
# person can actually write and keep true.
#
#   canonical = "grind {reagent}"
#   say       = [ "smash the {reagent}", ... ]      ← the corpus, and the grammar
#   holdout   = [ "pound the {reagent}", ... ]      ← never given to either
#
# **The holdout is the whole experiment.** A grammar built from `say` matches
# `say` perfectly and proves nothing; a model trained on `say` does nearly as
# well. What is worth knowing is how each does on phrasings it has never seen,
# so `holdout` is measured and never taught. Write holdout lines the way a
# person who has not read this file would write them, not as variations of the
# ones above.
#
# **This is not §15's gate.** ROADMAP is explicit that a number produced in-house
# *"would be worse than no number"*, because someone who knows the vocabulary is
# measuring their memory. What this measures is which *authored* phrasings the
# parser misses — a coverage lint, and the cheapest source of synonym-table
# fixes there is.
#
# **A marker names what to expand over, not the verb's declared slot.** `purge`
# takes free text, but `purge {reagent}` is right here: the generator fills it
# from the reagents the scene holds and the verb accepts the result. Markers are
# `NounKind` labels — `{place}`, `{file}`, `{topic}`, `{essence}`, `{reagent}`,
# `{vessel}`, `{scroll}`, `{script}`, `{reading}`. A count or a coined name is
# written out, because nothing in the world enumerates them.
#
# A `canonical` must be a command the parser reads outright — a test asserts it,
# because a template whose own canonical form does not resolve is measuring
# nothing.
#
# # Distinct phrasings are the lever, not more nouns
#
# `0.13.9` measured it: the corpus expands to eleven thousand examples but the
# verb head only ever sees **the number of ways a command has been written
# down**. Noun substitution multiplies the count without adding a single new
# sentence shape, so it teaches the tagger and nothing else. **More templates
# raise the verb rate; more reagents do not.**
#
# So each entry carries as many genuinely different ways of asking as can be
# thought of — imperative and polite, question and statement, terse and
# rambling, verb-first and object-first — rather than near-copies of one shape.
#
# # Watch for two entries collapsing into one pattern
#
# `what is in the {place}` and `what is {topic}` were the same template once the
# grammar dropped filler, and `survey` swallowed every `recall`. Function words
# are kept now (§19), but two entries opening on the same three words are still
# two entries a reader has to separate on very little evidence. Vary the openers.

