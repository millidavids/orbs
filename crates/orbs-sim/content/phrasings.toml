# The lens, the archive's maze, and the four domains that had no templates at
# all.
#
# **Seventeen of the forty-six verbs were never written down here** (§19), and
# the hole did not look like one: the reader answered *every* sentence with one
# of the twenty-nine it had been taught, confidently, because a verb with no
# examples cannot be predicted and a refusal head trained on sentences that ask
# for *nothing* has no way to refuse a sentence that asks for something
# unteachable. `send the wolves to the gate` came back `move gate`.
#
# **The two-slot shapes here are deliberately few.** `haul`, `pledge` and
# `imbue` each square their place count on expansion, which is what made `move`
# 47% of the corpus; the trainer caps a template's expansion now, so the shape
# can be written honestly without the count following it.
# ---------------------------------------------------------------------------

