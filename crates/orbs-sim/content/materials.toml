# What colour each material draws an instrument's bar in (DESIGN.md §19).
#
# A hint, never a carrier: `survey` and the panel still name everything (§14).
# One of `orbs_render::Tint`'s eight families by name — green, brown, grey,
# gold, violet, red, blue, bone — and an unknown name is a load error. No entry
# draws the base hue: "nobody has decided".
#
# Charcoal and ash are tinted as materials elsewhere; the fire ignores them and
# burns orange on every tube (§19).

# ---------------------------------------------------------------------------
# Reagents — what the pipeline starts from and passes along.
# ---------------------------------------------------------------------------

[sage]
tint = "green"

[ground-sage]
tint = "green"

[rock-salt]
tint = "bone"

[ground-salt]
tint = "bone"

[charcoal]
tint = "grey"

# Grey, from the ash, which also keeps `clarified` and `fixed` apart.
[potash]
tint = "grey"

# ---------------------------------------------------------------------------
# The ported herbs, by how `court_wizard` says each looks. A substance keeps its
# hue through every state, so the panel shows one thing changing.
# ---------------------------------------------------------------------------

[mugwort]
tint = "green"

[ground-mugwort]
tint = "green"

[valerian]
tint = "brown"

[ground-valerian]
tint = "brown"

[amber]
tint = "gold"

[powdered-amber]
tint = "gold"

# ---------------------------------------------------------------------------
# Byproducts — §10.1 gives every one of these a use, so they are as likely to be
# sitting in an instrument as any reagent.
# ---------------------------------------------------------------------------

[husks]
tint = "brown"

[ash]
tint = "grey"

[sediment]
tint = "brown"

[dregs]
tint = "brown"

[phlegm]
tint = "grey"

# ---------------------------------------------------------------------------
# Extracts — what the bath and the flask hand along.
#
# Every one tinted, or a `ready` bar goes colourless as the run finishes.
# ---------------------------------------------------------------------------

[sage-tincture]
tint = "green"

# From husks rather than from ground sage — route B, and thinner for it. Same
# family, because it is still sage.
[weak-tincture]
tint = "green"

# The ported herbs, steeped. The colour lints skip an untinted input, so a
# missing row here silences the checks downstream of it.
[mugwort-tincture]
tint = "green"

[valerian-tincture]
tint = "brown"

# Authored as the mixture they are, so the flask's averaged band and its
# product match by construction —
# `the_flasks_products_are_the_colour_of_what_makes_them` checks the recipes.
[clarified-draught]
tint = "green"
with = "bone"

[fixed-draught]
tint = "green"
with = "grey"

# Mugwort's green with amber's gold, valerian's brown with salt.
[keen-draught]
tint = "green"
with = "gold"

[quiet-draught]
tint = "brown"
with = "bone"

# Quiet-draught and a gleaning scroll's gold: the only draught that takes
# another room's work.
[stilling-draught]
tint = "brown"
with = "gold"

# ---------------------------------------------------------------------------
# Essences — the end of the pipeline.
#
# Each the colour of its draught, since the alembic's bar is the liquid in it.
# A finished run says so with `Style::SUCCESS`, not a colour (§4, §19).
# ---------------------------------------------------------------------------

# From `clarified-draught`, which is green + bone.
[clarity]
tint = "green"
with = "bone"

# From `fixed-draught`, which is green + grey.
[warding]
tint = "green"
with = "grey"

# From `weak-tincture`, which is plain green — so this one is not a mixture.
[haste]
tint = "green"

# The three another wizard knew, each the colour of its leaving, as the lint
# enforces: found on the floor.
[mending]
tint = "grey"

[dreaming]
tint = "brown"

[vigour]
tint = "brown"

# The two ported essences, each the colour of the draught it came from.
[insight]
tint = "green"
with = "gold"

[stillness]
tint = "brown"
with = "gold"

# The archive's fragment, and what four of them make. One family, one colour: a
# scroll is what its fragments become, which is the same rule the flask's
# products follow.
[fragment]
tint = "gold"

# Every scroll gold: assembled knowledge is one substance, and the name tells
# them apart.
[gleaning-scroll]
tint = "gold"

[quickening-scroll]
tint = "gold"

[verdant-scroll]
tint = "gold"

# Demons are violet, called up rather than brewed. No recipe makes one, so
# `substances` names them from `siege.toml`'s `summoned` rows.
[golem]
tint = "violet"

[familiar]
tint = "violet"

[effigy]
tint = "violet"
