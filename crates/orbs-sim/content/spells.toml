# The spells the tower already holds (DESIGN.md §8).
#
# Decisions, so loaded once, like a recipe, or replay breaks. Written as a
# player types, loose phrasing and all, and canonicalised on load, so it shows
# §8's *"the orb writes down what you meant"*.

# The first spell the player ever sees, and the one `scribe` opens onto.
#
# The opening of a loop already done by hand (§12), stopping early so the
# player finishes it. No `attend`: a spell runs where it is written for.
[first_light]
domain = "laboratory"
lines = [
    "kindle charcoal",
    "grind sage",
]
