# What the athanor burns (DESIGN.md §10.1).
#
# Its own file, since the athanor transforms nothing: fuel in, heat out.
#
# `ticks` is one burn, consumed whether or not anything is mounted, so idle lit
# time is waste — §10.1's timing pressure. A placeholder the harness sweeps.
# A charcoal outlasts a brew by a wide margin, so damping between heated
# stages is an attentive player's saving rather than a tax on every brew.

[charcoal]
ticks = 600
leaves = "ash"
