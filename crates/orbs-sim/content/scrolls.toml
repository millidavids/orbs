# What a scroll does in the calm layer, as a supply (§19, Supply).
#
# **No single scroll does anything.** `wield <scroll>` outside a siege opens its
# supply when the arsenal holds enough for the slowest rate; the word again
# raises it a rate; `stop <scroll>` closes it. While open it draws every `every`
# ticks from the moment it opened, whether or not anything uses the draw —
# leaving one open is a cost, which is what keeps it from being mindless. It
# pauses while a siege runs and cannot be opened during one.
#
# Rates as `siege.toml` writes them (`content::rate` checks both files):
#   opens  — how many the arsenal must hold to run at this rate
#   draws  — how many each draw takes
#   worth  — what a draw buys, per scroll below
#
# Separate from `siege.toml` for the reason that file is separate from
# `materials.toml`: what a scroll does on the wall and in a room are two facts.

# The laboratory runs faster for `every` ticks and one more after each draw, so
# no run starts in a gap between two. `worth` divides a run's time: 2 is half,
# 3 a third. The larger of this and a `hurried` charm applies, never both.
[quickening-scroll]
every = 300
rates = [
    { opens = 4, draws = 1, worth = 2 },
    { opens = 8, draws = 2, worth = 3 },
]

# While it is open the stacks gather rather than escape: a maze opened is set
# with `worth` spoils and no way out, and one already open is set the same when
# the supply opens. Each draw is the upkeep of that, used or not.
[gleaning-scroll]
every = 300
rates = [
    { opens = 4, draws = 1, worth = 4 },
    { opens = 8, draws = 2, worth = 6 },
]

# Cultivation. Each draw grows the next herb the laboratory has never held by
# `worth`, and at `flowers_at` it flowers on the shelf for good, endless like
# sage. Growth is kept when the supply runs dry, and the supply rolls itself up
# once every herb has flowered.
[verdant-scroll]
every = 300
flowers_at = 3
rates = [
    { opens = 4, draws = 1, worth = 1 },
    { opens = 8, draws = 2, worth = 2 },
]
