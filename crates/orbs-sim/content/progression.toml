# What work is worth, and what it buys (DESIGN.md §11.5, §19).
#
# The whole curve in one file, for the balance harness. Not hot-reloadable:
# everything here reaches a decision, so it loads once, or replay breaks.
#
# The Ley Line is the tower's, on total experience, which is never spent: a
# *step* grants, a *fork* offers `nodes` to take one. Mastery is one straight
# line per room, a station reached when its deed is done. Either may `opens`
# a room, a recipe, a charm or the wall; that is how the tower grows (§19).

# ---------------------------------------------------------------------------
# What a completed run is worth, by the instrument that did it.
#
# Binary, so finishing the chain beats repeating its first step. Keys are
# checked against `recipes.toml` at load.
# ---------------------------------------------------------------------------
[earns]
mortar_and_pestle = 1
balneum_mariae = 2
flask_and_rod = 4
alembic = 8

# The archive: the stacks walk, the lectern assembles, each the flask's 4. A
# short assembly paying what a long walk pays is the harness's question.
stacks = 4
lectern = 4

# The lens: 8 for a broken ward, the alembic's tier. The bound rate, 0.268,
# beats the flagship, and adds rather than competes, since a press takes no
# slot (§19). The oculus pays nothing, being no work.
prism = 8

# The sanctum (§10). **1 for a finished course, multiplied by how tall the
# course was** — see `execute::muster::finish`.
#
# The only entry that scales, a course being `2^n - 1` hauls. Flat at 0.125,
# under clarity's 0.140, since a course also mends the walls.
pylon = 1

# The forge, and it is the *lowest* rate in the tower on purpose.
#
# The payoff is the charm, realised elsewhere; a token 1 for the slot, since
# nought reads as broken.
lattice = 1

# The menagerie: 8, the lens's tier, full within par and three quarters past
# (`tower::worth_within_par`). A first pass, measured on the bound search (§19).
circle = 8

# ---------------------------------------------------------------------------
# THE LEY LINE — the tower's line.
#
# Stations ascending by total experience; `take` chooses a fork's node. `grants`
# is a closed set checked at load, and lands only once its code exists.
#
# Every fork holds three lanes — provision, war, craft — one node each (§19);
# `check` refuses two in a lane, derived from the grant (`tower::grant`). Craft
# is the orb, never an instrument, which is the forge's to sell. Tiers add.
#
# Stations grow by about half each, to concentration 8 (§11.5); past 56 every
# `at` is a first pass. 16 is one clarity by hand, and its reward is not doing
# it again; it opens the grimoire.
# ---------------------------------------------------------------------------
[[ley_line]]
at = 16
grants = "concentration"
opens = ["domain:grimoire"]

# The first fork, and the first choice in the game: a fifth more fuel, an edge
# on every roll at a wall the player has not seen yet, or a second instruction a
# tick. The craft node was the chant's whole reason, which could not be sung at
# one step (§19); the circle's search works at one and takes half the ticks at
# two, so it is a rate now, as it is in every other room.
[[ley_line]]
at = 24
nodes = ["fuel_1", "edge_1", "steps_1"]

# The satchel is §8's channel — a shape you could not write at all — and it
# moved here from 24 when the lanes arrived (§19).
[[ley_line]]
at = 40
nodes = ["pool_1", "floor_1", "satchel_1"]

# **56 is two clarities past the first step**, which puts it after a player has
# automated the laboratory and before they have any reason to stand at a wall.
# It opens the forge, because the forge spends the pool this step grants.
[[ley_line]]
at = 56
grants = "quintessence"
opens = ["domain:forge"]

[[ley_line]]
at = 96
grants = "concentration"

[[ley_line]]
at = 160
nodes = ["escrow_1", "garrison_1", "steps_2"]

[[ley_line]]
at = 256
grants = "concentration"

# The second cursor sells ergonomics rather than capability — two spells already
# run at once, ungated — which is why it sits this far along.
[[ley_line]]
at = 400
nodes = ["fuel_2", "mend_1", "cursors_1"]

[[ley_line]]
at = 640
grants = "concentration"

# `haste_1` is struck invariant 3 landing "as a thing you buy" (§19): a run a
# spell issued finishes a tenth sooner. The orb's speed, never the tool's.
[[ley_line]]
at = 1000
nodes = ["pool_2", "vigilance_1", "haste_1"]

[[ley_line]]
at = 1600
grants = "concentration"

[[ley_line]]
at = 2500
nodes = ["thrift_1", "edge_2", "steps_3"]

[[ley_line]]
at = 4000
grants = "concentration"

[[ley_line]]
at = 6400
nodes = ["escrow_2", "floor_2", "haste_2"]

[[ley_line]]
at = 8000
grants = "concentration"

# Concentration 8: the soft ending, and the last authored station.
[[ley_line]]
at = 10000
grants = "concentration"

# ---------------------------------------------------------------------------
# RENOWN, AND THE TEN THINGS THE TOWER IS CALLED (DESIGN.md §11.5, §19).
#
# Titles, not gates, so losing one mid-siege takes nothing away: `at` and `id`
# only. `check` refuses a track that does not ascend, and an id another track
# uses, since prose is keyed by id. The Ley Line's curve, since renown mints at
# half a run's experience; first passes. `remembered` is the soft ending.
# ---------------------------------------------------------------------------
[[renown]]
at = 25
id = "hedge_wizard"

[[renown]]
at = 60
id = "cunning_man"

[[renown]]
at = 150
id = "adept"

[[renown]]
at = 350
id = "conjurer"

[[renown]]
at = 800
id = "magister"

[[renown]]
at = 1600
id = "thaumaturge"

[[renown]]
at = 3000
id = "archmage"

[[renown]]
at = 5500
id = "arch_magus"

[[renown]]
at = 9000
id = "the_tower_itself"

[[renown]]
at = 15000
id = "remembered"

# ---------------------------------------------------------------------------
# `steps_<n>` is a contract, not a label.
#
# The script budget is automation's speed, and `spell::budget` parses the
# extra steps from the id, so no second table disagrees. Additive across forks.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# MASTERY — six lines, one per room you tend.
#
# A station is `domain`, `id`, `done` and (optionally) `opens`. `done` is one of:
#
#   done = "clarity"                     make this once, at any instrument
#   done = { potions = 5 }               that many potions, of any kind
#   done = { scrolls = 1 }               that many scrolls assembled
#   done = { at = "stacks", times = 3 }  runs finished at an instrument
#   done = { event = "figure" }          a beast held, a siege settled or
#                                        won, a spell bound, a secret learned
#
# Reached in file order within a line, each said. Ids are decisions: stored,
# and keying `mastery_<id>`, one thing across both tracks. Every `opens` is
# thematic and this is the reveal order (§19); `haste` arrives after clarity is
# automated. Every `times` is a first pass.
# ---------------------------------------------------------------------------

# The laboratory. Open at start, knowing clarity's whole chain.
[[mastery]]
domain = "laboratory"
id = "laboratory_1"
done = "clarity"
opens = ["domain:archive"]

[[mastery]]
domain = "laboratory"
id = "laboratory_2"
done = { potions = 5 }
opens = ["recipe:warding"]

[[mastery]]
domain = "laboratory"
id = "laboratory_3"
done = "warding"
opens = ["domain:sanctum"]

[[mastery]]
domain = "laboratory"
id = "laboratory_4"
done = { potions = 15 }
opens = ["recipe:insight"]

[[mastery]]
domain = "laboratory"
id = "laboratory_5"
done = "insight"
opens = ["recipe:haste"]

[[mastery]]
domain = "laboratory"
id = "laboratory_6"
done = { potions = 40 }
opens = ["recipe:stilling-draught", "recipe:stillness"]

# The archive. Its first walk is what shows the player there is a lens.
[[mastery]]
domain = "archive"
id = "archive_1"
done = { at = "stacks" }
opens = ["domain:lens"]

[[mastery]]
domain = "archive"
id = "archive_2"
done = { scrolls = 1 }
opens = ["recipe:quickening-scroll"]

[[mastery]]
domain = "archive"
id = "archive_3"
done = { at = "stacks", times = 5 }
opens = ["recipe:verdant-scroll"]

# **A charm that blesses a room opens with that room's mastery**, not the
# forge's: the forge can bless the stacks once the player has read enough of
# them for it to matter.
[[mastery]]
domain = "archive"
id = "archive_4"
done = { scrolls = 3 }
opens = ["charm:bountiful"]

[[mastery]]
domain = "archive"
id = "archive_5"
done = { at = "stacks", times = 15 }

# The lens. What it shows beyond the wall is what makes a menagerie worth
# summoning, and a player who has learned to see sabotage may turn it aside.
[[mastery]]
domain = "lens"
id = "lens_1"
done = { at = "prism" }
opens = ["domain:menagerie"]

[[mastery]]
domain = "lens"
id = "lens_2"
done = { at = "prism", times = 5 }
opens = ["charm:shielded"]

[[mastery]]
domain = "lens"
id = "lens_3"
done = { event = "secret" }

[[mastery]]
domain = "lens"
id = "lens_4"
done = { at = "prism", times = 15 }

# The grimoire has no line (§19): no work happens there. `event:bound` stays in
# the tally's closed set for a deed that wants it.

# The sanctum. A mustered course is a wall worth attacking, which is what arms
# the siege — a siege against a tower with no wall is not a decision.
[[mastery]]
domain = "sanctum"
id = "sanctum_1"
done = { at = "pylon" }
opens = ["siege"]

[[mastery]]
domain = "sanctum"
id = "sanctum_2"
done = { at = "pylon", times = 5 }
opens = ["charm:whetted"]

[[mastery]]
domain = "sanctum"
id = "sanctum_3"
done = { event = "siege" }

[[mastery]]
domain = "sanctum"
id = "sanctum_4"
done = { event = "siege_won", times = 5 }

# The menagerie. A figure is a beast held at the circle — the event kept the
# chant's name so a tally carried in a save still counts (§19).
[[mastery]]
domain = "menagerie"
id = "menagerie_1"
done = { event = "figure" }

# The second station opens the whole circle (§19): one gate before a circuit.
# `fixed`, so five lesser beasts at every length, not a lesson grown with it.
[[mastery]]
domain = "menagerie"
id = "menagerie_2"
done = { event = "figure", times = 5, fixed = true }
opens = ["circle", "demon:golem"]

# The circle's second use, widened (§19, Supply): a whole circle binds a golem
# from the second station, and the familiar and the effigy here. Late in a long
# game, which is the price of the menagerie standing in for a laboratory.
[[mastery]]
domain = "menagerie"
id = "menagerie_3"
done = { event = "figure", times = 20 }
opens = ["demon:familiar", "demon:effigy"]

# The forge. Opens at 56 knowing `hurried`, its flagship; the rest of its
# charms come with its own line, in the order a player would want them.
[[mastery]]
domain = "forge"
id = "forge_1"
done = { at = "lattice" }
opens = ["charm:fruitful"]

[[mastery]]
domain = "forge"
id = "forge_2"
done = { at = "lattice", times = 5 }

[[mastery]]
domain = "forge"
id = "forge_3"
done = { at = "lattice", times = 15 }

# ---------------------------------------------------------------------------
# LEDGER — what the tower has done, in all (§19, number go up).
#
# A row is `id`, `counts` and, if it belongs to a room, `domain`. `counts` takes
# a deed's spellings without the number:
#
#   counts = "potions"                  potions of any kind ("scrolls" too)
#   counts = { made = "clarity" }       one product
#   counts = { at = "prism" }           runs finished at an instrument
#   counts = { event = "figure" }       something a room does
#
# `status` lists every counted row, in order, with a spell's share. A room
# shows its first row beside the gauges; a row with no `domain` is the
# tower's, in `status` only.
#
# The label is prose: `ledger_<id>` in `prose.toml`.
# ---------------------------------------------------------------------------
[[ledger]]
id = "potions"
domain = "laboratory"
counts = "potions"

[[ledger]]
id = "scrolls"
domain = "archive"
counts = "scrolls"

[[ledger]]
id = "walks"
domain = "archive"
counts = { at = "stacks" }

[[ledger]]
id = "wards"
domain = "lens"
counts = { at = "prism" }

[[ledger]]
id = "courses"
domain = "sanctum"
counts = { at = "pylon" }

[[ledger]]
id = "beasts"
domain = "menagerie"
counts = { event = "figure" }

[[ledger]]
id = "charms"
domain = "forge"
counts = { at = "lattice" }

[[ledger]]
id = "held"
domain = "bailey"
counts = { event = "siege_won" }

[[ledger]]
id = "sieges"
counts = { event = "siege" }

[[ledger]]
id = "bound"
counts = { event = "bound" }

[[ledger]]
id = "secrets"
counts = { event = "secret" }
