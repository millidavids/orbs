# What work is worth, and what it buys (DESIGN.md §11.5, §19).
#
# The whole progression curve in one file, so the balance harness sweeps one
# thing rather than hunting numbers through Rust. Everything here reaches a
# decision — a weight changes what a run earns and a threshold gates a verb — so
# unlike `materials.toml` this is **not hot-reloadable**: it loads once with
# `recipes.toml` and `spells.toml`, because swapping it mid-session would break
# replay from `(seed, submissions)`.
#
# ## Experience accumulates and is never spent
#
# It only ever rises, and an upgrade opens when the total passes its number and
# stays open. That is why it is a `u64` and why a save carries one value: there
# is no balance to track and nothing to regret having spent.

# ---------------------------------------------------------------------------
# What a completed run is worth, by the instrument that did it.
#
# **Binary, so each tier of tool is worth every use of the one below it.** An
# alembic run pays what eight mortar runs pay, which is what makes finishing the
# chain worth more than repeating its first step.
#
# Keys are instrument names and are checked against `recipes.toml` at load: a
# name with no recipes would silently earn nothing, which looks exactly like an
# instrument nobody has tuned yet.
# ---------------------------------------------------------------------------
[earns]
mortar_and_pestle = 1
balneum_mariae = 2
flask_and_rod = 4
alembic = 8

# The archive, which has two instruments now. A maze is minutes of walking
# against the mortar's eight ticks, so it pays what the flask does.
#
# **The stacks is the walking and the lectern is the assembly**, and they were
# one fixture until the maze moved to its own. Both keep exactly the 4 the
# lectern paid for both halves before, so the split rebalances nothing — which
# is deliberate: a rename is a bad moment to change a number, and a 20-tick
# assembly paying what a 5000-tick walk pays is a question for the balance
# harness rather than for this change.
stacks = 4
lectern = 4

# The lens (§10). **8 for a broken ward**, which is the alembic's tier and is
# arrived at the same way the others are: measured, then checked against the
# flagship.
#
# A hand-played solve takes 5.15 presses on average over all 1296 codes, and a
# press is free and instant — so a person's rate here is bounded by how fast they
# type and not by the tower. What the economy actually sees is the *bound* rate,
# and `orbs-balance`'s `scrying` policy is what measures it: ~12 presses at two
# ticks apiece for 6, which is 0.268 per tick.
#
# **That is above the flagship, and it is additive rather than competing.** A
# press takes no production slot (`PRESS_TICKS = 0`), so a bound solver runs
# beside a full brewing loop instead of instead of one — see DESIGN.md §19,
# which records the pricing this reverses and why.
#
# **The first draft halved the yield per press past par and it is withdrawn.** At
# 23 presses that lands on a floor of 1, while the walk already pays several
# times the ticks — so the penalty double-counted and drove automated scrying
# below the maze. The tick cost does the work; `execute::scry::yield_of` only
# rewards playing well, at three quarters beyond par — and par is 6, measured
# against the 1296-code space rather than the 360 it was set against.
#
# The oculus is deliberately absent. It carries an `Operation` so `scry` is
# scoped to this room, but opening a reading is not work and pays nothing —
# `worth` returns 0 for a name this table does not price, which is the same
# answer with no line to maintain.
prism = 8

# ---------------------------------------------------------------------------
# THE LEY LINE - the straight path.
#
# Predefined, in order, with no choice anywhere in it: a step opens when the
# total passes `at`, and passing it *is* the grant. Experience is never spent
# (see above), so there is nothing to decide and nothing to save up for.
#
# `grants` is checked against a closed set at load. A word nothing implements
# would give the step nothing, which reads exactly like a step authored as a
# marker - and the track would stop half way up with this file correct on its
# face. Today the set is one word.
#
# **16 is one clarity**, arrived at rather than picked: grind 1, digest 2, grind
# 1, mix 4, distil 8. The player does the whole loop by hand once, and the reward
# is not having to do it again - which is pillar 3's promise landing as a
# mechanic rather than as a premise.
#
# §11.5's "first bound script in 30-45 minutes" is amended by this (§19): one
# clarity is about two minutes, and automation arrives early.
#
# One step, because there is nothing yet for a second to grant. `weave` draws
# this list, so a step added here appears on the screen without any code.
# ---------------------------------------------------------------------------
[[ley_line]]
at = 16
grants = "concentration"

# ---------------------------------------------------------------------------
# MASTERY - the branching tree.
#
# A tier opens when the total passes `at`, and gives exactly **one** of its
# nodes. That is what makes it a choice rather than a schedule, and it is why
# experience can stay unspendable: the tier opening is the grant, and which node
# you take is the decision.
#
# **Every node here is a marker.** `tbi` is authored, drawn and refused - there
# is nothing behind any of them yet, and the first real one is its own item.
# They are here so the shape is visible from inside the game: a player who
# reaches 24 sees a tier open and sees that a choice is coming.
#
# Ids are decisions, not prose - they are what a taken node is stored as, and
# what its sentence in `prose.toml` is keyed by. `check` refuses a duplicate,
# because two entries with one id make taking either take both.
# ---------------------------------------------------------------------------
[[mastery]]
at = 24
nodes = ["steps_1", "tbi_b"]

[[mastery]]
at = 40
nodes = ["steps_2", "tbi_d"]

# ---------------------------------------------------------------------------
# `steps_<n>` is a contract, not a label.
#
# A step of a spell costs a tick, so the script budget *is* the speed of every
# piece of automation in the game - and `spell::budget` reads these ids to know
# what it is. The number after the underscore is how many extra steps a tick the
# node grants, parsed from the id itself rather than from a second table that
# could disagree with the one `weave` draws.
#
# **Still markers, like everything else here.** Nothing can be taken in this
# version, so the budget is 1 and stays 1; what exists is the wiring and the
# shape on screen. Making the tree takeable is the weave phase's item.
#
# **Additive across tiers.** A tier grants one of its siblings, so a player who
# takes the step node in both tiers has spent both choices on speed and gets
# 1 + 1 + 2 = 4. Reading them as a maximum would refund the second silently.
# ---------------------------------------------------------------------------
