# What work is worth, and what it buys (DESIGN.md §11.5, §19).
#
# The whole progression curve in one file, so the balance harness sweeps one
# thing rather than hunting numbers through Rust. Everything here reaches a
# decision — a weight changes what a run earns, a threshold gates a verb, a deed
# opens a room — so unlike `materials.toml` this is **not hot-reloadable**: it
# loads once with `recipes.toml` and `spells.toml`, because swapping it
# mid-session would break replay from `(seed, submissions)`.
#
# ## Two tracks
#
# **The Ley Line is the tower's.** One line on total experience. A station is a
# *step* (`grants`: passing it is the grant, no choice) or a *fork* (`nodes`:
# take one). Experience accumulates and is never spent — it only ever rises, and
# a station passed stays passed — which is why a save carries one `u64` and a
# list of taken ids and nothing to regret.
#
# **Mastery is per domain.** Seven straight lines, one per room, each a list of
# stations with a `done` on it — brew a clarity, walk the stacks, close a figure.
# No choices anywhere: a station is reached when its deed is done and the one
# before it is reached, and reaching it *is* the grant.
#
# **Both may `opens` something** — a room, a recipe, a charm, or the wall — and
# that is how the tower grows: the laboratory is the whole tower at first, and
# brewing a clarity opens the archive. §19 records that the two names were
# attached the other way round when the weave shipped, and why they swapped.

# ---------------------------------------------------------------------------
# What a completed run is worth, by the instrument that did it.
#
# **Binary, so each tier of tool is worth every use of the one below it.** An
# alembic run pays what eight mortar runs pay, which is what makes finishing the
# chain worth more than repeating its first step.
#
# Keys are instrument names and are checked against `recipes.toml` at load: a
# name with no recipes would silently earn nothing, which looks exactly like an
# instrument nobody has tuned yet.
# ---------------------------------------------------------------------------
[earns]
mortar_and_pestle = 1
balneum_mariae = 2
flask_and_rod = 4
alembic = 8

# The archive, which has two instruments. A maze is minutes of walking against
# the mortar's eight ticks, so it pays what the flask does.
#
# **The stacks is the walking and the lectern is the assembly**, and they were
# one fixture until the maze moved to its own. Both keep exactly the 4 the
# lectern paid for both halves before, so the split rebalances nothing — which
# is deliberate: a rename is a bad moment to change a number, and a 20-tick
# assembly paying what a 5000-tick walk pays is a question for the balance
# harness rather than for this change.
stacks = 4
lectern = 4

# The lens (§10). **8 for a broken ward**, which is the alembic's tier and is
# arrived at the same way the others are: measured, then checked against the
# flagship.
#
# A hand-played solve takes 5.15 presses on average over all 1296 codes, and a
# press is free and instant — so a person's rate here is bounded by how fast they
# type and not by the tower. What the economy actually sees is the *bound* rate,
# and `orbs-balance`'s `scrying` policy is what measures it: ~12 presses at two
# ticks apiece for 6, which is 0.268 per tick.
#
# **That is above the flagship, and it is additive rather than competing.** A
# press takes no production slot (`PRESS_TICKS = 0`), so a bound solver runs
# beside a full brewing loop instead of instead of one — see DESIGN.md §19,
# which records the pricing this reverses and why.
#
# The oculus is deliberately absent. It carries an `Operation` so `scry` is
# scoped to this room, but opening a reading is not work and pays nothing —
# `worth` returns 0 for a name this table does not price, which is the same
# answer with no line to maintain.
prism = 8

# The sanctum (§10). **1 for a finished course, multiplied by how tall the
# course was** — see `execute::muster::finish`.
#
# It is the only entry in this table that scales, and it has to: a course is
# `2^n - 1` hauls, so a seven-ward one is sixteen times the work of a three-ward
# one and a flat number would pay the same for both. **The rate this gives is
# flat at 0.125 and then falls**: a course of `n` costs `2^n` ticks and pays
# `n - 2`, so three wards and four wards both come out at an eighth. Just under
# clarity's 0.140, and deliberately — a finished course *also* puts the walls
# back, and a domain paying twice should not also pay the best rate.
pylon = 1

# The forge, and it is the *lowest* rate in the tower on purpose.
#
# **Enchanting is the one domain whose payoff is not experience.** What a bound
# charm is worth is the charm — a mortar at half time, a stacks paying twice —
# and that value is realised in whatever room the tool is in rather than here.
# So a fall pays a token 1 for the slot it held, and nothing for the charm.
#
# It pays *something* rather than nothing because a domain earning nought is a
# domain `orbs-balance` reads as 0.0000/tick, which is indistinguishable from a
# domain that is broken — and the first sweep of this policy did exactly that.
lattice = 1

# ---------------------------------------------------------------------------
# THE LEY LINE — the tower's line.
#
# Stations in ascending order of total experience. A **step** has `grants` and
# passing it is the grant. A **fork** has `nodes`, and `take` chooses one of
# them — the tier opening costs nothing, taking a node closes it, and experience
# is still never spent. Either may `opens` something.
#
# `grants` is a closed set checked at load, and every fork node has to parse as
# a grant (`steps_<n>`, `satchel_1`, `cursors_1`): a word nothing implements
# would give the station nothing, which reads exactly like a station authored as
# a marker — and there are no markers on this line. A grant lands here only once
# the code that reads it exists.
#
# **Every fork holds three lanes** — provision, war, craft — one node each, so a
# choice is always between kinds of play (§19), and `check` refuses a fork with
# two nodes in one lane. The lane is derived from the grant (`tower::grant`),
# never authored here. Provision is the tower's supplies (fuel, the pool, what a
# siege pays, what a charm costs); war is the wall and the dice; craft is the
# orb — and never an instrument, because that is the forge's to sell.
#
# **Tiers add.** `fuel_1` and `fuel_2` taken together are three tiers of fuel,
# which is `steps_<n>`'s rule everywhere: reading them as a maximum would refund
# the second choice in silence.
#
# **The stations grow by about half each**, so `[earns]`'s doubling feel carries
# onto the line; three automated rooms stack to ~0.5 experience a tick, which is
# ~500 an hour early and ~1,500 late. Every `at` past 56 is a first pass and
# `orbs-balance` decides it. The line runs to concentration 8 — §11.5's *"~8 by
# the soft ending"*.
#
# **16 is one clarity**, arrived at rather than picked: grind 1, digest 2, grind
# 1, mix 4, distil 8. The player does the whole loop by hand once, and the reward
# is not having to do it again — which is pillar 3's promise landing as a
# mechanic rather than as a premise. It also opens the grimoire: a book appears
# when there is something to write in it.
# ---------------------------------------------------------------------------
[[ley_line]]
at = 16
grants = "concentration"
opens = ["domain:grimoire"]

# The first fork, and the first choice in the game: a fifth more fuel, an edge
# on every roll at a wall the player has not seen yet, or a second instruction a
# tick. The craft node is the menagerie's whole reason (§19).
[[ley_line]]
at = 24
nodes = ["fuel_1", "edge_1", "steps_1"]

# The satchel is §8's channel — a shape you could not write at all — and it
# moved here from 24 when the lanes arrived (§19).
[[ley_line]]
at = 40
nodes = ["pool_1", "floor_1", "satchel_1"]

# **56 is two clarities past the first step**, which puts it after a player has
# automated the laboratory and before they have any reason to stand at a wall.
# It opens the forge, because the forge spends the pool this step grants.
[[ley_line]]
at = 56
grants = "quintessence"
opens = ["domain:forge"]

[[ley_line]]
at = 96
grants = "concentration"

[[ley_line]]
at = 160
nodes = ["escrow_1", "garrison_1", "steps_2"]

[[ley_line]]
at = 256
grants = "concentration"

# The second cursor sells ergonomics rather than capability — two spells already
# run at once, ungated — which is why it sits this far along.
[[ley_line]]
at = 400
nodes = ["fuel_2", "mend_1", "cursors_1"]

[[ley_line]]
at = 640
grants = "concentration"

# `haste_1` is struck invariant 3 landing "as a thing you buy" (§19): a run a
# spell issued finishes a tenth sooner. The orb's speed, never the tool's.
[[ley_line]]
at = 1000
nodes = ["pool_2", "vigilance_1", "haste_1"]

[[ley_line]]
at = 1600
grants = "concentration"

[[ley_line]]
at = 2500
nodes = ["thrift_1", "edge_2", "steps_3"]

[[ley_line]]
at = 4000
grants = "concentration"

[[ley_line]]
at = 6400
nodes = ["escrow_2", "floor_2", "haste_2"]

[[ley_line]]
at = 8000
grants = "concentration"

# Concentration 8: the soft ending, and the last authored station.
[[ley_line]]
at = 10000
grants = "concentration"

# ---------------------------------------------------------------------------
# RENOWN, AND THE TEN THINGS THE TOWER IS CALLED (DESIGN.md §11.5, §19).
#
# **Titles, not gates.** A rank unlocks nothing, which is what makes losing one
# safe: a rank that gated a capability could take it away mid-siege, in the fight
# that needed it. What a rank does is *name* where the tower stands, and that is
# the whole of it - so `[[renown]]` carries `at` and `id` and nothing else.
#
# **Ten, and they must ascend.** `check` refuses a track that does not, and
# refuses an id already used by a Ley node or a mastery station, because an id is
# what prose is keyed by and a duplicate would make one of them unreachable.
#
# The curve is the Ley Line's shape - about half again each step - because renown
# is minted at half a run's experience, so the two climb together and a player
# reads them side by side on the same screen. Every number is a first pass and
# `orbs-balance` decides it.
#
# The names run from a hedge-wizard nobody has heard of to a title that is not a
# rank at all: `remembered` is what is left when the tower is gone, and it is
# where the line stops for the same reason concentration 8 is - it is the soft
# ending, said the other way round.
# ---------------------------------------------------------------------------
[[renown]]
at = 25
id = "hedge_wizard"

[[renown]]
at = 60
id = "cunning_man"

[[renown]]
at = 150
id = "adept"

[[renown]]
at = 350
id = "conjurer"

[[renown]]
at = 800
id = "magister"

[[renown]]
at = 1600
id = "thaumaturge"

[[renown]]
at = 3000
id = "archmage"

[[renown]]
at = 5500
id = "arch_magus"

[[renown]]
at = 9000
id = "the_tower_itself"

[[renown]]
at = 15000
id = "remembered"

# ---------------------------------------------------------------------------
# `steps_<n>` is a contract, not a label.
#
# A step of a spell costs a tick, so the script budget *is* the speed of every
# piece of automation in the game — and `spell::budget` reads these ids to know
# what it is. The number after the underscore is how many extra steps a tick the
# node grants, parsed from the id itself rather than from a second table that
# could disagree with the one `weave` draws.
#
# **Additive across forks.** A fork grants one of its siblings, so a player who
# takes the step node at both forks has spent both choices on speed and gets
# 1 + 1 + 2 = 4. Reading them as a maximum would refund the second silently.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# MASTERY — seven lines, one per room.
#
# A station is `domain`, `id`, `done` and (optionally) `opens`. `done` is one of:
#
#   done = "clarity"                     make this once, at any instrument
#   done = { potions = 5 }               that many potions, of any kind
#   done = { scrolls = 1 }               that many scrolls assembled
#   done = { at = "stacks", times = 3 }  runs finished at an instrument
#   done = { event = "figure" }          a figure closed, a siege settled or
#                                        won, a spell bound, a secret learned
#
# Stations are reached in the file's order within a line: a player who has
# brewed forty potions before their first clarity reaches every laboratory
# station at once when the clarity lands, and each is said.
#
# **Ids are decisions, not prose** — they are what a reached station is stored
# as, and what its sentence in `prose.toml` (`mastery_<id>`) is keyed by. An id
# names one thing across both tracks.
#
# **Every `opens` is thematic, and this is the reveal order** (§19): the
# laboratory is open at start; a clarity of mind opens the old shelves; the
# stacks hold a scroll on far-seeing; the lens shows what waits beyond the wall;
# a warding potion and the wall it belongs on; the forge opens with the pool it
# spends. Gating the laboratory's own recipes is progressive reveal inside the
# room — and `haste`, the fastest experience in the game (§19), now arrives
# after the player has automated clarity.
#
# Every `times` is a first pass. `orbs-balance` decides them.
# ---------------------------------------------------------------------------

# The laboratory. Open at start, knowing clarity's whole chain.
[[mastery]]
domain = "laboratory"
id = "laboratory_1"
done = "clarity"
opens = ["domain:archive"]

[[mastery]]
domain = "laboratory"
id = "laboratory_2"
done = { potions = 5 }
opens = ["recipe:warding"]

[[mastery]]
domain = "laboratory"
id = "laboratory_3"
done = "warding"
opens = ["domain:sanctum"]

[[mastery]]
domain = "laboratory"
id = "laboratory_4"
done = { potions = 15 }
opens = ["recipe:insight"]

[[mastery]]
domain = "laboratory"
id = "laboratory_5"
done = "insight"
opens = ["recipe:haste"]

[[mastery]]
domain = "laboratory"
id = "laboratory_6"
done = { potions = 40 }
opens = ["recipe:stillness"]

# The archive. Its first walk is what shows the player there is a lens.
[[mastery]]
domain = "archive"
id = "archive_1"
done = { at = "stacks" }
opens = ["domain:lens"]

[[mastery]]
domain = "archive"
id = "archive_2"
done = { scrolls = 1 }
opens = ["recipe:quickening-scroll"]

[[mastery]]
domain = "archive"
id = "archive_3"
done = { at = "stacks", times = 5 }
opens = ["recipe:verdant-scroll"]

# **A charm that blesses a room opens with that room's mastery**, not the
# forge's: the forge can bless the stacks once the player has read enough of
# them for it to matter.
[[mastery]]
domain = "archive"
id = "archive_4"
done = { scrolls = 3 }
opens = ["charm:bountiful"]

[[mastery]]
domain = "archive"
id = "archive_5"
done = { at = "stacks", times = 15 }

# The lens. What it shows beyond the wall is what makes a menagerie worth
# summoning, and a player who has learned to see sabotage may turn it aside.
[[mastery]]
domain = "lens"
id = "lens_1"
done = { at = "prism" }
opens = ["domain:menagerie"]

[[mastery]]
domain = "lens"
id = "lens_2"
done = { at = "prism", times = 5 }
opens = ["charm:shielded"]

[[mastery]]
domain = "lens"
id = "lens_3"
done = { event = "secret" }

[[mastery]]
domain = "lens"
id = "lens_4"
done = { at = "prism", times = 15 }

# **The grimoire has no line, and that is the decision** (§19). It had three
# stations counting spells bound - a deed done wherever you happen to be rather
# than in the room - and they opened nothing. The room raises no instrument,
# earns nothing and anchors no verb, so its rail box read `idle` for ever.
# `domain_of` has always documented it as one of the two places that are *not
# somewhere work happens*, and §19 said the same three phases earlier. It is
# still where every spell lives and still shut until the ley step at 16; it is
# simply not a room you tend.
#
# `event:bound` stays in the tally's closed set. Nothing asks for it today, and
# a deed that wants it later can - the count is honest either way.

# The sanctum. A mustered course is a wall worth attacking, which is what arms
# the siege — a siege against a tower with no wall is not a decision.
[[mastery]]
domain = "sanctum"
id = "sanctum_1"
done = { at = "pylon" }
opens = ["siege"]

[[mastery]]
domain = "sanctum"
id = "sanctum_2"
done = { at = "pylon", times = 5 }
opens = ["charm:whetted"]

[[mastery]]
domain = "sanctum"
id = "sanctum_3"
done = { event = "siege" }

[[mastery]]
domain = "sanctum"
id = "sanctum_4"
done = { event = "siege_won", times = 5 }

# The menagerie. A figure closed is a chant sung to its end.
[[mastery]]
domain = "menagerie"
id = "menagerie_1"
done = { event = "figure" }

[[mastery]]
domain = "menagerie"
id = "menagerie_2"
done = { event = "figure", times = 5 }

[[mastery]]
domain = "menagerie"
id = "menagerie_3"
done = { event = "figure", times = 20 }

# The forge. Opens at 56 knowing `hurried`, its flagship; the rest of its
# charms come with its own line, in the order a player would want them.
[[mastery]]
domain = "forge"
id = "forge_1"
done = { at = "lattice" }
opens = ["charm:fruitful"]

[[mastery]]
domain = "forge"
id = "forge_2"
done = { at = "lattice", times = 5 }

[[mastery]]
domain = "forge"
id = "forge_3"
done = { at = "lattice", times = 15 }
