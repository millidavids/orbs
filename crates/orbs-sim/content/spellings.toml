    "take {name} away from the satchel",
    "get hold of {name} from the satchel",
    "fetch a {name} down from the satchel",
    "{name} out of the satchel please",
]

# `{group}s` is the plural, and it reads back as the set: the assembler takes
# `ways` to `way`, because `for each ways` would parse and then walk nothing.
[[entry]]
canonical = "for each {group}"
say = [
    "for every {group}",
    "go through each {group}",
    "take each {group} in turn",
    "one {group} at a time",
    "for all the {group}s",
    "work through the {group}s",
    "each {group} in turn",
    "walk every {group}",
    "run through the {group}s",
