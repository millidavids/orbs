# How people write the things a spell does (DESIGN.md §8, §19 *the scrivener*).
#
# `phrasings.toml`'s format and loader (`Phrasings::spellings`), canonicals
# being spell statements. Control flow only: command lines train from
# `phrasings.toml`, one corpus.
#
# Little expands here, so every phrasing is authored one for one. A count must
# be in the line; nothing generates one. Write the loose form, never the
# canonical, and vary the openers.

# ---------------------------------------------------------------------------
# What a free-text slot is filled with. The world has no noun for either.
#
# `{name}` is a player's word, kept out of the vocabulary so it arrives hashed,
# as an invented one does; the holdout has its own. `{group}` is closed: the
# sets the tower raises (`tests/scrivener.rs`).
# ---------------------------------------------------------------------------

