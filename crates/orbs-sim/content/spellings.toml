# The satchel is not a slot — every one in the tower is called `satchel` — but it
# is not supplied either. It is the only word that says a line is about a satchel
# at all, so every phrasing here says it.
[[entry]]
canonical = "pull {name} from satchel"
say = [
    "take a {name} out of the satchel",
    "get {name} from the satchel",
    "draw {name} from the satchel",
    "fetch {name} out of the satchel",
    "pick {name} out of the satchel",
    "lift {name} from the satchel",
    "take {name} off the satchel",
    "help yourself to {name} from the satchel",
    "collect {name} from the satchel",
    "have {name} out of the satchel",
    "{name} comes from the satchel",
    "retrieve {name} from the satchel",
    "draw a {name} out of the satchel",
    "pull a {name} off the satchel",
]
