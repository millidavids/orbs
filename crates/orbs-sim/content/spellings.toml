# How people write the things a spell does (DESIGN.md §8, §19 *the scrivener*).
#
# Same format as `phrasings.toml`, same loader, same expansion — see
# `Phrasings::spellings`. What differs is the output space: these canonicals are
# **spell statements**, not commands.
#
# # Control flow only
#
# A spell's *command* lines are the prompt's vocabulary and are already written
# down next door. A reader for spells trains its command class from
# `phrasings.toml`; copying two thousand lines here would be one corpus in two
# files, free to drift apart.
#
# # This corpus cannot be grown by adding nouns
#
# `phrasings.toml` gets its size from expansion: one `grind {reagent}` template
# becomes thirty-odd examples because the game names thirty-odd reagents, and
# `0.13.9` measured that noun substitution *"multiplies the count without adding
# a single new sentence shape"*. Control flow has almost nothing to expand over —
# `end` takes no argument at all — so **every phrasing here is authored
# one-for-one**, and the count in this file is the corpus.
#
# # A count must be in the line
#
# `bide 10` is only ever offered for a line that *says* ten, as a digit or a
# number word. *"hang about a while"* has no number in it, and inventing one
# would be generation — which nothing in this feature does. Such a line is left
# exactly as the player wrote it.
#
# # Write the loose form, never the canonical one
#
# A `say` line that is already valid spell syntax teaches the reader to rewrite
# what needed no rewriting, and the refusals at the bottom are the lines the gate
# keeps from the reader and the measurement holds untouched. Vary the openers:
# `when`, `once`, `while`, `as soon as` and `the moment` are all different
# sentences and the reader has to tell them apart from `if` on very little
# evidence.

# ---------------------------------------------------------------------------
# What a free-text slot is filled with. The world has no noun for either.
#
# `{name}` is a word the player chose — `let best be north`, `pull herb from
# satchel`. These are kept **out of the reader's vocabulary** on purpose: a name
# a player invents reaches the reader as a hash bucket, so the ones it learns from
# arrive the same way. The holdout's names are its own, so what the reader is
# measured on is a name it has never seen.
#
# `{group}` is a set `for each` walks, and the list is closed: it must be exactly
# the sets the tower raises, which `tests/scrivener.rs` holds.
# ---------------------------------------------------------------------------

