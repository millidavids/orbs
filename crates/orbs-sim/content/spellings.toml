    "with every {group}",
    "over each of the {group}s",
    "for each of the {group}s",
    "handle each {group}",
    "go by every {group}",
    "{group} by {group}",
]
holdout = [
    "for every one of the {group}s",
    "take the {group}s one by one",
    "through each {group} in turn",
    "do it for all {group}s",
]

# ---------------------------------------------------------------------------
# Not statements.
#
# Lines already right, the gate's population, never taught:
# `spell::reads_cleanly` keeps them from the reader, and `measure.rs --spells`
# holds them untouched at 100% (§19). Refusals a reader is shown come from
# `phrasings.toml`.
# ---------------------------------------------------------------------------

[[refusal]]
say = [
    "if {place} is idle",
    "if {place} is empty",
    "repeat 3",
    "repeat until {place} is idle",
    "bide 10",
    "let {name} be {place}",
    "pull {name} from satchel",
    "for each {group}",
    "end",
    "else",
    "else if {place} is idle",
    "part morning()",
    "morning()",
    "alongside morning()",
    "wait {place}",
    "if not {place} is idle",
    "if {place} is idle and {place} is empty",
]
holdout = [
    "if {place} has {reagent}",
    "repeat 5",
    "bide 30",
    "pull {name} satchel",
    "part gathering(here, there)",
]
