# ---------------------------------------------------------------------------
# Not statements.
#
# **The half a corpus of loose lines cannot supply.** A reader shown only
# phrasings that *should* be rewritten rewrites everything — including lines that
# were already right, which is how §19's four rewriter defects went unnoticed.
#
# **The gate's population, not the reader's.** Nearly every one is a spell
# statement already in canonical form, so `spell::reads_cleanly` keeps it from
# the scrivener and `Corpus::spells` drops it before training: these are not
# taught, by design — the reader is never shown one. What they are for is the
# population `examples/measure.rs --spells` holds to 100%, which is the claim
# that a working line is never touched. Sentences a reader *is* shown and must
# refuse come from `phrasings.toml`.
#
# Replacing them with sentences about the tower that a reader would be shown was
# tried in the review after `0.14.5`, and cost more than it bought — DESIGN.md
# §19, *The review*.
# ---------------------------------------------------------------------------

[[refusal]]
say = [
    "if {place} is idle",
    "if {place} is empty",
    "repeat 3",
    "repeat until {place} is idle",
    "bide 10",
    "let {name} be {place}",
    "pull {name} from satchel",
    "for each {group}",
    "end",
    "else",
    "else if {place} is idle",
    "part morning()",
    "morning()",
    "alongside morning()",
    "wait {place}",
    "if not {place} is idle",
    "if {place} is idle and {place} is empty",
]
holdout = [
    "if {place} has {reagent}",
    "repeat 5",
    "bide 30",
    "pull {name} satchel",
    "part gathering(here, there)",
]
