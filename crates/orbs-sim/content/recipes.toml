# What each instrument does to what is put in it (DESIGN.md §10.1).
#
# One table per instrument, each one shape, so a material's state decides what
# fires rather than a memorised sequence.
#
#   mortar_and_pestle   one reagent  -> one reagent          (preprocess)
#   balneum_mariae      one reagent  -> one reagent          (process, needs heat)
#   flask_and_rod       two reagents -> one reagent          (combine)
#   alembic             one reagent  -> a potion             (distil, needs heat)
#
# `leaves` is the byproduct, and every byproduct has a use (§10.1), or `purge`
# is tidying. `ticks` are placeholders the balance harness sweeps. `heat = true`
# needs the athanor lit, written here rather than inferred from a name.

# ---------------------------------------------------------------------------
# mortar_and_pestle - grinding. No heat.
# ---------------------------------------------------------------------------

[[mortar_and_pestle]]
input = "sage"
output = "ground-sage"
leaves = "husks"
ticks = 8

[[mortar_and_pestle]]
input = "rock-salt"
output = "ground-salt"
leaves = "husks"
ticks = 8

# Ash grinds into what the flask wants, so the athanor's waste is not litter.
# Byproducts are the laboratory's mechanic alone.
[[mortar_and_pestle]]
input = "ash"
output = "potash"
leaves = "husks"
ticks = 6

# ---------------------------------------------------------------------------
# The ported herbs, and the two potions they reach.
#
# Names and character from `../court_wizard`'s historical herbs, not its
# effects. Off the shelf at the start: a `verdant-scroll` grows one, and what is
# unlockable is derived — known to the vocabulary, made by no recipe.
# ---------------------------------------------------------------------------

[[mortar_and_pestle]]
input = "mugwort"
output = "ground-mugwort"
leaves = "husks"
ticks = 8

[[mortar_and_pestle]]
input = "valerian"
output = "ground-valerian"
leaves = "husks"
ticks = 8

# A resin rather than a stalk, and the mortar still leaves husks - which is the
# mortar's leaving whatever went in, as `rock-salt` and `ash` already show.
[[mortar_and_pestle]]
input = "amber"
output = "powdered-amber"
leaves = "husks"
ticks = 8

# ---------------------------------------------------------------------------
# balneum_mariae - gentle digestion over the athanor. Needs heat.
# ---------------------------------------------------------------------------

[[balneum_mariae]]
input = "ground-sage"
output = "sage-tincture"
leaves = "sediment"
ticks = 12
heat = true

[[balneum_mariae]]
input = "husks"
output = "weak-tincture"
leaves = "sediment"
ticks = 10
heat = true

[[balneum_mariae]]
input = "ground-mugwort"
output = "mugwort-tincture"
leaves = "sediment"
ticks = 12
heat = true

[[balneum_mariae]]
input = "ground-valerian"
output = "valerian-tincture"
leaves = "sediment"
ticks = 12
heat = true

# ---------------------------------------------------------------------------
# flask_and_rod - combination. Two in, one out. No heat.
# ---------------------------------------------------------------------------

[[flask_and_rod]]
inputs = ["sage-tincture", "ground-salt"]
output = "clarified-draught"
leaves = "dregs"
ticks = 10

# The second route to the same draught (§10.1): husks instead of sage, slower,
# since waste costs time and stock costs stock. Weak-tincture is haste at the
# alembic or half a clarity here, the second decision.
[[flask_and_rod]]
inputs = ["weak-tincture", "ground-salt"]
output = "clarified-draught"
leaves = "dregs"
ticks = 14

[[flask_and_rod]]
inputs = ["sage-tincture", "potash"]
output = "fixed-draught"
leaves = "dregs"
ticks = 10

# The two ported draughts. **Amber is a fixative rather than a steeping**, which
# is why it goes in whole from the mortar and never through the bath: it is the
# thing that holds a volatile extract together long enough to distil.
[[flask_and_rod]]
inputs = ["mugwort-tincture", "powdered-amber"]
output = "keen-draught"
leaves = "dregs"
ticks = 10

[[flask_and_rod]]
inputs = ["valerian-tincture", "ground-salt"]
output = "quiet-draught"
leaves = "dregs"
ticks = 10

# Stillness's first price: a scroll from the archive, carried through the
# arsenal into the flask. Opened with stillness itself.
[[flask_and_rod]]
inputs = ["quiet-draught", "gleaning-scroll"]
output = "stilling-draught"
ticks = 20
gated = true

# Dregs and sediment are not litter: together they make the salt the alembic
# needs to fix a distillation.
[[flask_and_rod]]
inputs = ["dregs", "sediment"]
output = "rock-salt"
leaves = "husks"
ticks = 6

# Phlegm is the watery fraction a distillation throws off. On its own it is the
# most useless thing in the laboratory, which is exactly why it must have a use
# (§10.1) - cut with potash it slakes back into workable salt.
[[flask_and_rod]]
inputs = ["phlegm", "potash"]
output = "rock-salt"
leaves = "dregs"
ticks = 8

# ---------------------------------------------------------------------------
# alembic - distillation. Needs heat. The only instrument that yields a potion.
#
# `yields = 3`: a distillation makes a batch. Potions are spent by volume, never
# one at a time (§19, Supply), and the tower still counts the run, not the batch.
# ---------------------------------------------------------------------------

# The one long stage, the one worth watching, and long enough that the liquid
# climbs slower than its bubbles.
[[alembic]]
input = "clarified-draught"
output = "clarity"
leaves = "phlegm"
ticks = 56
potion = true
yields = 3
heat = true

# ---------------------------------------------------------------------------
# THE THREE THE LABORATORY EARNS (§11.5, `progression.toml`).
#
# `gated = true`: a mastery station opens it, and until then it reads `fouled`.
# `haste`, the fastest experience (§19), comes after clarity is automated.
# ---------------------------------------------------------------------------
[[alembic]]
input = "fixed-draught"
output = "warding"
leaves = "phlegm"
ticks = 14
potion = true
yields = 3
heat = true
gated = true

[[alembic]]
input = "weak-tincture"
output = "haste"
leaves = "phlegm"
ticks = 12
potion = true
yields = 3
heat = true
gated = true

[[alembic]]
input = "keen-draught"
output = "insight"
leaves = "phlegm"
ticks = 40
potion = true
yields = 3
heat = true
gated = true

# ---------------------------------------------------------------------------
# THE THREE ANOTHER WIZARD KNEW (§10, `lens/`).
#
# `secret = true`: found in a broken ward's log, `fouled` until then. In reveal
# order, since `execute::scry` takes the first unfound. Each is one step over a
# byproduct, a second use for something thrown away.
[[alembic]]
input = "potash"
output = "mending"
leaves = "phlegm"
ticks = 30
potion = true
yields = 3
heat = true
secret = true

[[alembic]]
input = "sediment"
output = "dreaming"
leaves = "phlegm"
ticks = 34
potion = true
yields = 3
heat = true
secret = true

[[alembic]]
input = "dregs"
output = "vigour"
leaves = "phlegm"
ticks = 36
potion = true
yields = 3
heat = true
secret = true

# The laboratory's last station opens this one — forty brews in. It ends a
# siege, so it costs: ten minutes of the alembic and most of the tower's
# quintessence (§19). Three a run, its threshold, so one brew can be drunk:
# `most`, its one-held cap, is retired, and the brew is the price (§19, Supply).
[[alembic]]
input = "stilling-draught"
output = "stillness"
leaves = "phlegm"
ticks = 600
potion = true
yields = 3
heat = true
gated = true
quintessence = 20

# ---------------------------------------------------------------------------
# athanor - fuel, not recipes: `fuel.toml`.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# lectern - the archive. Assembly, not transformation.
#
# Four fragments from walking the stacks make a scroll: one generic fragment,
# since four drawn kinds made collecting attrition with no decision. `count`
# makes four of one work. It leaves nothing, and needs no heat.
#
# `outputs` is drawn, not fixed, since nothing about four fragments could
# decide; a list, since `Recipes::matching` takes the first match and three
# blocks would leave two unreachable. The draw is uniform, and
# `every_scroll_the_lectern_makes_can_be_spent` refuses a scroll that does
# nothing.
# ---------------------------------------------------------------------------
#
# Two of the three are gated per output (§11.5), so the gleaning scroll is not
# sealed behind the others' stations.
[[lectern]]
input = "fragment"
count = 4
outputs = ["gleaning-scroll", "quickening-scroll", "verdant-scroll"]
ticks = 20
# Two of one draw, since a scroll does nothing alone (§19, Supply, `0.18.6`).
yields = 2
scroll = true
gated = ["quickening-scroll", "verdant-scroll"]
