# What a charm costs and how long it lasts (DESIGN.md §10, §11.5).
#
# Authored, so a tuning pass is a content edit (rule 6). Every key is a
# `charm::Kind`, and one with no variant fails the load.
#
# `costs`  — quintessence, spent on the settle that binds it, never on a
#            failed attempt (§11.5).
# `lasts`  — ticks. §5.0 makes a tick a second, so 600 is ten minutes.
# `takes`  — ticks of the tower's one production slot, while the lattice is open.
#
# ---------------------------------------------------------------------------
# THE SURCHARGE.
#
# Dearer during a siege, the forge neglecting the wall; a multiplier, so it
# scales with the charm.
[surcharge]
besieged = 2

# ---------------------------------------------------------------------------
# THE CHARMS.
#
# First-pass prices: a full 24 holds two cheap charms or one dear one.

# The flagship, and the one the phase's exit criterion names: a buffed instrument
# visibly works faster. Cheapest, because it is the one a player meets first.
[hurried]
costs = 6
lasts = 600
takes = 20

# A run yields one more than the recipe says. Dearer than haste because it
# compounds: a laboratory under this produces more per lit tick *and* per slot.
[fruitful]
costs = 8
lasts = 600
takes = 24

# A walk of the stacks pays an extra fragment. Long, because the archive's loop
# is measured in thousands of ticks and a ten-minute charm would cover one walk.
[bountiful]
costs = 6
lasts = 900
takes = 20

# A die rolls one size up.
#
# Priced on the measured forty points of hit rate (`siege.toml`): the dearest
# ordinary charm, and short.
[whetted]
costs = 10
lasts = 600
takes = 28

# A sabotage strike lands and is turned aside.
#
# Buys off a pillar (§8.1), so the dearest: temporary, per node, and the first
# to go if it plays badly.
[shielded]
costs = 12
lasts = 1200
takes = 32
