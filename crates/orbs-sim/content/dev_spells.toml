# Known-good spells for a tester, in the builds a tester runs (DESIGN.md §19).
#
# **Not player-facing, and that is the whole point.** `spells.toml` ships
# `first_light` deliberately unfinished because §12 wants the player to finish
# the first automation themselves — *"it stops before the interesting part on
# purpose"*. A working maze solver handed over the same way would be the answer
# to the archive's central puzzle, `back` included, which DESIGN.md §19 records
# was only found by measuring twenty mazes.
#
# So these are reached by `debug_spell`, which is `cfg(debug_assertions)` like
# `debug_spawn`. This file is `include_str!`'d under the same `cfg`, so a release
# build has neither the word nor the text.
#
# **Parsed separately from `Spells`, never merged into it.** The `Spells`
# resource is spawned into `/grimoire` at construction, so merging would put
# these on the shelf before anybody asked for them — changing `peruse`, the
# scene's `Script` nouns and the boot report, in the one build where a tester is
# trying to see what the game does.
#
# Lines are written the way a player would type them, loose phrasing and all,
# and are canonicalised on the way in like any other spell.

# The ladder that solves a maze, whichever errand it is on.
#
# **Twenty-four rungs in six tiers**, and the order is the whole algorithm:
#
#   spoil             — something to gather, only a gleaning maze publishes it
#   exit              — the way out, only an ordinary maze publishes it
#   passage           — floor nobody has walked
#   1 or fewer marks — walked least, and not the way you came
#   2 or more marks  — walked most, and not the way you came
#   back              — the way you came, and only when there is nothing else
#
# **The two middle tiers compare a number**, where they used to name `walked` and
# `twice`. Those were two buckets over a count the maze had all along, so a
# square walked nine times read exactly like one walked twice and the ladder
# could not prefer the less-trodden of two ways it had both already seen.
#
# **`and not <way> has wall` is on the `or fewer` rung and nowhere else**, and it
# is load-bearing. A comparison answers truthfully about absence, so a thing that
# is not there counts as nought — right for a shelf, where `2 or fewer sage` with
# no sage is exactly what a restock guard means, and fatal here, because a wall
# publishes no count and would satisfy every `or fewer` rung in the maze. The
# `or more` rung needs no guard: nought is never two.
#
# **`spoil` and `exit` are both here, which is what makes one file serve both
# errands.** A gleaning maze withdraws the way out entirely and an ordinary one
# scatters nothing, so the tier that does not apply is simply never true — no
# branch on the errand is needed, and `if the stacks has gleaning` is available
# for a spell that wants to do something *else* per errand.
#
# **`and not <way> has back` is what makes this a solver rather than something
# that resembles one.** Trémaux's rule is *"turn back only when you must"*, and
# without the `back` exclusion a fixed compass order sends the reading straight
# where it came from at any junction where two ways read alike, and it cycles for
# ever. §19 records that the four-tier ladder without it solved 7x7 backtracker
# mazes and nothing harder.
#
# **`else` throughout, not twenty-four bare `if`s.** A flat ladder casts clean
# and oscillates: the passage tier steps into a fresh cell and four lines later
# the same lap reads the cell just left as walked and steps straight back.
# `else` is what says *"the first rung that matches, then stop"*.
#
# **It solves the maze in front of it and stops there.** An earlier draft opened
# the next one itself — `if the stacks is idle / research / end` at the top — and
# it was the wrong thing twice over: a tester cannot see *one* walk's yield
# because the count keeps climbing, and a test asserting "five spoils ended the
# walk" reads fourteen. Re-issuing `research` is one word; a ladder that cannot
# be observed for a single maze is not much of an instrument.
#
# **`repeat until the stacks is idle` is the bound, and it used to be a guess.**
# This said `repeat 20000` — a figure chosen to outlast the longest gleaning walk
# because the language had no way to say *until the maze closes* — and the
# surplus laps then spun doing nothing once it had. That guessed constant is what
# `until` exists to delete.
#
# 20000 laps outlast the longest gleaning walk. An exit walk finishes early and
# the surplus laps find nothing to do, which costs ticks and nothing else.
[threading]
domain = "archive"
lines = [
    "repeat until the stacks is idle",
    "    if north has spoil",
    "        follow north",
    "    else if east has spoil",
    "        follow east",
    "    else if south has spoil",
    "        follow south",
    "    else if west has spoil",
    "        follow west",
    "    else if north has exit",
    "        follow north",
    "    else if east has exit",
    "        follow east",
    "    else if south has exit",
    "        follow south",
    "    else if west has exit",
    "        follow west",
    "    else if north has passage",
    "        follow north",
    "    else if east has passage",
    "        follow east",
    "    else if south has passage",
    "        follow south",
    "    else if west has passage",
    "        follow west",
    # **These two tiers are what a real minimum would replace, and cannot yet.**
    # `north has no more marks than east` is expressible now — but a *walled*
    # east reads as nought marks, so a comparison against every other way is
    # false unless this one is unwalked too, and every rung dies. Selecting the
    # least-marked way among the ones that are *open* is a filter over a list,
    # which is the next step's job, not a comparison's. §19 records it.
    "    else if north has 1 or fewer marks and not north has back and not north has wall",
    "        follow north",
    "    else if east has 1 or fewer marks and not east has back and not east has wall",
    "        follow east",
    "    else if south has 1 or fewer marks and not south has back and not south has wall",
    "        follow south",
    "    else if west has 1 or fewer marks and not west has back and not west has wall",
    "        follow west",
    "    else if north has 2 or more marks and not north has back",
    "        follow north",
    "    else if east has 2 or more marks and not east has back",
    "        follow east",
    "    else if south has 2 or more marks and not south has back",
    "        follow south",
    "    else if west has 2 or more marks and not west has back",
    "        follow west",
    "    else if north has back",
    "        follow north",
    "    else if east has back",
    "        follow east",
    "    else if south has back",
    "        follow south",
    "    else if west has back",
    "        follow west",
    "    else",
    "    end",
    "end",
]

# Four fragments into the lectern, and the scroll they make.
#
# **The counted `has` is the whole point of this one.** Without it a spell cannot
# tell one fragment from four, so the only way to write this was `repeat 4 / move
# / end` fired blind — which moves whatever is there, wields a short lectern, and
# logs *"the lectern can do nothing with fragment"* on every lap for ever. The
# guard makes the spell wait instead, in silence, until there is enough.
#
# **At least four, not exactly four**, which is why a fifth fragment does not
# stop it: a walk pays into the cabinet while this is running, and a guard that
# only fired at exactly four would jam the moment the solver got ahead of it.
#
# The scroll is left in the lectern for `empty lectern`, deliberately: emptying
# from inside the loop would make the spell wait out its own twenty-tick
# assembly every lap.
# The sweep that breaks a ward, and the reason the lens is automatable at all.
#
# **It cannot deduce**, and that is a fact about §8's language rather than about
# this file: there are no variables, so a spell cannot turn `aligned 2, astray 1`
# into a next guess. What it *can* do is move one thing at a time and read which
# way the answer went — which is the whole of what a codemaker ever says.
#
# **One socket at a time, left to right, and nothing else moves.** That is what
# repeated sigils bought (§19): a dial used to *exchange* with whichever socket
# held the sigil you wanted, so `aligned` rising could not be attributed to
# either — and the ward needed a ratchet, a settle-lock and a per-socket tally of
# untried sigils to be solvable at all. All three were the orb keeping the
# player's notes. With one socket moving, the answer is unambiguous:
#
#   further   `aligned` fell, and only this socket moved — so it was right
#             before. Put it back and press again to re-sync the baseline.
#   closer    `aligned` rose the same way — this socket has arrived. Leave it.
#   level     neither; keep turning.
#
# **Termination is a proof, not a budget.** A socket's walk starts one step off a
# sigil that is *not* the code's and steps cyclically through six, so it reaches
# the code's within five — and only that arrival can raise `aligned`.
#
# **The restore rung is worth 1.9 presses.** Without it a socket that was already
# right pays six turns to come all the way round; with it, two. Measured over all
# 1296 codes: **11.93 presses, worst 21**, against 13.80 and 24 for the plain
# sweep and a deducing player's 5.15. That gap is the domain, not a defect — a
# bound solver earns less per ward and runs while the player is in the
# laboratory, which is §8's argument for automation landing through concurrency
# rather than through speed.
#
# **The re-press after a restore is load-bearing.** The deltas are measured
# against the *previous press*, so restoring without pressing leaves the next
# rung comparing against a figure that was never sent. Solves 924 of 1296.
#
# **Both bounds are about the ward closing under the spell's feet**, which is a
# thing that happens on one solve in six: the last socket to arrive can be the
# second or the third, and every rung after it would then be dialling at nothing.
#
#   `if the prism is working`    wraps each rung. Without it the next rung's
#                                `probe` opens a *fresh* ward and dials into it
#                                from the middle of a sweep whose restore
#                                literals assume the opening aperture.
#   `until not ... has level`    bounds the walk. `until ... has closer` looks
#                                like the same thing and is not: a closed ward
#                                publishes *nothing*, so `has closer` answers a
#                                flat no and the loop goes round for ever — which
#                                is exactly what it did, probing a new ward open
#                                and disturbing it. `level` is what the walk is
#                                waiting to stop seeing, and its absence stops
#                                the loop the same way its answer does.
#
# The spell ends instead of thrashing, and `bind` re-casts it from the top, which
# is how the faucet laps.
#
# **`is empty` is the wrong word for the working question** — `spell::watch`
# answers `empty` by asking whether the node has *children*, and a prism's
# children are its published readings, of which there are none until the first
# press lands.
#
# **`has level`, not `is level`.** `Condition::Is` takes a closed three-word
# vocabulary — idle/free/still, working/busy/running, empty/bare — so a reading
# is always asked for with `has`.
#
# The four restore literals are the opening aperture, which `Ward::new` fixes at
# nitre, alum, borax, quartz precisely so that a spell can name them.
[breaking]
domain = "lens"
lines = [
    "probe",

    "if the prism is working",
    "    dial first",
    "    probe",
    "    if the prism has further",
    "        dial first nitre",
    "        probe",
    "    else",
    "        repeat until not the prism has level",
    "            dial first",
    "            probe",
    "        end",
    "    end",
    "end",

    "if the prism is working",
    "    dial second",
    "    probe",
    "    if the prism has further",
    "        dial second alum",
    "        probe",
    "    else",
    "        repeat until not the prism has level",
    "            dial second",
    "            probe",
    "        end",
    "    end",
    "end",

    "if the prism is working",
    "    dial third",
    "    probe",
    "    if the prism has further",
    "        dial third borax",
    "        probe",
    "    else",
    "        repeat until not the prism has level",
    "            dial third",
    "            probe",
    "        end",
    "    end",
    "end",

    "if the prism is working",
    "    dial fourth",
    "    probe",
    "    if the prism has further",
    "        dial fourth quartz",
    "        probe",
    "    else",
    "        repeat until not the prism has level",
    "            dial fourth",
    "            probe",
    "        end",
    "    end",
    "end",
]

[assembling]
domain = "archive"
lines = [
    "repeat 200",
    "    if the cabinet has 4 fragment",
    "        repeat 4",
    "            move fragment to lectern",
    "        end",
    "        wield lectern",
    "    end",
    "end",
]

# The same maze, written with a variable and a set — 15 lines against
# `threading`'s 52, and a better algorithm inside them.
#
# **This is what `for each` and `let` are for**, and it is worth reading beside
# `threading` rather than instead of it. Where the ladder unrolls six tiers by
# four ways because the language could not say *"the way with the fewest marks"*,
# this says it: an accumulator, and three passes that each narrow what it holds.
#
#   any open way          - the fallback, and the reason a dead end works
#   not the way back      - preferred, when there is one
#   the least walked      - of those, and a **true minimum** rather than
#                           `threading`'s two buckets over the same count
#
# **Later loops override earlier ones**, so the priority reads bottom-up. The
# `passage` tier `threading` needs is subsumed: an unwalked way publishes no
# `marks` at all, which counts as nought, so it is already the minimum.
#
# **Fewer lines is not fewer ticks, and that is measured.** §8 charges a step per
# line, so three passes over four ways cost ~27 steps a move where the ladder
# short-circuits at the first rung that fires. A fourth and fifth pass — `exit`
# and `spoil`, which would make this the same algorithm as `threading` — were
# written, and at ~45 steps a move seed 3 stopped finishing inside 7200 ticks.
# That is §19's step-cost decision arriving as a number rather than an argument:
# legibility now, speed when the weave's steps-per-tick nodes are takeable.
#
# **The seed value must be a way that might be walled.** `let best be north`
# looks wrong and is not: the first pass overwrites it with an open way, and the
# only world where it survives is one with no open way at all, which a carved
# maze does not have.
[roaming]
domain = "archive"
lines = [
    "repeat until the stacks is idle",
    "    let best be north",
    "    for each way",
    "        if way has no wall",
    "            let best be way",
    "        end",
    "    end",
    "    for each way",
    "        if way has no wall and no back",
    "            let best be way",
    "        end",
    "    end",
    "    for each way",
    "        if way has no wall and no back and fewer marks than best",
    "            let best be way",
    "        end",
    "    end",
    "    follow best",
    "end",
]

# The sanctum, solved by the cyclic Tower of Hanoi (§10, `tower::pylon`).
#
# **This is the spell the domain was designed around**, and it is the first one
# in the game that genuinely needs `part` *and* `let` together. It is worth
# reading beside `breaking`: both automate a puzzle whose difficulty is
# bookkeeping, and both work by holding a **rule** rather than a memory.
#
# # The algorithm
#
# Between any two stations exactly one haul is legal, unless both are empty. So
# the whole solution is a rotation: keep taking the legal haul between the three
# pairs of stations in order, and the course assembles itself at the barrier in
# `2^n - 1` hauls, which is optimal.
#
# **Which rotation depends on the parity, and that is the whole decision.** For
# an even course the least ward travels wellspring -> conduit -> barrier; for an
# odd one it goes the other way round. Get it backwards and the course still
# finishes — in the **conduit**, with the barrier no better than it was.
# `the_parity_is_what_decides_the_cycle_and_getting_it_wrong_is_visible` is that
# failure pinned as a test.
#
# That is why `odd` is published at all, and why `height_for` jitters the height:
# without the jitter a player learns their tower's number and hard-codes the
# cycle, and the one thing this puzzle asks anybody to read stops being read.
#
# # Four traps, all of them found by running it
#
# **`is empty` works only because an empty station publishes nothing.**
# `spell::watch` answers `empty` by asking whether a node has children, so the
# two emptiness rungs below depend on `execute::muster::publish` raising
# `potency` *only* while a station holds a ward. It is the lens's `is empty` trap
# in reverse.
#
# **The emptiness rungs come first, and must.** A station with no `potency`
# counts as nought, so `has fewer potency than` puts an empty station below
# everything — a ladder that compared first would haul onto an empty station from
# a full one and call it the lesser. Verbatim the maze's *"a walled way publishes
# no marks"*.
#
# **The guard is inside `between()`, not around the loop.** `repeat until` is
# asked at the end of a pass, so the last pass issues up to two more calls after
# the course is already assembled. Guarding the part guards all three calls for
# two lines — the lens's *"wrap each phase in `if the prism is working`"* again.
#
# **`muster` is the first line.** Without it the pylon is idle, `repeat until` is
# satisfied before the first pass, the loop runs zero times and the spell ends
# having done nothing — and a *bound* one does that for ever. It is also what
# makes this a faucet: `bind::stand` recasts every lap, so a held `holding` draws
# a fresh course each time and the barrier never fails.
[holding]
domain = "sanctum"
lines = [
    "muster",
    "part between(here, there)",
    "    if the pylon is working",
    "        if here is empty",
    "            haul there here",
    "        else if there is empty",
    "            haul here there",
    "        else if here has fewer potency than there",
    "            haul here there",
    "        else",
    "            haul there here",
    "        end",
    "    end",
    "end",
    "if the pylon has odd",
    "    let near be barrier",
    "    let far be conduit",
    "else",
    "    let near be conduit",
    "    let far be barrier",
    "end",
    "repeat until the pylon is idle",
    "    between(wellspring, near)",
    "    between(wellspring, far)",
    "    between(near, far)",
    "end",
]

# **The one spell in the game that does not work at one step a tick, and that is
# the design rather than a defect** (§19).
#
# Identifying which of four lanes is next costs a tick per rung, and a syllable
# is only four ticks from the rule - so at `SCRIPT_BUDGET` the orb can reach the
# first two lanes in time and not the last two, and the figure collapses.
# Measured at two steps a tick: **twelve of twelve struck, the figure closes.**
# So the menagerie is the domain that *rewards concentration* - unautomatable
# until the weave grants a second step, and solved outright once it does.
#
# **The shape is the puzzle, and it took `bide until` going away to become one.**
# This was an `else if` ladder with a `bide until` in every branch, and it read
# the delay straight off the circle - so nothing was computed, and §19 records
# the withdrawal. The reading went with the word: with `until` still answerable,
# `repeat until the circle has 1 until` / `end` is the same cheat spelled as a
# one-tick spin.
#
# What is left has to keep its own time, and three things follow from that. All
# three were measured, not reasoned about:
#
# - **`for each syllable`, never an `else if` ladder.** A ladder short-circuits,
#   so the lane it finds on the first rung is reached three ticks before the one
#   it finds on the fourth - and a `sing` that arrives at a different offset
#   every lap cannot sit in a two-tick window. The loop always walks all four,
#   which makes the pass **constant length**. Measured at two steps a tick: the
#   ladder strikes **nought of twelve**, this strikes twelve.
# - **`let`, and the `sing` *outside* the loop.** Singing where the lane is found
#   puts the strike at a variable offset again; binding the answer and singing
#   after the loop closes puts it at a fixed one. This is what `let` is for and
#   it is the only shape in the game that needs it this way.
# - **No `bide` at all.** The pass comes out level with `PACE` on its own, and a
#   `bide 2` breaks it - measured: two struck, then the figure comes apart. The
#   arithmetic a player does here is *"what does my loop already cost"*, which is
#   the honest question, rather than *"what number goes in the delay"*.
#
# **Still the one spell that does not work at one step a tick, and still by
# design** (§19). At `SCRIPT_BUDGET` the pass runs long and the best any
# arrangement reaches is three of twelve before the figure collapses; at two
# steps a tick this closes the figure on every seed tried (0, 3, 11, 17, 42) for
# four troops. The menagerie is the domain that *rewards concentration* -
# unautomatable until the weave grants a second step, solved outright once it
# does.
#
# **`repeat until the circle is empty`, never `is idle`.** A circle is idle
# whether or not a chant is running - `is idle` was satisfied before the first
# pass, the loop ran zero times, and the spell ended having done nothing. A
# running chant publishes readings, so `is empty` is the question that separates
# them. That cost four experiments to find.
[chanting]
domain = "menagerie"
lines = [
    "summon",
    "repeat until the circle is empty",
    "    for each syllable",
    "        if syllable has next",
    "            let note be syllable",
    "        end",
    "    end",
    "    sing note",
    "end",
]

# ===========================================================================
# §8's channel: one spell handing another a name, and one spell in two places.
#
# **Two spells always ran at once.** `invoke` from inside a spell inserts a
# second `Running` and the caller does not block — ungated, at concentration 0 —
# so neither of these is a demonstration that concurrency exists. What they show
# is the thing that was missing: something for two cursors to *say* to each
# other, which is the satchel.
#
# Both need `satchel_1` from the loom, and `coursing` needs `cursors_1` as well.
# `debug_take satchel_1` is the short road; the long one is 24 experience.
# ===========================================================================

# The producer half of a work list, and it is deliberately three lines long.
#
# **A spell that does nothing but name things.** What it queues is not a plan or
# a schedule — it is three reagents, in the order somebody wants them ground —
# and the whole point is that a *second* spell decides what to do about them.
# Everything a spell could compute before died with the spell that computed it.
#
# It runs off the end after three lines and stops, which is the shape to notice:
# a producer does not have to outlive its consumer, because the satchel holds
# what it left behind.
[ordering]
domain = "laboratory"
lines = [
    "queue sage",
    "queue rock-salt",
    "queue sage",
]

# The consumer half — **two spells, one channel** (§8).
#
# `invoke ordering` starts the producer and does **not** wait for it: the caller
# carries straight on to the next line. That is the whole reason for the `bide`.
#
# **`bide 2` is load-bearing and looks like superstition.** `advance` snapshots
# the running list, so a spell cast this tick starts on the *next* — and the
# guard below is `repeat until the satchel is empty`, which is true of an empty
# satchel. Without the pause the loop is satisfied before the producer has
# queued anything, runs zero times, and the spell ends having done nothing,
# silently. That is `repeat until the circle is idle` (§19) arriving through a
# different door, and it is the trap a player writing their first pipeline will
# fall into.
#
# **`grind herb` then `empty mortar_and_pestle`** is `tending`'s loop, and the
# `empty` is what paces this: it blocks while the mortar works, so the consumer
# runs at the mortar's speed and the queue is what absorbs the difference.
#
# Three loads, `+1` each. `peruse laboratory.log` is where a spell's own records
# go.
[milling]
domain = "laboratory"
lines = [
    "invoke ordering",
    "bide 2",
    "repeat until the satchel is empty",
    "    pull herb from satchel",
    "    grind herb",
    "    empty mortar_and_pestle",
    "end",
]

# **One spell in two places at once** — `holding` split down the middle (§8).
#
# The sanctum's cyclic solver in two halves: a cursor that works out *which pair
# of stations comes next* and puts the pair in the satchel, and a cursor that
# takes two names out and hauls between them. It solves a real course in
# `2^n - 1` hauls, which is optimal — the same number `holding` reaches — so
# nothing here is a demonstration standing in for work.
#
# **What it is actually for is the shape.** `holding` computes and hauls on one
# cursor, so its loop body is the plan and the move welded together; this one can
# be read as two things because it *is* two things.
#
# Four things worth knowing before writing another forked spell:
#
# - **`alongside planning(...)` rather than `planning(...)`.** A call suspends
#   the caller until the part returns and a fork does not: the line after it runs
#   on the caller's very next step. A `planning()` here would never come back,
#   because its loop only ends when the course does.
# - **The parity is read once, before the fork, and handed over in the
#   brackets.** A part's brackets are the whole of what it can see (§19), and
#   here that is a feature rather than a cost: the planner cannot accidentally
#   read a `near` the mover has since rebound.
# - **`if the satchel is empty` is backpressure, and it is the player's to
#   write.** The planner is six queues a lap against a mover that spends nine
#   steps on one haul, so without a guard it fills the satchel to `DEPTH` and
#   then refuses, once a lap, for the rest of the course. Refilling only when the
#   queue has drained is what keeps the log readable — and it is the first thing
#   in this language that reads like a real pipeline.
# - **`pull` twice, then one call.** The satchel holds one name at a time, so a
#   pair is two names in order — which is why the queue is a queue rather than a
#   pile, and why `Satchel::put` refuses at the cap instead of dropping its front.
#   A queue that forgot the oldest name would hand the mover a *station* out of
#   order, and a wrong haul looks exactly like a wrong algorithm.
[coursing]
domain = "sanctum"
lines = [
    "part between(here, there)",
    "    if here is empty",
    "        haul there here",
    "    else if there is empty",
    "        haul here there",
    "    else if here has fewer potency than there",
    "        haul here there",
    "    else",
    "        haul there here",
    "    end",
    "end",
    "part planning(near, far)",
    "    repeat until the pylon is idle",
    "        if the satchel is empty",
