# Known-good spells for a tester, in the builds a tester runs (DESIGN.md §19).
#
# Not player-facing: these are the answers the player is meant to find (§12,
# §19). Debug builds only, `include_str!`'d under the same `cfg` as
# `debug_spell`. Parsed apart from `Spells` and shelved in a debug build.
# Written as a player types and canonicalised on the way in.

# The ladder that solves a maze, whichever errand it is on.
#
# **Twenty-four rungs in six tiers**, and the order is the whole algorithm:
#
#   spoil             — something to gather, only a gleaning maze publishes it
#   exit              — the way out, only an ordinary maze publishes it
#   passage           — floor nobody has walked
#   1 or fewer marks — walked least, and not the way you came
#   2 or more marks  — walked most, and not the way you came
#   back              — the way you came, and only when there is nothing else
#
# The middle tiers compare the count. `and not <way> has wall` guards the
# `or fewer` rung alone, since a wall publishes no count and nought is fewer.
# `spoil` and `exit` both, so one file serves both errands. `not <way> has back`
# makes it a solver — turn back only when you must (§19). `else` throughout, so
# one move a lap. It solves one maze and stops, `until the stacks is idle`.
[threading]
domain = "archive"
lines = [
    "repeat until the stacks is idle",
    "    if north has spoil",
    "        follow north",
    "    else if east has spoil",
    "        follow east",
    "    else if south has spoil",
    "        follow south",
    "    else if west has spoil",
    "        follow west",
    "    else if north has exit",
    "        follow north",
    "    else if east has exit",
    "        follow east",
    "    else if south has exit",
    "        follow south",
    "    else if west has exit",
    "        follow west",
    "    else if north has passage",
    "        follow north",
    "    else if east has passage",
    "        follow east",
    "    else if south has passage",
    "        follow south",
    "    else if west has passage",
    "        follow west",
    # Two buckets over the count, since a comparison reads a walled way as
    # nought; `roaming` takes the true minimum with `for each` and `let` (§19).
    "    else if north has 1 or fewer marks and not north has back and not north has wall",
    "        follow north",
    "    else if east has 1 or fewer marks and not east has back and not east has wall",
    "        follow east",
    "    else if south has 1 or fewer marks and not south has back and not south has wall",
    "        follow south",
    "    else if west has 1 or fewer marks and not west has back and not west has wall",
    "        follow west",
    "    else if north has 2 or more marks and not north has back",
    "        follow north",
    "    else if east has 2 or more marks and not east has back",
    "        follow east",
    "    else if south has 2 or more marks and not south has back",
    "        follow south",
    "    else if west has 2 or more marks and not west has back",
    "        follow west",
    "    else if north has back",
    "        follow north",
    "    else if east has back",
    "        follow east",
    "    else if south has back",
    "        follow south",
    "    else if west has back",
    "        follow west",
    "    else",
    "    end",
    "end",
]

# The sweep that breaks a ward. It cannot deduce, so it moves one socket at a
# time, left to right, and reads which way `aligned` went (§19):
#
#   further   `aligned` fell, and only this socket moved — so it was right
#             before. Put it back and press again to re-sync the baseline.
#   closer    `aligned` rose the same way — this socket has arrived. Leave it.
#   level     neither; keep turning.
#
# Each walk reaches the code's sigil within five, the only arrival that raises
# `aligned`. The restore rung saves 1.9 presses — 11.93 on average over 1296
# codes, worst 21, against a deducing player's 5.15 — and its re-press re-syncs
# the baseline the next delta is measured from.
#
# The ward can close mid-sweep, so `if the prism is working` wraps each rung,
# and `until not ... has level` bounds a walk, since a closed ward publishes
# nothing and `has closer` would loop for ever. `bind` re-casts it. `has`, not
# `is`, which takes only the closed state words. The restore literals are the
# opening aperture `Ward::new` fixes.
[breaking]
domain = "lens"
lines = [
    "probe",

    "if the prism is working",
    "    dial first",
    "    probe",
    "    if the prism has further",
    "        dial first nitre",
    "        probe",
    "    else",
    "        repeat until not the prism has level",
    "            dial first",
    "            probe",
    "        end",
    "    end",
    "end",

    "if the prism is working",
    "    dial second",
    "    probe",
    "    if the prism has further",
    "        dial second alum",
    "        probe",
    "    else",
    "        repeat until not the prism has level",
    "            dial second",
    "            probe",
    "        end",
    "    end",
    "end",

    "if the prism is working",
    "    dial third",
    "    probe",
    "    if the prism has further",
    "        dial third borax",
    "        probe",
    "    else",
    "        repeat until not the prism has level",
    "            dial third",
    "            probe",
    "        end",
    "    end",
    "end",

    "if the prism is working",
    "    dial fourth",
    "    probe",
    "    if the prism has further",
    "        dial fourth quartz",
    "        probe",
    "    else",
    "        repeat until not the prism has level",
    "            dial fourth",
    "            probe",
    "        end",
    "    end",
    "end",
]

# Four fragments into the lectern. The counted `has` waits for at least four,
# since a walk may pay in more meanwhile. The scroll stays for `empty lectern`,
# or each lap waits out its own assembly.
[assembling]
domain = "archive"
lines = [
    "repeat 200",
    "    if the cabinet has 4 fragment",
    "        repeat 4",
    "            move fragment to lectern",
    "        end",
    "        wield lectern",
    "    end",
    "end",
]

# The same maze, written with a variable and a set — 15 lines against
# `threading`'s 52, and a better algorithm inside them.
#
# An accumulator and three narrowing passes, each overriding the last:
#
#   any open way          - the fallback, so a dead end works
#   not the way back      - preferred, when there is one
#   the least walked      - a true minimum; unwalked counts as nought
#
# Fewer lines, not fewer ticks: ~27 steps a move against the ladder's
# short-circuit, and `exit` and `spoil` passes made it too slow (§19).
# `let best be north` is overwritten by the first pass in any carved maze.
[roaming]
domain = "archive"
lines = [
    "repeat until the stacks is idle",
    "    let best be north",
    "    for each way",
    "        if way has no wall",
    "            let best be way",
    "        end",
    "    end",
    "    for each way",
    "        if way has no wall and no back",
    "            let best be way",
    "        end",
    "    end",
    "    for each way",
    "        if way has no wall and no back and fewer marks than best",
    "            let best be way",
    "        end",
    "    end",
    "    follow best",
    "end",
]

# The sanctum, solved by the cyclic Tower of Hanoi (§10, `tower::pylon`).
#
# A rule, not a memory, needing `part` and `let`. Between two stations one haul
# is legal, so the solution is a rotation over the three pairs, optimal at
# `2^n - 1`. The parity picks the rotation; backwards, the course finishes in
# the conduit (`the_parity_is_what_decides_the_cycle_and_getting_it_wrong_is_visible`).
# `height_for` jitters the height so the parity must be read.
#
# Four traps:
#
# - `is empty` works because an empty station publishes no `potency`.
# - The emptiness rungs come first, since a missing `potency` reads nought.
# - The guard is inside `between()`, since `repeat until` is asked at the end
#   of a pass.
# - `muster` first, or the loop runs zero times; a bound one recasts a fresh
#   course every lap.
[holding]
domain = "sanctum"
lines = [
    "muster",
    "part between(here, there)",
    "    if the pylon is working",
    "        if here is empty",
    "            haul there here",
    "        else if there is empty",
    "            haul here there",
    "        else if here has fewer potency than there",
    "            haul here there",
    "        else",
    "            haul there here",
    "        end",
    "    end",
    "end",
    "if the pylon has odd",
    "    let near be barrier",
    "    let far be conduit",
    "else",
    "    let near be conduit",
    "    let far be barrier",
    "end",
    "repeat until the pylon is idle",
    "    between(wellspring, near)",
    "    between(wellspring, far)",
    "    between(near, far)",
    "end",
]

# The menagerie's search: every circle in order until one holds (§19). Three
# `repeat 6` loops around a bare `limn` make an odometer over all 216. It always
# holds — a mean of 68 calls, worst 174 — where a reader of the table needs one:
# the orb earns by running while you are elsewhere.
#
# - `if the circle is working` at every level, so nothing is refused after a
#   hold, and the tail stays short.
# - Literal counts, since a nested `for each humour` would shadow itself.
# - At a lesser circle the outer glyphs are refused as dark while it searches,
#   and it still holds.
#
# Step, then call: the opening is never a solution.
[taming]
domain = "menagerie"
lines = [
    "summon",
    "repeat 6",
    "    if the circle is working",
    "        repeat 6",
    "            if the circle is working",
    "                repeat 6",
    "                    if the circle is working",
    "                        limn widdershins",
    "                        summon",
    "                    end",
    "                end",
    "                if the circle is working",
    "                    limn sunwise",
    "                end",
    "            end",
    "        end",
    "        if the circle is working",
    "            limn keystone",
    "        end",
    "    end",
    "end",
]

# **The same search, told what the logic already rules out** (§19) — a mean of 38
# calls where `taming` takes 68, and a worst of 90 against 174.
#
# Two facts from `recall`, neither needing a variable:
#
# - `fervour` narrows the keystone; each rung is its whole list, which
#   `tower::circle`'s proofs check both ways.
# - De Morgan halves sunwise: every hold has a dual on the same rung, so two
#   steps between tries lose nothing.
#
# It works from wherever the circle stands, and `trying()` guards its own
# `limn`.
[winnowing]
domain = "menagerie"
lines = [
    "summon",
    "part sweep()",
    "    repeat 3",
    "        repeat 6",
    "            if the circle is working",
    "                limn widdershins",
    "                summon",
    "            end",
    "        end",
    "        if the circle is working",
    "            limn sunwise",
    "            limn sunwise",
    "        end",
    "    end",
    "end",
    "part trying(guess)",
    "    if the circle is working",
    "        limn keystone guess",
    "        sweep()",
    "    end",
    "end",
    "if the circle has exactly 1 fervour",
    "    trying(yoke)",
    "    trying(eschew)",
    "else if the circle has exactly 2 fervour",
    "    trying(yoke)",
    "    trying(eschew)",
    "    trying(oppose)",
    "    trying(mirror)",
    "else if the circle has exactly 3 fervour or the circle has exactly 5 fervour",
    "    trying(yoke)",
    "    trying(spurn)",
    "    trying(heed)",
    "    trying(eschew)",
    "else if the circle has exactly 6 fervour",
    "    trying(spurn)",
    "    trying(heed)",
    "    trying(oppose)",
    "    trying(mirror)",
    "else if the circle has exactly 7 fervour",
    "    trying(spurn)",
    "    trying(heed)",
    "else",
    "    trying(yoke)",
    "    trying(spurn)",
    "    trying(heed)",
    "    trying(eschew)",
    "    trying(oppose)",
    "    trying(mirror)",
    "end",
]

# ===========================================================================
# §8's channel: one spell handing another a name, and one spell in two places.
#
# Two spells always ran at once; the satchel is what two cursors say to each
# other. Both need `satchel_1`, and `coursing` `cursors_1` (`debug_take`).
# ===========================================================================

# The producer: it only names things, for a second spell to act on, and stops,
# since the satchel outlives it.
[ordering]
domain = "laboratory"
lines = [
    "queue sage",
    "queue rock-salt",
    "queue sage",
]

# The consumer half — **two spells, one channel** (§8).
#
# `invoke` does not wait, and the producer starts next tick, so `bide 2`, or
# the loop over an empty satchel runs zero times (§19). `empty` paces it to
# the mortar. Its records are in `laboratory.log`.
[milling]
domain = "laboratory"
lines = [
    "invoke ordering",
    "bide 2",
    "repeat until the satchel is empty",
    "    pull herb from satchel",
    "    grind herb",
    "    empty mortar_and_pestle",
    "end",
]

# **One spell in two places at once** — `holding` split down the middle (§8).
#
# A planner cursor queues the next pair, a mover hauls it, optimal as
# `holding`; the point is the shape, plan and move apart. Before forking:
#
# - `alongside`, not a call, which would never return.
# - The parity goes in the brackets, all a part can see (§19).
# - `if the satchel is empty` is backpressure, or the planner fills it and
#   is refused every lap.
# - `pull` twice per haul, a queue in order, so `Satchel::put` refuses at the
#   cap rather than drop its front.
[coursing]
domain = "sanctum"
lines = [
    "part between(here, there)",
    "    if here is empty",
    "        haul there here",
    "    else if there is empty",
    "        haul here there",
    "    else if here has fewer potency than there",
    "        haul here there",
    "    else",
    "        haul there here",
    "    end",
    "end",
    "part planning(near, far)",
    "    repeat until the pylon is idle",
    "        if the satchel is empty",
    "            queue wellspring",
    "            queue near",
    "            queue wellspring",
    "            queue far",
    "            queue near",
    "            queue far",
    "        end",
    "    end",
    "end",
    "muster",
    "if the pylon has odd",
    "    alongside planning(barrier, conduit)",
    "else",
    "    alongside planning(conduit, barrier)",
    "end",
    "repeat until the pylon is idle",
    "    pull here from satchel",
    "    pull there from satchel",
    "    between(here, there)",
    "end",
]

# The decision tree that fights a siege — the bailey's `threading` (§5.1).
#
# The shape the domain exists for, each rung a published word. Separate `if`s
# by urgency, each opening a supply once (`has no draw`), so several flow:
#
#   hurt         — standing but worn. Fight back into them
#   outnumbered  — the ratio the language cannot express, published as a word
#
#   few          — the line is thin. A golem the circle bound fills the gaps
#
# `hold` is outside the ladder, every lap, or a quiet siege never advances.
# `until the rampart has lifted`, the siege's question: a band is never
# childless, and `the enemy has routed` is false for ever in a loss (§19).
# `warding`, not the secret `mending`, which a new player cannot name.
[besieging]
domain = "bailey"
lines = [
    "defend",
    "repeat until the rampart has lifted",
    "    if the garrison has few",
    "        if the golem has no draw",
    "            deploy golem",
    "        end",
    "    end",
    "    if the garrison has hurt",
    "        if the warding has no draw",
    "            quaff warding",
    "        end",
    "    end",
    "    if the enemy has outnumbered",
    "        if the clarity has no draw",
    "            quaff clarity",
    "        end",
    "    end",
    "    hold",
    "end",
]

# The telegraph, read: a declared intent makes a turn prevention (§5.1).
#
#   volley     — fewer attackers, and the garrison does not strike back at all.
#                **Spend no *bonus*.** `warding` adds to rolls the garrison will
#                not make, so an open warding skips its draw that round, as a
#                heal at full strength does
#   onslaught  — everyone, and they roll at +2. The round to brace for
#   advance    — ordinary. Ride it out
#
# A bonus only on a round you swing in: knowing what is wasted, not frugality.
[answering]
domain = "bailey"
lines = [
    "defend",
    "repeat until the rampart has lifted",
    "    if the rampart has onslaught",
    "        if the garrison has hurt",
    "            if the warding has no draw",
    "                quaff warding",
    "            end",
    "        end",
    "    end",
    "    hold",
    "end",
]

# The arsenal as a decision (§11.5): this spends only on `few`, `besieging` on
# `hurt`, and neither is right. Run both on one seed and read `status`.
[sparing]
domain = "bailey"
lines = [
    "defend",
    "repeat until the rampart has lifted",
    "    if the garrison has few",
    "        if the warding has no draw",
    "            quaff warding",
    "        end",
    "    end",
    "    hold",
    "end",
]

# Time to think: a siege waits for `hold`, so looking costs nothing (§5.0).
# It looks first, walking `for each band`, and acts second.
[bulwark]
domain = "bailey"
lines = [
    "defend",
    "part look()",
    "    for each band",
    "        survey band",
    "    end",
    "end",
    "part answer()",
    "    if the garrison has hurt",
    "        if the warding has no draw",
    "            quaff warding",
    "        end",
    "    end",
    "end",
    "repeat until the rampart has lifted",
    "    look()",
    "    answer()",
    "    hold",
    "end",
]

# The allocation, read off the telegraph (§5.1): three dice, four places.
#
#   onslaught  — everyone, and at +2. Everything behind the buckler
#   volley     — fewer of them, and you do not swing back. The line is `moot`,
#                so the dice go into succour instead and come back as mettle
#   advance    — ordinary. Strike harder and end it sooner
#
# `if the coffer has` before every pledge, or a refusal spends an instruction.
# The d20 goes where a bad roll costs least, so dice are named, not walked.
[steadfast]
domain = "bailey"
lines = [
    "defend",
    "repeat until the rampart has lifted",
    "    if the rampart has onslaught",
    "        if the coffer has d20",
    "            pledge d20 to buckler",
    "        end",
    "        if the coffer has d8",
    "            pledge d8 to buckler",
    "        end",
    "    else if the rampart has volley",
    "        if the coffer has d20",
    "            pledge d20 to succour",
    "        end",
    "        if the coffer has d8",
    "            pledge d8 to buckler",
    "        end",
    "    else",
    "        if the coffer has d20",
    "            pledge d20 to line",
    "        end",
    "        if the coffer has d8",
    "            pledge d8 to buckler",
    "        end",
    "    end",
    "    if the coffer has d6",
    "        pledge d6 to succour",
    "    end",
    "    hold",
    "end",
]

# The generic allocator: `for each area`, filling whatever is empty. `has no
# moot` is implied by `is empty` today and kept, since that is incidental.
#
# It ties `steadfast` on seventeen seeds: at three dice, allocating at all
# matters more than allocating well, a tuning signal to judge by playing.
[warding_off]
domain = "bailey"
lines = [
    "defend",
    "repeat until the rampart has lifted",
    "    for each area",
    "        if area is empty",
    "            if area has no moot",
    "                if the coffer has d20",
    "                    pledge d20 to area",
    "                else if the coffer has d8",
    "                    pledge d8 to area",
    "                else if the coffer has d6",
    "                    pledge d6 to area",
    "                end",
    "            end",
    "        end",
    "    end",
    "    hold",
    "end",
]

# The thrifty one: quintessence makes not spending a move. Found nowhere else:
#
#   for each die                  - walks the three rather than naming them, so
#                                   a fourth die would need no new line
#   than the die has quintessence - the far side reads a *different* word over
#                                   there. `Elsewhere` can only compare one
#                                   reading in two places, and "what I hold"
#                                   against "what this costs" is two
#   than double the garrison      - the ratio the readings used to answer with a
#                                   published word, now asked directly
#
# The double negative is *at least as many* (§19), since `more than` is strict;
# the long way on purpose, as the worked example. `aim` holds the big die for
# rounds that need it.
[sparingly]
domain = "bailey"
lines = [
    "defend",
    "repeat until the rampart has lifted",
    "    if the enemy has more spears than double the garrison",
    "        if the clarity has no draw",
    "            quaff clarity",
    "        end",
    "    end",
    "    for each die",
    "        if not the coffer has fewer quintessence than die",
    "            if the enemy has more than 55 aim",
    "                pledge die to buckler",
    "            else if the garrison has hurt",
    "                pledge die to succour",
    "            end",
    "        end",
    "    end",
    "    hold",
    "end",
]

# ---------------------------------------------------------------------------
# THE FORGE (§10's Enchanting).
#
# The lookup table lives in the player's spell: eight residues, eight top rows,
# universal over all 512 boards (`tower::lattice`). The world holds the state,
# the spell the rule (§8.1). All lit has no rung; it falls through to `anneal`.
[forging]
domain = "forge"
lines = [
    "imbue mortar_and_pestle hurried",
    "repeat until the lattice is empty",
    "    if the apex has lit and the belt has lit and the hem has no lit",
    "        snap belt",
    "        snap hem",
    "    else if the apex has lit and the belt has no lit and the hem has lit",
    "        snap apex",
    "        snap belt",
    "        snap hem",
    "    else if the apex has lit and the belt has no lit and the hem has no lit",
    "        snap apex",
    "    else if the apex has no lit and the belt has lit and the hem has lit",
    "        snap apex",
    "        snap belt",
    "    else if the apex has no lit and the belt has lit and the hem has no lit",
    "        snap apex",
    "        snap hem",
    "    else if the apex has no lit and the belt has no lit and the hem has lit",
    "        snap hem",
    "    else if the apex has no lit and the belt has no lit and the hem has no lit",
    "        snap belt",
    "    end",
    "    anneal",
    "end",
]

# Maintenance: `ebbing` says a charm is nearly out, so nothing counts ticks
# (§8.1); `has no graced` is the cold start. Bound, so it lasts.
[tending_forge]
domain = "forge"
lines = [
    "if the hurried has ebbing or the hurried has no graced",
    "    imbue mortar_and_pestle hurried",
    "    repeat until the lattice is empty",
    "        if the apex has lit and the belt has lit and the hem has no lit",
    "            snap belt",
    "            snap hem",
    "        else if the apex has lit and the belt has no lit and the hem has lit",
    "            snap apex",
    "            snap belt",
    "            snap hem",
    "        else if the apex has lit and the belt has no lit and the hem has no lit",
    "            snap apex",
    "        else if the apex has no lit and the belt has lit and the hem has lit",
    "            snap apex",
    "            snap belt",
    "        else if the apex has no lit and the belt has lit and the hem has no lit",
    "            snap apex",
    "            snap hem",
    "        else if the apex has no lit and the belt has no lit and the hem has lit",
    "            snap hem",
    "        else if the apex has no lit and the belt has no lit and the hem has no lit",
    "            snap belt",
    "        end",
    "        anneal",
    "    end",
    "end",
]

# `for each charm` and no table, so it anneals blind and lights one in eight:
# what the table is worth, as `roaming` and `threading` pair (§19).
[tending_blindly]
domain = "forge"
lines = [
    "for each charm",
    "    if charm has ebbing or charm has no graced",
    "        imbue mortar_and_pestle charm",
    "        anneal",
    "    end",
    "end",
]
