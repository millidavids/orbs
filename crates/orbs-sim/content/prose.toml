# `petition` — spending standing so that fewer come up the road (§11.5, §19).
#
# The price and what it moves in one breath, as `pledge_short`. A wizard asking
# to be troubled less, not bargaining: quiet, paid for in fame.
# ---------------------------------------------------------------------------
petition_done = "word goes out. at most {quantity} will come, for {kind} renown"
petition_short = "that would take {kind} renown, and you hold {quantity}"
petition_least = "no fewer than {quantity} will ever come. keep your renown"
# What is bought is the size of the *next* siege, and this one is already here.
petition_besieged = "they are already at the wall. this is the siege you have"
# **A pledge the intent will waste is allowed and warned about.** Refusing would
# be the game playing for you; silence would break the rule that you are told the
# odds before the commitment, and *this does nothing* is the starkest odds there
# are.
pledge_wasted = "{name} goes to the {detail} for {kind}, wasted on a {state}"
spend_useless = "{name} is worth nothing on a wall"
spend_wrong_word = "that is not how {name} is used. {detail} it"
spend_none = "there is no {name} in the arsenal"
spend_shelved = "your {name} is in the {source}. move it to the arsenal"
# ---------------------------------------------------------------------------
# Stores that have run down (§11.5, §19).
#
# The stores behind the shelf are empty, not the shelf, so never "there is no
# {name}" (`spend_none`). It names the way out: make more.
# ---------------------------------------------------------------------------
spend_stale = "your {name} stores are out. make more and come back"
# ---------------------------------------------------------------------------
# Standing supplies (§19, Supply). No single item does anything: the verb opens
# a supply when enough is held, the verb again raises it a rate, and `stop`
# closes it. Each round it draws `{count}` on its own.
#
# A refusal names the threshold, because the way out is the mechanic: make more.
# `supply_drawn` is logged and never drawn, so `peruse bailey.log` says each
# round's draw while the pane says what the player did.
# ---------------------------------------------------------------------------
supply_open = "the {name} flows, {count} a round"
supply_open_waits = "the {name} flows, {count} a round, from when it is wanted"
supply_raised = "the {name} flows faster, {count} a round"
supply_short = "you hold {count} {name}. it flows from {quantity}"
supply_thin = "your {name} stores are thin. it flows only at its slowest"
supply_fastest = "the {name} flows as fast as it can"
supply_elsewhere = "the {name} already flows elsewhere in the tower. stop it first"
supply_stepped = "the {name} runs low, and slows to {count} a round"
supply_drained = "the {name} runs dry and stops. too few are left to flow"
supply_stale_drained = "your {name} stores are out, and it stops. make more"
supply_stale_stepped = "your {name} stores are thin. it slows to {count} a round"
supply_stopped = "you stop the {name}. what this round drew stands"
supply_not_open = "the {name} is not flowing"
supply_drawn = "{count} {name} drawn for the coming round"
quaff_stilled = "{name}, drunk. a stillness falls along the wall"
hold_round = "they {state}. you lose {quantity} and take {detail}"
roll_tells = "{name} strikes - {kind} gives {detail} against {state}, and it tells"
roll_misses = "{name} swings - {kind} gives {detail} against {state}, and misses"
siege_held = "the enemy breaks and runs. the wall holds, and you earn {detail}"
siege_fallen = "the wall is carried. {quantity} of the way, and you keep {detail}"
siege_stilled = "the enemy turns for home. {quantity} of the way, and you keep {detail}"
still_by_hand = "{name} is drunk by hand. a spell cannot end a siege"

# The bailey, where a siege is fought (§5.1). The room, then its five words.
man_here_bailey = "the courtyard inside the wall. where a siege is met"
man_start_bailey = "defend lets the enemy arrive. your troops are already yours"
man_solve_bailey = "pledge the dice, spend the arsenal, then hold for a round"

man_defend_use = "defend"
man_defend_gloss = "stand to the wall and let the enemy arrive"
man_defend_1 = "the tower sends every body it holds, never fewer than six"
man_defend_2 = "what changes is what came, and what you brought"
man_defend_3 = "nothing moves until you hold, so there is time to read"
man_defend_4 = "the enemy says what it will do next before it does it"
man_defend_eg1 = "defend, then survey enemy to see what came"
man_defend_also = "hold, deploy, quaff, recall bailey"

man_deploy_use = "deploy <name>"
man_deploy_gloss = "open what the circle bound as a supply on the wall"
man_deploy_1 = "a demon is bound by summon, with its name, at a hold"
man_deploy_2 = "with six held it flows, every round, like a potion"
man_deploy_eg1 = "deploy golem, when the line has gaps to fill"
man_deploy_also = "quaff, hold, summon"

man_petition_use = "petition"
man_petition_gloss = "spend renown so that fewer come up the road"
man_petition_1 = "fame draws a crowd. this is how you are less famous"
man_petition_2 = "it buys one fewer foe, on the next siege only"
man_petition_eg1 = "petition, when the road is empty and you are dreading it"
man_petition_also = "defend, weave, status"

man_quaff_use = "quaff <name>"
man_quaff_gloss = "open a potion as a supply on the wall"
man_quaff_1 = "no one potion does anything. with enough held, it flows"
man_quaff_2 = "each round it draws on its own. quaff again to flow faster"
# **`warding`, not `mending`.** `mending` is a `secret = true` recipe, so the
# manual's only worked example for this verb was one a new player cannot type —
# the same drift already caught in the shipped spell, the balance driver and the
# verb table, left standing in the one surface a player actually reads.
man_quaff_eg1 = "quaff warding, before they come all at once"
man_quaff_also = "deploy, wield, hold"

man_pledge_use = "pledge <die> to <area>"
man_pledge_gloss = "put one of your dice behind part of the wall"
man_pledge_1 = "three dice, four places to put them. one goes without"
man_pledge_2 = "the die is rolled when the round comes, not now"
man_pledge_3 = "so a d20 is a gamble and a d6 is a floor you can lean on"
man_pledge_4 = "what they mean to do next says which part needs it"
man_pledge_eg1 = "pledge d20 to buckler, when an onslaught is coming"
man_pledge_eg2 = "pledge d6 to succour, when you only need a little back"
man_pledge_also = "hold, survey coffer, recall bailey"

man_hold_use = "hold"
man_hold_gloss = "end your turn and let one round resolve"
man_hold_1 = "this is the only thing here that moves the world"
man_hold_2 = "everything else is free, so take as long as you like"
man_hold_3 = "both sides roll. the log says every die and every face"
man_hold_eg1 = "hold, once you have spent what the round wants"
man_hold_also = "defend, deploy, quaff, peruse bailey.log"

# The bailey's readings (§5.1). Thirteen words a solver's `if` names, and the
# manual could explain none of them until the lint was widened to see this room.
#
# **`recall_` is what makes a word nameable and `using_` is the worked line.**
# The second is where a page earns its keep: `few` is obvious and *when to ask
# it* is not.

# --- what the garrison is.
recall_spears = "how many of a side are still standing"
using_spears = "if the garrison has fewer than 3 spears. the enemy has foes instead"

recall_mettle = "how much fight a side has left between them"
using_mettle = "if the garrison has fewer than 6 mettle. it falls before spears do"

recall_few = "the line is thin. two or fewer still standing"
using_few = "if the garrison has few. bodies first, or nothing else matters"

recall_hurt = "worn down to half of what the garrison ever had"
using_hurt = "if the garrison has hurt. this is the rung a healing potion answers"

# --- what is coming over the wall.
recall_foes = "how many of the enemy are still coming"
using_foes = "if the enemy has fewer than 3 foes. nearly done"

recall_outnumbered = "the enemy has at least twice the garrison's numbers"
using_outnumbered = "if the enemy has outnumbered. the language has no ratios"

recall_massed = "the enemy has not lost anybody yet"
using_massed = "if the enemy has massed. true on the first round and after a bad one"

recall_routed = "a side is broken. nobody left standing"
using_routed = "if the enemy has routed. beware: a lost siege leaves them standing"

# --- the four places a die can go, and what a solver asks of them.
recall_ceiling = "the best this part could come to, if every die rolls high"
using_ceiling = "if the buckler is empty. or has fewer than 8 ceiling"

recall_moot = "what they mean to do next will throw this away"
using_moot = "if the line has moot. they volley, so you will not swing"

# --- what a pledge costs, and what is left to pay with. The one resource in the
# domain that only ever falls: it is granted at defend and never comes back.
recall_quintessence = "what is left to spend on dice, and what a die costs"
using_quintessence = "if the coffer has fewer quintessence than the d20. too dear"

# --- the odds, which used to be on the board and nowhere a spell could ask.
recall_aim = "how likely a side's blows are to tell, in a hundred"
using_aim = "if the enemy has fewer than 40 aim. not worth a die to stop"

# The dice themselves. The coffer names the ones still free, so a solver asks
# the coffer and pledges what it finds.
recall_d6 = "a six-sided die. a small, dependable floor"
using_d6 = "if the coffer has d6. pledge it where you need certainty"

recall_d8 = "an eight-sided die. the middle of your three"
using_d8 = "if the coffer has d8. pledge d8 to buckler"

recall_d20 = "a twenty-sided die. the gamble, and the one that can swing a round"
using_d20 = "if the coffer has d20. pledge it where a bad roll costs least"

# **Only the three a wizard holds have pages.** `Prose::topics` strips `recall_`
# to decide what is nameable, so a page for `d100` would register a subject the
# coffer can never publish — the `clarity_use` trap (§19) with a die in it. The
# other four are real dice and belong to the arsenal's future, not to `recall`.

# --- the siege itself.
recall_turns = "how many rounds have resolved"
using_turns = "if the rampart has more than 8 turns. a long siege is a losing one"

recall_lifted = "the siege is over, either way"
using_lifted = "repeat until the rampart has lifted. the guard a solver wants"

# --- an arsenal item's supply (§19, Supply).
recall_draw = "the rate a supply runs at. one is its slowest"
using_draw = "if the warding has no draw, quaff warding. a standing order"
recall_drained = "held, but too few to flow at all. make more"
using_drained = "for each store, if the store has drained. what to brew next"

# --- the standing garrison, read off the menagerie's roster (§19, Supply).
recall_full = "the tower holds as many bodies as it may. a hold now is turned away"
using_full = "if the roster has full, summon golem. a bare summon brings nobody home"

# --- what the enemy announced. §5.1 tells you a round ahead so the turn is
# prevention rather than reaction, and these three are the whole of that.
recall_advance = "the enemy means to close on the wall next round. ordinary"
using_advance = "if the rampart has advance. reinforce a thin line and ride it out"

recall_onslaught = "the enemy means to come all at once next round, and harder"
using_onslaught = "if the rampart has onslaught. the round to spend something on"

recall_volley = "the enemy means to shoot from range. fewer of them, and unanswered"
using_volley = "if the rampart has volley. spend nothing, you cannot strike back"

# ---------------------------------------------------------------------------
# THE FORGE (§10's Enchanting). The room, its three words, and what a charm says.

man_here_forge = "the fire under the tower. where a tool is given something it lacks"
man_start_forge = "imbue names a tool and a charm. a lattice of glyphs opens"
man_solve_forge = "snap the columns you want, then anneal and let it fall"

man_imbue_use = "imbue <tool> <charm>"
man_imbue_gloss = "open a lattice to bind a charm onto a tool"
man_imbue_1 = "the tool may be in any room. the forge reaches the whole tower"
man_imbue_2 = "a charm costs quintessence, and so does every anneal it takes"
man_imbue_eg1 = "imbue mortar_and_pestle with hurried, to halve every grind"
man_imbue_also = "snap, anneal, recall forge"

man_snap_use = "snap <column>"
man_snap_gloss = "flip a glyph and the glyphs beside it"
man_snap_1 = "apex, belt and hem. snapping one twice is snapping neither"
man_snap_2 = "only the top row is yours. the rest of the lattice follows"
man_snap_eg1 = "snap apex, when the hem came up dark under it"
man_snap_also = "anneal, imbue, survey lattice"

man_anneal_use = "anneal"
man_anneal_gloss = "let the lattice fall, and set the charm if every glyph lights"
man_anneal_1 = "it holds the tower to it. nothing else brews while a lattice falls"
man_anneal_2 = "a lattice that does not light springs back, and shows you why"
man_anneal_eg1 = "anneal, once the columns are as you want them"
man_anneal_also = "snap, imbue, survey lattice"

# What the forge says.
forge_nowhere = "there is no lattice here to work"
forge_unopened = "there is nothing on the lattice. imbue something first"
# **`anneal it`, and this line missed the rename.** `settle` was dropped in the
# naming sweep — 834 against `mettle`, and `set` prefixes it — and the rename
# reached the code, the tests and every other page but this one. A player
# following it typed a word the parser does not know.
forge_busy = "a lattice is already open. anneal it or leave it"
forge_no_charm = "{name} is not a charm this forge knows"
# **A column, not a charm.** Both are `NounKind::Place` in this room, so
# `snap hurried` and `snap lattice` both resolve and reach the verb — and the
# refusal said *"hurried is not a charm this forge knows"*, which is the wrong
# noun class and, for a charm, flatly untrue.
forge_no_column = "{name} is not a column of the lattice"
forge_no_tool = "{name} is not something a charm will hold to"
forge_short = "{name} would take {kind} quintessence, and you hold {quantity}"
forge_opened = "the glyphs rise for {name}. {detail} to bind it"
forge_snapped = "{name} turns, and its neighbours with it"
forge_settling = "the lattice begins to fall. {quantity} ticks"
forge_set = "every glyph holds. {name} settles onto the {detail}"
forge_failed = "the lattice goes dark and springs back. that cost {quantity}"
forge_charm_gone = "the {name} charm fades, and the tools are as they were"

# The board.
lattice_title = "lattice"
lattice_tally = "{name}, {quantity} spent"
lattice_spoken = "{name}. the bottom row reads {detail}"

# The readings a spell asks for.
recall_graced = "a tool with a charm still on it, and how long it has"
using_graced = "if the mortar_and_pestle has graced. it is still quick"
recall_ebbing = "a charm with little enough left to be worth laying again"
using_ebbing = "if the mortar_and_pestle has ebbing. the maintenance rung"
recall_lit = "a column of the lattice whose bottom glyph came up alight"
using_lit = "if the apex has lit. the three of them name what to snap"

recall_apex = "the first column of the lattice"
using_apex = "snap apex. or ask if the apex has lit"
recall_belt = "the middle column of the lattice"
using_belt = "snap belt. or ask if the belt has lit"
recall_hem = "the last column of the lattice"
using_hem = "snap hem. or ask if the hem has lit"

recall_hurried = "a charm that halves how long a tool takes"
using_hurried = "imbue mortar_and_pestle hurried. an eight tick grind becomes four"
recall_fruitful = "a charm that makes a tool yield one more than the recipe says"
using_fruitful = "imbue mortar_and_pestle fruitful. every grind pays twice"
recall_bountiful = "a charm that makes the stacks pay an extra fragment"
using_bountiful = "imbue stacks bountiful. a walk is worth two"
recall_whetted = "a charm that rolls a bigger die"
using_whetted = "imbue rampart whetted. the wall answers with more"
recall_shielded = "a charm that turns a sabotage aside"
using_shielded = "imbue coursing.spell shielded. the enemy strikes and it holds"
