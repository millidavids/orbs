# The orb's voice.
#
# CLAUDE.md rule 6: prose lives here, never as a string literal in Rust. The
# writing budget is ~88k words (DESIGN.md §12) and string literals would make it
# unmanageable by month 20.
#
# This file is compiled in as the default (`include_str!`), so headless tests and
# the balance harness need no filesystem. A frontend may hand a replacement to
# `Sim::set_prose` at a tick boundary, which is what makes it hot-reloadable.
#
# ## Placeholders
#
# `{name}`, `{state}`, `{source}` … interpolate the record's own fields, by the
# label in `FieldName::label`. A placeholder with no matching field is left as
# written — visible on screen, so a typo is caught by looking rather than by
# silently rendering an empty gap.
#
# ## Style
#
# Lower case throughout. The tower's whole surface is a terminal and a
# capitalised sentence would be the only thing on screen shouting (§3). No
# trailing full stop for the same reason.
#
# Keep every line inside the 80×22 floor's usable width — roughly 70 cells once
# the border and glyph are drawn. `worst_case_legibility` is what measures it.

[lines]

# ---------------------------------------------------------------------------
# Work — the production slot (§9, §11.5)
# ---------------------------------------------------------------------------

# §5.0: "repairing the rats occupies the laboratory pane for its duration,
# during which you are not brewing". The refusal only bites if it says so - this
# line replaces three bare field values that rendered as "decoct decoct
# laboratory" and told a player nothing.
#
# `{state}` is `Verb::participle`, already inflected. It used to be
# `{state}ing` over `Verb::canonical`, which reads correctly for `wield` and
# gave "the archive is busy researching" for the only other verb that can hold
# the slot.
work_busy = "the {source} is busy {state}. wait for it, or stop it"

# §7 guards catastrophic targets in character rather than with an error. It
# covers the root *and* the live domains, so this must read for both - an
# earlier wording said "is the tower itself" and drew as "the laboratory is the
# tower itself" the moment a domain was tried.
purge_protected = "the orb will not unmake the {path}"

# A verb that belongs to an instrument, typed where that instrument is not (§7).
#
# `mix` means the flask and rod, and there is no flask and rod in the archive —
# so the parser never considers the word there, which is what keeps one domain's
# vocabulary from capturing another's typos as §10's five further domains land.
# But "I do not know that word" would be a lie about a word the game taught in
# the room next door, so the refusal names the verb and says where it is not.
verb_elsewhere = "there is nothing here to {name} with"
# The same refusal, when the content can say *which* thing is missing. §6 forbids
# a bare error and the line above is only half an answer: a player told the name
# of the fixture has been told where to go. `tower::fixture_of` finds it.
verb_needs_fixture = "there is no {source} here to {name} with"

# The commonest refusal in the game: the parser resolved a name on submit and by
# the next tick it was gone, or the player named something that is not within
# reach. It drew as two bare field values — `mix sage` — which says what was
# wanted and never says it was refused.
missing_target = "there is no {path} within reach"

# The one sentence on the "window too small" screen (§9's `is_hostable`). It
# lived as a `Span::new("...")` literal in the Bevy frontend — invisible to the
# `ORBS_CONTENT` watcher, invisible to the width and CP437 lints below, and
# unfindable by a writer grepping `content/`. Rule 6 has no frontend exemption.
window_too_small = "the orb needs a larger window"

# ---------------------------------------------------------------------------
# The laboratory (§10.1)
# ---------------------------------------------------------------------------

# §10.1's loop opens with clearing an instrument of what the last brew left.
# A place is emptied, never destroyed.
# empty - the counterpart of purge. §10.1: every byproduct has at least one use,
# so the loop needs a way to clear an instrument that *keeps* what was in it.
# Husks are the mortar's leavings and the water bath's input; a player who can
# only clear by destroying never finds the second route to a draught.
empty_done = "you turn the {name} out into the {path}: {state}"
empty_already = "the {name} is already empty"
empty_nowhere = "there is nowhere here to put what the {name} holds"
empty_is_store = "the {name} is the shelf; move things out of it by name"

purge_begins = "you set to scouring the {path}"
purge_already = "you are already scouring the {path}"
purge_place = "the {path} is clean"
purge_place_empty = "the {path} was already clean"

# `siphon_*` lived here. The verb is retired (§19): the next stage reaches into
# an idle instrument for what it needs, so drawing the product onto a bench had
# stopped doing anything - and with nothing able to put a reagent on the floor,
# the bench and the shelf are one place.

# ---------------------------------------------------------------------------
# `recall` (§6.1) - the in-world manual.
#
# A recipe name answers with its routes, walked out of `recipes.toml`. Anything
# else is a *subject*, and answers from here. Keys are `recall_<topic>`.
#
# **Only subjects take the `recall_` prefix.** `Prose::topics` strips it to
# decide what the player may *name*, so a template key sharing the prefix
# becomes something to ask the orb about: the route templates below used to be
# `grimoire_step` and `grimoire_step_or`, which registered `step` and `step_or`
# as manual subjects nobody authored. They are `route_` now.
# ---------------------------------------------------------------------------

recall_brewing = "kindle, grind, digest, mix, distil - then empty, or purge the waste"

# The manual is where a player looks for a word they half-remember, so the verb
# that exists *because* an affordance was undiscoverable had better be findable
# in the one place built for finding things.

# A recipe, written as instructions rather than as a table.
#
# The steps come out in **doing** order — the walk is post-order over the recipe
# graph — so reading top-down is the order you type.
#
# **What becomes what, first**, because that is the part a player is looking
# for; where and how long follow in brackets. Long steps wrap at a word boundary
# rather than clipping — see `RecordView::wrapped_rows` — so a two-input step
# breaks after the arrow instead of losing the thing it makes.
#
# `{kind}` is the heat marker, already worded. Forgetting to light the athanor is
# the commonest way a stage refuses, so it earns its place on the line.
route_line = "{name}: {count} steps, {ticks} ticks"
route_step = "{index} {detail} -> {name}{state}  ({source}, {ticks}t{kind})"
route_step_or = "or {detail} -> {name}{state}  ({source}, {ticks}t{kind})"
route_heat = ", needs heat"
# The byproduct clause, composed in like `route_heat` beside it - because not
# every step leaves one. Byproducts are the laboratory's mechanic, and a step
# without one used to read "-> gleaning-scroll +  " with nothing after the plus.
route_leaves = " + {state}"

# Terse on purpose. The interpolated line is what has to fit ~60 cells at the
# 80x22 floor, and "you move the ground-sage from the laboratory to the
# balneum_mariae" is 66 - clipped, in the one line whose whole job is saying
# where a thing came from and went to.
move_done = "{name}: {origin} to {path}"

# The lock. §10.1: it is what makes different recipes need different scripts.
wield_busy = "the {name} is at work. wait, or stop it"

# A refusal has to say what is in there, or "nothing happens" and "you loaded
# the wrong thing" look identical.
wield_empty = "the {name} is empty"
wield_no_recipe = "the {name} can do nothing with {detail}"
wield_done = "the {source} yields {name}, and leaves {detail}  +{count}"
# A run that leaves nothing behind. Byproducts are the laboratory's mechanic, so
# the sentence cannot end in "and leaves " with a hole where one would go - the
# hole is exactly how a missing key surfaces (S19), and here it would surface on
# every scroll the archive ever assembles.
wield_done_clean = "the {source} yields {name}  +{count}"

# A run that lands on contents matching no recipe. Should not be reachable —
# the lock sees to that — but `transmute` used to return silently here, which
# made it the one path that ends a wield with no record at all: the echo, and
# then nothing, ever. §14 announces completions, and a run ending is one.
wield_nothing = "the {name} settles, and yields nothing"

stop_done = "you still the {name}. what it holds is untouched"
stop_idle = "the {name} is not working"

# The athanor - shared heat, and the one instrument that takes no focus.
#
# Every one of these carries the fuel count, because banked fuel is the only
# thing in the laboratory with no node to `survey`. Without the number a player
# who damps sees an empty athanor and concludes the charcoal is gone - which is
# exactly how it was reported.
kindle_done = "the athanor takes light. fuel for {left} ticks"
kindle_banked = "the athanor catches on banked fuel. {left} ticks of it"
kindle_lit = "the athanor is already burning"
kindle_cold = "the athanor has nothing in it to burn, and nothing banked"
athanor_out = "the athanor gutters and goes cold"
damp_done = "you damp the athanor. {left} ticks of fuel keep"
damp_idle = "the athanor is already cold"
wield_cold = "the {name} wants heat, and the athanor is cold"

# ---------------------------------------------------------------------------
# Experience and concentration (§11.5, §19). The work is worth something, and
# what it is worth buys the orb the right to do the work for you.
#
# **The first thing in the game that opens rather than refuses**, so it names the
# verb: a capability nobody can find is a capability nobody has, which is the
# lesson `unfurl` is on the tutorial list for.
# ---------------------------------------------------------------------------
concentration_gained = "the orb can hold a spell now. bind one, and walk away"

# ---------------------------------------------------------------------------
# `debug_spawn` (§19). A tester's door: the **code** is `cfg(debug_assertions)`
# and absent from a release build, but this file is compiled in whole, so these
# four lines ship as text nothing can reach. Kept here anyway rather than moved
# to string literals - four dead lines cost less than an exemption from rule 6,
# and the width, shouting and CP437 lints all read this file.
#
# **Written in the orb's voice** for the same reason. §3's register has no
# exception for tooling, and a line that shouts in a game that never shouts is a
# line somebody has to remember not to screenshot.
# ---------------------------------------------------------------------------
debug_spawn_done = "the shelf finds it had {name} all along"
debug_spawn_unknown = "nothing in the tower is called '{name}'"
debug_spawn_nowhere = "there is no shelf here to put {name} on"
debug_spawn_unkept = "the arsenal keeps finished work. {name} is not any"
debug_spawn_known = "the shelf could find: {name}"

# `debug_spell`, the other tester's door - a known-good spell written out, so a
# solver need not be typed by hand to check the archive still works.
#
# **The refusal names the room**, which is the one thing this word must say that
# `debug_spawn` need not: a spell is written *for* a domain, so writing it in the
# wrong one produces a file whose every line fails to resolve.
debug_spell_done = "the grimoire remembers {name}, in a hand not yours"
debug_spell_unknown = "no spell in the orb's own hand is called '{name}'"
debug_spell_elsewhere = "that one is written for the {name}. go there first"
debug_spell_known = "the orb could write: {name}"

# ---------------------------------------------------------------------------
# The spellbook (§8). Writing a spell, and the orb writing down what you meant.
# ---------------------------------------------------------------------------

# Opening one. `scribe_new` has to say the file was *made*, or a mistyped name
# looks exactly like the spell you wanted and opens empty.
scribe_new = "a fresh page: {name}, for the {source}"
scribe_open = "you open {name}, written for the {source}"
# Safe, and silent without this: the running copy keeps its own orders, so an
# edit that seems to do nothing has in fact landed - on the next casting.
scribe_running = "{name} is running. the orb reads along as you write"
# **Once per editing session**, not once per save (§19). The buffer writes itself
# out after every pause in the typing, so a line per write is this line every
# couple of seconds - and what it has to teach is a fact about the session.
spell_reloaded = "{name} changes under the orb's hand"

# A spell is written *for* somewhere, so there is nowhere to write one from the
# tower's landing. The first refusal in the game that is about **where you are**
# rather than about what you named, so the sentence has to teach rather than
# scold - a player who has not found a domain yet does not know there are any.
scribe_nowhere = "a spell is written for a place. go where the work is first"

# Saving says nothing at all, and there are no keys here for it (§19). It said
# "{name}: {count} lines, written down" and a count of what it could not read -
# once per pause in the typing, which is sixteen copies of itself behind the
# modal for one editing session. A line the orb could not read is still named
# individually, with its line number, by the runner when the spell is cast.

# Reading back through the transcript (§19). The keys always worked; nothing
# ever said so, and in a game with no mouse a key nobody can discover is a key
# nobody has. The word is the way in, and the row it puts on screen is what the
# player keeps afterwards.
unfurl_begins = "you unfurl the record"

# **Said before it happens**, so the log ends on a decision rather than simply
# stopping. The tower keeps working whether or not anyone is looking — §5.0's
# clock runs only while the window is open, so this is the wizard stepping away
# rather than the world ending.
quit_begins = "you let the orb go dark. the tower keeps its own counsel"
# **As short as the `PgDn newest` it replaces.** This rides in the border title
# beside the location, the tick, the tier and the grid, and at the 80-column
# floor there is about twenty cells left - the first wording was 39 and drew as
# "esc back to" with the rest cut off.
#
# Lower case like everything else here, which `authored_lines_do_not_shout`
# caught: the two hints this sits between are `F4 deep` and `PgDn newest`, both
# Rust literals, and matching *them* would have made this the one capitalised
# line in the file. §3's no-shouting rule is about the file, not the neighbours.
unfurl_keys = "pgup/pgdn  esc out"

# The weave screen (§11.5, §19). Progression had no surface at all: `status`
# printed two numbers and nothing said what they were for.
#
# **The opening line names the next threshold**, because that is the fact a
# player who typed this wanted and it is what survives in the transcript after
# the screen is closed. A tower with nothing left to open gets the second line -
# the first would name a target of 0, which reads as reached.
#
# `{quantity}` is the earned total, which is what `FieldName::Quantity` on the
# record carries too - the two named the opposite things once, which is a trap
# for whoever authors the next line here.
weave_begins = "{quantity} earned. the next turning is at {detail}"
weave_begins_topped_out = "{quantity} earned, and the orb has learned all it can for now"

# The screen's own furniture. Terse: the session pane is about 48 cells wide once
# two panes tile side by side, which is the width this is authored against - not
# the 80-column floor, which is the *widest* single-pane case.
weave_words = "ley  mastery  take  quit"
weave_browsing = "arrows move   take   esc back"
weave_ley = "ley line"
weave_mastery = "mastery"
weave_title = "weave"
# The bar is spoken as a sentence, never as a row of blocks - §14 names progress
# bars specifically, and `Painter::progress` takes the sentence for this.
#
# **Against a fixed scale, not the next turning.** Retargeting emptied the bar
# at the moment the player earned something, which is the one instant it should
# have looked like progress - and a constant scale is what lets the ley line be
# drawn beneath it at the same width, so a step's position on the line is its
# cost read against the same cells.
weave_bar = "{quantity} experience of {detail}"
# The details panel before anything is aimed at. Not blank: a panel that is
# sometimes full and sometimes empty reads as a screen that has broken.
weave_aim_first = "say ley or mastery"
weave_details = "details"
weave_at = "costs {count}"
# **Two facts, and they are not the same fact.** `unlocked` is whether the tower
# has earned enough to reach it; `active` is whether what it grants is in effect.
# A ley line step is both at once - passing one is taking it - but a mastery node
# can be unlocked and idle (nobody chose it) or unlocked and idle for ever (a
# sibling took the tier's one choice).
#
# All four fit half of a 30-cell panel, which is what they are authored against.
weave_unlocked = "unlocked"
weave_locked_state = "locked"
weave_active = "active"
weave_inactive = "inactive"
# The pane is under the screen's floor. It has to say so rather than draw a
# blank, because this surface holds the keyboard and `esc` does not close it -
# a blank pane with the keys held is a player with no visible way out.
weave_too_small = "the pane is too small for the weave. quit, or press F4"
# `take` on a node nothing is behind yet. Every authored node is a marker, and
# saying so plainly is better than a refusal that sounds like a rule.
#
# **All of these fit 46 cells**, which is the status row's whole width in a
# 48-column pane. Longer is silently cut mid-word - the first draft of the line
# below ended "...nothing is" and stopped, which reads as a bug in the orb.
weave_nothing_behind = "{name} is a marker. nothing behind it yet"
# **Says "opens at", not "its tier opens at".** A ley line step has no tier, and
# this line answers for both tracks - the first wording told a player about a
# tier that does not exist wherever the step they aimed at was on the line.
weave_locked = "{name} is shut until {count}"
weave_spent = "you took {name} from this tier already"
# **Held already, which is not the same as empty.** A ley line step is taken by
# being passed, so this is the one refusal about something the tower really has -
# and `weave_nothing_behind` answered it at first, calling the game's one real
# grant a marker one row under a panel saying `active`.
weave_already = "{name} is yours already"
weave_nothing_here = "point at something first, or name it"
weave_unknown = "the orb weaves nothing called {name}"

# One sentence per node id, keyed by the id in `progression.toml`. The **id** is
# a decision and lives there; the **sentence** is prose and lives here, which is
# the same split `recipes.toml` makes with the lines about what a recipe yields.
#
# Every one of these is a marker today. They are authored anyway, because a row
# on the screen with no sentence under it is a row that looks broken - and
# because the first real node replaces a line here rather than adding the idea
# of one.
#
# **Authored to fit 28 cells**, which is the details panel's width inside its
# border. Longer is clipped mid-word, and a sentence that stops at "while you
# are" reads as a bug in the orb rather than as a pane that ran out of room.
weave_node_tbi_b = "nor this"
weave_node_tbi_d = "another, equally so"
# The two the budget reads. Said as what it buys rather than as a number: a step
# is a tick, so what a player gets is a spell that keeps up.
weave_node_steps_1 = "one more step a second"
weave_node_steps_2 = "two more steps a second"
# What the Ley Line's one step gives, said as a capability rather than a number.
weave_node_concentration = "hold a spell while away"

# The editor's own furniture. Terse: these sit on one row of a pane that may be
# 80 cells wide, beside the filename and the position.
#
# **The command row is the whole interface in command state**, so these have to
# name every word. A player who does not know them has nowhere else to look -
# the editor is the first modal surface in the game.
#
# Two words, where there were four. `save` and `discard` are gone because the
# buffer writes itself out a beat after you stop typing (§19): saving is not a
# thing you do, and there is therefore nothing to throw away. What is left is
# the only two decisions still the player's - write, or leave.
#
# **Three now.** `interpret` is the third, and it exists because the file stopped
# being rewritten (§19): the orb's reading used to be visible in the saved spell,
# and this is where it went. A validation step the player asks for.
editor_words = "edit  guide  interpret  quit"

# The scribing guide's own furniture. Terse: the pane is thirty cells wide and
# every one of these shares it with the words it is heading.
guide_title = "guide"
guide_words = "the language"
guide_verbs = "here you can"
guide_next = "what can follow"
editor_editing = "esc to stop writing"
editor_reading = "what the orb hears. esc to go back"
editor_unknown = "the orb does not know '{detail}' - try edit or quit"
# §14: a mark on a line is a fact carried only by colour, so the count is said.
#
# **No noun after the number**, which is what makes one line work for one and for
# many: "{count} lines" gives "1 lines", and naming nothing gives "2 the orb
# cannot read", which is not a sentence in any number. It drew as the second of
# those for a while.
#
# The editor's status row is the tightest budget in the game - it shares a pane
# that can be 48 cells wide with the caret position - so this is about as long as
# it can be. The longer wording that says "of these" clipped at "interpret t".
editor_unread = "the orb cannot read {count}. interpret to see"

# On the title bar while an invocation of this spell is running, beside the
# gutter's marker. The marker alone would be a fact carried only by a glyph in a
# column, which §14 forbids; a title is pushed to the speech stream as a heading.
editor_at_line = "(the orb is on line {count})"

# ---------------------------------------------------------------------------
# Casting a spell (§8). Every line names the spell, and every failure names the
# line - §8.1: "the culprit is never anonymous".
# ---------------------------------------------------------------------------

spell_begun = "the orb takes up {name}"
spell_done = "{name} is finished"
spell_unknown = "there is no {name} in your grimoire"
spell_already = "{name} is already running"
spell_empty = "{name} has nothing written in it"
spell_homeless = "{name} names a place the tower no longer has"
# Said on waking, when a spell was left running and its text has changed since.
# The run stops rather than resuming into a program its position does not belong
# to; a spell the orb was *holding* takes itself up again on the next tick.
spell_moved_under_it = "{name} reads differently than when the orb took it up. it lets go"

# Waking into a tower that was already there. Said in place of §4's boot report,
# which a *new* world gets — `Sim::restored` deliberately writes no banner,
# because the save carries the tail of the transcript and what a player sees on
# waking is the screen they left.
resumed = "the orb remembers. the tower is as you left it"
# ...and how long it was dark. **Nothing accrued** — §5 opens "initially there is
# no offline progression" and puts accrual in Phase 9a — so this says what
# happened, which is nothing, rather than implying otherwise.
resumed_away = "it was dark for {span}. nothing turned while you were gone"
# The save was there and could not be read. Said rather than swallowed: a player
# whose tower did not come back is owed the reason.
save_unreadable = "the orb cannot make out what it wrote last. this tower is new"
# ...and the other direction, said once however many times it fails.
save_failed = "the orb cannot write what it remembers down"

# Calling a spell off. **What it started keeps going** - stopping the spell is
# not stopping the mortar, exactly as walking away from a brew you typed by hand
# does not stop the brew.
spell_stopped = "you let {name} go. what it started runs on"
spell_not_running = "{name} is not running"

# A word the editor taught them, typed at the prompt. §6 forbids a bare error,
# and "I do not know that word" would be a lie about a word the game itself put
# in their hands - the same reasoning as `verb_elsewhere`, one step further.
word_in_spell = "'{name}' is a word for spells, not for the orb"

# The two ways a spell can be structurally wrong. Neither refuses and neither
# halts: §8 fixes that saving always succeeds and that scripts never halt, so
# the orb closes what was left open and says so once.
spell_unclosed = "{name} line {count}: nothing closed this, so the orb closed it"
spell_stray_end = "{name} line {count}: an end with nothing open. ignored"
spell_stray_else = "{name} line {count}: an else with no if before it. ignored"
# **Not guessed at, and no longer answered either.** A condition the player did
# not write would decide what their laboratory does while they are elsewhere - so
# an unreadable question decides nothing at all, and **neither** half runs. It
# used to say "answered no", which sent every one of them down the else for ever.
spell_unreadable_if = "{name} line {count}: that question means nothing. neither half runs"
# `until`, and the three ways a loop's bound can be written wrong.
#
# **The unreadable one stops the loop**, where the unreadable `if` above runs
# neither half. Declining to act is safe; declining to *stop* is a spell running
# for ever on a question nobody can answer, so the two cannot share a rule.
spell_two_bounds = "{name} line {count}: a repeat takes a number or an until, not both"
spell_stray_until = "{name} line {count}: until belongs to a repeat. ignored"
spell_unreadable_until = "{name} line {count}: that question means nothing. the repeat stops"
# `set` and `for each`, which fail by being half-written rather than by being
# unanswerable. Both refuse the line whole: `set best` binds nothing and
# `for way` walks nothing, and either read as the other would be the orb writing
# down a line the player did not.
spell_unreadable_let = "{name} line {count}: let wants a name, then be, then a place"
spell_unreadable_for = "{name} line {count}: for wants each, then a set. nothing is walked"

# The five ways a part can be written wrong. Each names the line and says what
# the orb did instead, because §8 forbids halting: the spell runs either way.
# A verb no spell may issue, caught when the spell is cast rather than when the
# line is reached — which for a line inside a branch may be never. Its own key,
# because a complaint is given `name` and `count` and no `detail`.
spell_forbidden_line = "{name} line {count}: that is a word the orb will not take from a spell"

spell_unreadable_part = "{name} line {count}: part wants one name. nothing is set aside"
spell_part_takes_nothing = "{name} line {count}: a part takes nothing between its brackets"
spell_no_such_part = "{name} line {count}: no part of this spell is called that"
spell_repeated_part = "{name} line {count}: that part is named above. this one is set aside"
spell_nested_part = "{name} line {count}: a part belongs outside every block, not in one"
spell_parts_too_deep = "{name} calls {detail} too deep to follow. it stops there and goes on"

# A question about somewhere the tower does not have. §8's *Referent missing*,
# and **not the same as the answer being no** - which is exactly the bug this
# line exists to make impossible to have again. `if mortar is empty` compared
# `mortar` against `mortar_and_pestle`, found nothing, answered no on every pass
# and took the else for ever, saying not one word about it (§19).
#
# Said **once per line per casting**, not once per evaluation: a question inside
# a repeat is asked every tick, and a name the tower cannot place is wrong on the
# first turn exactly as it is on the four hundredth.
spell_nowhere = "{name} line {count}: there is no {detail} here to ask about"
spell_too_deep = "{name} is too many spells deep; the orb loses the thread"

# §8's taxonomy: "scripts always log and never halt". Each of these skips the
# line and carries on - none of them stops the spell.
spell_missing = "{name} line {count}: nothing here answers to '{detail}'"
spell_forbidden = "{name} line {count}: the orb will not do '{detail}' from a spell"

# Waiting is normal - it is what a recipe does. Said **once**, when the wait
# starts, because a line per tick would bury the log under a spell working
# correctly.
spell_waiting = "{name} waits: the {source} is {state}"
# An **explicit** wait, which reads differently from being blocked: the spell
# meant to stop here.
spell_watching = "{name} watches for the {source}"
# `{detail}`, **not `{source}`** — which is what it said, and `say_failure`
# supplies `name`, `detail` and `count` only, so the placeholder drew on screen
# as the literal text `{source}`. Exactly the failure the header above says this
# file's unmatched placeholders are left visible to catch, and it was caught by
# looking rather than by a test. `no_line_a_spell_can_say_has_a_hole_in_it` is
# the test now.
spell_gave_up = "{name} waited too long on the {detail}, and moved on"

# ---------------------------------------------------------------------------
# `bind` (§8, §11.5) - giving a spell to the orb to hold. What it buys is the
# spell surviving you walking out of the room; an invocation does not.
# ---------------------------------------------------------------------------
bind_done = "the orb takes up {name}, and will hold it"
bind_already = "the orb is already holding {name}"
bind_released = "you let {name} go. the orb has room again"
# **The first refusal in the game about what you have *earned*.** §6 forbids a
# bare error, so it has to teach twice over: that holding a spell is a thing at
# all, and that working is what buys it. A player at concentration 0 has no way
# to find either by looking around.
bind_untrained = "the orb cannot hold a spell yet. work, and it will learn to"
# Naming what is held is the whole refusal: at concentration 1 this is the
# sharpest decision in the game, and it cannot be made by a player who has to go
# and look up what they are already holding.
bind_full = "the orb holds {count}: {detail}. let one go first"
# An invocation whose caster walked out. §19: an invoked spell "needs you
# standing there", and this is the line that makes it true - the difference
# `bind` sells, said at the moment it costs something.
spell_unattended = "{name} needed you there. it stops"

# ---------------------------------------------------------------------------
# The archive's stacks (§10, §19).
#
# `research` (`divine` until the archive got its name right) opened nothing and
# produced nothing for two phases; it now opens the
# stacks out of a page, and `follow` threads them. The three defects that came
# with the old verb - a completion with no sentence, a run that could not be
# stopped, a domain with no manual entry - are gone because the domain has an
# instrument, not because they were patched.
# ---------------------------------------------------------------------------
# The lens (§10). Outcome lines first, then the manual pages further down.
#
# **Every refusal names the way forward**, which is what keeps all three verbs
# off `is_gated` — a word that can only say no is worse than a word that is not
# offered, and none of these can only say no.
verify_substituted = "something here is not what it says: {detail}"
ward_title = "ward"
ward_spoken = "{quantity} pressed, last {name} aligned {detail} astray"
scry_opens = "a far orb swims up. four sigils hold it shut"
scry_nowhere = "there is no lens here to look through"
dial_unopened = "nothing is open to turn. probe first"
dial_incomplete = "dial which socket, to what? name a socket and a sigil"
dial_not_a_socket = "{name} is not a socket. the four are first to fourth"
dial_not_a_sigil = "{detail} is not a sigil. survey the lens to see the six"
# **The only way a dial refuses now.** It used to also mean *that sigil is in a
# settled socket and cannot be taken from it* — the exchange rule, gone with the
# no-repeats rule that forced it (§19). Nothing holds a socket shut any more.
dial_held = "the {name} already holds that"
dial_done = "the {name} socket turns to {detail}"
probe_answered = "{quantity} aligned, {detail} astray. the ward is {state}"
probe_broken = "the seal gives. the far orb spills its working, in {quantity}"
probe_found = "and a way to make {name}. the orb writes it down"
spill_step = "{name} {detail}"

research_opens = "the page opens into shelves that do not end. a way out is in them"
research_already = "a reading is already open. follow it, or stop the stacks"
research_nowhere = "there are no stacks here to read"
research_solved = "the stacks give up {name}"
follow_done = "the reading goes {name}"
