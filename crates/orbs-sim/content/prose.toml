# What the forge says.
forge_nowhere = "there is no lattice here to work"
forge_unopened = "there is nothing on the lattice. imbue something first"
# **`anneal it`, and this line missed the rename.** `settle` was dropped in the
# naming sweep — 834 against `mettle`, and `set` prefixes it — and the rename
# reached the code, the tests and every other page but this one. A player
# following it typed a word the parser does not know.
forge_busy = "a lattice is already open. anneal it or leave it"
forge_no_charm = "{name} is not a charm this forge knows"
# **A column, not a charm.** Both are `NounKind::Place` in this room, so
# `snap hurried` and `snap lattice` both resolve and reach the verb — and the
# refusal said *"hurried is not a charm this forge knows"*, which is the wrong
# noun class and, for a charm, flatly untrue.
forge_no_column = "{name} is not a column of the lattice"
forge_no_tool = "{name} is not something a charm will hold to"
forge_short = "{name} would take {kind} quintessence, and you hold {quantity}"
forge_opened = "the glyphs rise for {name}. {detail} to bind it"
forge_snapped = "{name} turns, and its neighbours with it"
forge_settling = "the lattice begins to fall. {quantity} ticks"
forge_set = "every glyph holds. {name} settles onto the {detail}"
forge_failed = "the lattice goes dark and springs back. that cost {quantity}"
forge_charm_gone = "the {name} charm fades, and the tools are as they were"

