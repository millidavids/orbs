# ---------------------------------------------------------------------------
# The arsenal: the one room reachable from every other, and what it will hold.
#
# The refusal names what the room is *for* rather than what the thing is not.
# S6 forbids a bare error, and "no" about a reagent you are holding is exactly
# that - the player has to be told where their sage does belong.
# ---------------------------------------------------------------------------
move_unkept = "the {path} keeps finished work. {name} belongs on a shelf"
recall_arsenal = "finished potions and scrolls, within reach from any room"

# ---------------------------------------------------------------------------
# The ported herbs. Every one is a real plant or resin, and the line says what it
# **looks like and where it grows** before what it is for - which is the shape
# `../court_wizard` uses for all nineteen of its ingredients, and the reason a
# player asking "what is this" gets an answer rather than an invented name.
#
# S19 records the four shard names failing exactly this: "nothing in the game
# ever said what one was". A herb the orb cannot describe is the same defect.
# ---------------------------------------------------------------------------
recall_mugwort = "a silvery roadside weed. its underside catches the moonlight"
recall_valerian = "a pale wet-woodland root. pungent enough to slow a room"
recall_amber = "warm fossil resin off a cold shore. it holds what it touches"

# ---------------------------------------------------------------------------
# Every material has a page, and `every_material_has_a_page` holds it.
#
# `recall <thing>` used to answer with the **route** and nothing else, so a
# player holding a potion could be told its five steps and not one word about
# what it was for. A route answers *how do I get one*; this answers *what is
# this*, and both are said now - what it is first, because that is what someone
# holding the thing is asking.
#
# `using_<name>` is the second half: how you spend it. It is optional, because a
# byproduct is a thing you have rather than a thing you do - and where a use is
# **not built yet** it says so, which is what `undo`'s verb page already does and
# what S15 wants, since a page admitting a thing does nothing is the cheapest way
# to keep a player out of a dead end.
#
# **Not `recall_<name>_use`.** `Prose::topics` decides what is nameable by
# stripping `recall_`, so that spelling would register `clarity_use` as something
# to ask the orb about - the trap `grimoire_step_or` already paid for.
# ---------------------------------------------------------------------------

