# ---------------------------------------------------------------------------
# The six words a spell is written with, which nothing in the game taught.
#
# **Found by auditing the language against seven others** - Inform 7, HyperTalk,
# AppleScript, Autonauts, Factorio, Oxygen Not Included and the Zachtronics
# assemblers. Every one of them ships a reference; HyperTalk's whole thesis is
# that an author learns by looking things up. Ours had none: control words are
# spell-only and outside `Verb::ALL`, so `recall repeat` reached nothing at all.
#
# A `recall_` key is what makes a word nameable, so these six lines are the
# difference between a language and a puzzle.
# ---------------------------------------------------------------------------
# `recall scripting` - the one page about the language rather than the tower,
# and the only one whose last section changes with the room. The grammar is the
# same everywhere; what a question can *name* is not, and a player standing in
# the laboratory has no way to guess the archive's vocabulary.
recall_scripting = "what a spell is made of, and what this room answers"

