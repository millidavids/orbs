# vocabulary* rather than *this is the vocabulary here*.
man_elsewhere = "other rooms have words of their own. attend one and ask again"

# ---------------------------------------------------------------------------
# The room primer - what `help` says BEFORE the word list.
#
# Three keys per room, and they are the three questions a lost player has:
# `man_here_<room>` is what the place is, `man_start_<room>` is how to begin its
# puzzle, `man_solve_<room>` is how to finish one. What-it-is before how-it-works
# is the same order a thing's `recall_`/`using_` pair uses, because it is the same
# split.
#
# **Three rather than two because of the width lint.** `every_authored_line_fits
# _the_worst_case_width` gives 70 cells against §4's 80x22 floor, and the first
# draft ran to 112 in one sentence. Splitting start from solve is not a workaround:
# they are two instructions and the player follows them at different times.
#
# **`man_`, not `recall_`.** `Prose::topics` strips `recall_` to decide what is
# nameable, so `recall_here_lens` would register `here_lens` as a subject nobody
# authored - the trap `grimoire_step_or` and `clarity_use` both paid for.
#
# `every_room_a_player_can_stand_in_explains_itself` fails the build for a built
# room missing any of the three, so a new domain cannot ship without a primer.
#
# **Keep the last two lines instructions, and name only words that work here.**
# A player typing `help` in a room they do not understand wants the first verb to
# type, not a summary of the theme. `a_primer_only_names_words_that_room_actually
# _offers` holds the availability half; the *refusal* half it cannot see, which is
# what the grimoire note below is about.
# ---------------------------------------------------------------------------
man_here_laboratory = "where reagents become potions, one instrument at a time"
man_start_laboratory = "kindle charcoal for heat, then grind sage in the mortar"
man_solve_laboratory = "each stage feeds the next. recall clarity walks a whole brew"

man_here_archive = "shelves that run further than they should. things are lost here"
man_start_archive = "research opens the stacks. wander walks them with the arrows"
man_solve_archive = "reach the way out for a fragment. four in the lectern, wield it"

man_here_lens = "another wizard's orb, sealed with four sigils of six"
man_start_lens = "dial a socket to a sigil. probe presses them. both are free"
man_solve_lens = "aligned counts sigils in the right socket, astray the misplaced"

