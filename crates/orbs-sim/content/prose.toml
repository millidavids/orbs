# The bailey's readings (§5.1). Thirteen words a solver's `if` names, and the
# manual could explain none of them until the lint was widened to see this room.
#
# **`recall_` is what makes a word nameable and `using_` is the worked line.**
# The second is where a page earns its keep: `few` is obvious and *when to ask
# it* is not.

# --- what the garrison is.
recall_spears = "how many of a side are still standing"
using_spears = "if the garrison has fewer than 3 spears. the enemy has foes instead"

recall_mettle = "how much fight a side has left between them"
using_mettle = "if the garrison has fewer than 6 mettle. it falls before spears do"

recall_few = "the line is thin. two or fewer still standing"
using_few = "if the garrison has few. bodies first, or nothing else matters"

recall_hurt = "worn down to half of what the garrison ever had"
using_hurt = "if the garrison has hurt. this is the rung a healing potion answers"

# --- what is coming over the wall.
recall_foes = "how many of the enemy are still coming"
using_foes = "if the enemy has fewer than 3 foes. nearly done"

recall_outnumbered = "the enemy has at least twice the garrison's numbers"
using_outnumbered = "if the enemy has outnumbered. the language has no ratios"

recall_massed = "the enemy has not lost anybody yet"
using_massed = "if the enemy has massed. true on the first round and after a bad one"

recall_routed = "a side is broken. nobody left standing"
using_routed = "if the enemy has routed. beware: a lost siege leaves them standing"

# --- the four places a die can go, and what a solver asks of them.
recall_ceiling = "the best this part could come to, if every die rolls high"
using_ceiling = "if the buckler is empty. or has fewer than 8 ceiling"

recall_moot = "what they mean to do next will throw this away"
using_moot = "if the line has moot. they volley, so you will not swing"

# --- what a pledge costs, and what is left to pay with. The one resource in the
# domain that only ever falls: it is granted at defend and never comes back.
recall_quintessence = "what is left to spend on dice, and what a die costs"
using_quintessence = "if the coffer has fewer quintessence than the d20. too dear"

# --- the odds, which used to be on the board and nowhere a spell could ask.
recall_aim = "how likely a side's blows are to tell, in a hundred"
using_aim = "if the enemy has fewer than 40 aim. not worth a die to stop"

# The dice themselves. The coffer names the ones still free, so a solver asks
# the coffer and pledges what it finds.
recall_d6 = "a six-sided die. a small, dependable floor"
using_d6 = "if the coffer has d6. pledge it where you need certainty"

recall_d8 = "an eight-sided die. the middle of your three"
using_d8 = "if the coffer has d8. pledge d8 to buckler"

recall_d20 = "a twenty-sided die. the gamble, and the one that can swing a round"
using_d20 = "if the coffer has d20. pledge it where a bad roll costs least"

# **Only the three a wizard holds have pages.** `Prose::topics` strips `recall_`
# to decide what is nameable, so a page for `d100` would register a subject the
# coffer can never publish — the `clarity_use` trap (§19) with a die in it. The
# other four are real dice and belong to the arsenal's future, not to `recall`.

# --- the siege itself.
recall_turns = "how many rounds have resolved"
using_turns = "if the rampart has more than 8 turns. a long siege is a losing one"

recall_lifted = "the siege is over, either way"
using_lifted = "repeat until the rampart has lifted. the guard a solver wants"

# --- what the enemy announced. §5.1 tells you a round ahead so the turn is
# prevention rather than reaction, and these three are the whole of that.
recall_advance = "the enemy means to close on the wall next round. ordinary"
using_advance = "if the rampart has advance. reinforce a thin line and ride it out"

recall_onslaught = "the enemy means to come all at once next round, and harder"
using_onslaught = "if the rampart has onslaught. the round to spend something on"

recall_volley = "the enemy means to shoot from range. fewer of them, and unanswered"
using_volley = "if the rampart has volley. spend nothing, you cannot strike back"

