# **Carrying leads, and loading is a footnote.** The page opened on `move sage to
# mortar_and_pestle`, which is a command no brewing loop has needed since §10.1
# gave every instrument its own verb - `grind sage` fetches from the shelf *or*
# from another tool and wields, so a whole clarity brews without this word
# (`a_whole_brew_needs_no_move`). What `move` is actually for now is the one thing
# nothing else does: getting finished work out of the room that made it.
