# The orb's voice.
#
# Prose lives here, never in Rust (rule 6). Compiled in, and hot-reloadable
# through `Sim::set_prose` at a tick boundary.
#
# `{name}`, `{state}`, `{source}` … interpolate the record's fields by
# `FieldName::label`; an unmatched placeholder stays visible, to be caught by
# looking.
#
# Lower case, no trailing full stop: nothing on the tube shouts (§3). Every line
# within ~70 cells, the 80×22 floor's usable width.

[lines]

# ---------------------------------------------------------------------------
# Work — the production slot (§9, §11.5)
# ---------------------------------------------------------------------------

# The slot's refusal must say so (§5.0). `{state}` is `Verb::participle`,
# already inflected.
work_busy = "the {source} is busy {state}. wait for it, or stop it"

# §7 guards catastrophic targets in character rather than with an error. It
# covers the root *and* the live domains, so this must read for both - an
# earlier wording said "is the tower itself" and drew as "the laboratory is the
# tower itself" the moment a domain was tried.
purge_protected = "the orb will not unmake the {path}"

# A verb that belongs to an instrument, typed where that instrument is not (§7).
#
# Scoping keeps one room's words from catching another's typos, but "I do not
# know that word" would lie, so it names the verb and says it is not here.
verb_elsewhere = "there is nothing here to {name} with"

# A place with nothing in it. Every other record `survey` emits is pushed inside
# the loop over what is there, so without this an empty place answered a typed
# command with **silence** - which §6 does not allow anywhere. The sanctum is
# what made it the common case: a station publishes `potency` only while it
# holds a ward, so two of the three are bare for most of a solve.
survey_bare = "the {name} holds nothing"
# The same refusal, when the content can say *which* thing is missing. §6 forbids
# a bare error and the line above is only half an answer: a player told the name
# of the fixture has been told where to go. `tower::fixture_of` finds it.
verb_needs_fixture = "there is no {source} here to {name} with"

# A verb that takes nothing, handed words anyway (§19).
#
# With no slot to name, it names the verb and the words it could not use.
verb_takes_nothing = "{name} takes nothing - '{words}' is not something it can use"
# ...or takes only a closed few, which it names (`status rates`).
verb_takes_only = "{name} takes only {detail} - '{words}' is not one of them"

# The commonest refusal: a name resolved on submit and gone by the tick, or
# out of reach.
missing_target = "there is no {path} within reach"

# The "window too small" screen's sentence (§9); rule 6 has no frontend
# exemption.
window_too_small = "the orb needs a larger window"

# ---------------------------------------------------------------------------
# The laboratory (§10.1)
# ---------------------------------------------------------------------------

# `empty`, purge's counterpart: it clears an instrument and keeps what it held,
# since every byproduct has a use (§10.1).
empty_done = "you turn the {name} out into the {path}: {state}"
empty_already = "the {name} is already empty"
empty_nowhere = "there is nowhere here to put what the {name} holds"
empty_is_store = "the {name} is the shelf; move things out of it by name"

purge_begins = "you set to scouring the {path}"
purge_already = "you are already scouring the {path}"
purge_place = "the {path} is clean"
purge_place_empty = "the {path} was already clean"

# ---------------------------------------------------------------------------
# `recall` (§6.1) - the in-world manual.
#
# A recipe answers with its routes from `recipes.toml`; anything else is a
# subject, `recall_<topic>`. Only subjects take the prefix: `Prose::topics`
# makes every `recall_` key nameable.
# ---------------------------------------------------------------------------

recall_brewing = "kindle, grind, digest, mix, distil - then empty, or purge the waste"

# A recipe as instructions, in doing order. What becomes what first, then where
# and how long; long steps wrap. `{kind}` is the heat marker, since a cold
# athanor is the commonest refusal.
route_line = "{name}: {count} steps, {ticks} ticks"
route_step = "{index} {detail} -> {name}{state}  ({source}, {ticks}t{kind})"
route_step_or = "or {detail} -> {name}{state}  ({source}, {ticks}t{kind})"
route_heat = ", needs heat"
route_quintessence = ", {quantity} quintessence, lost if stopped"
# The byproduct clause, composed in, since not every step leaves one.
route_leaves = " + {state}"

# Terse, since the interpolated line must fit ~60 cells at the floor.
move_done = "{name}: {origin} to {path}"
move_done_all = "{count} {name}: {origin} to {path}"

# The lock. §10.1: it is what makes different recipes need different scripts.
wield_busy = "the {name} is at work. wait, or stop it"

# A refusal has to say what is in there, or "nothing happens" and "you loaded
# the wrong thing" look identical.
wield_empty = "the {name} is empty"
wield_no_recipe = "the {name} can do nothing with {detail}"
wield_done = "the {source} yields {name}, and leaves {detail}  +{count}"
# A run that leaves nothing, so no "and leaves " with a hole.
wield_done_clean = "the {source} yields {name}  +{count}"
# The same two, for a run that makes a batch. `{quantity}` is how many.
wield_done_batch = "the {source} yields {quantity} {name}, and leaves {detail}  +{count}"
wield_done_clean_batch = "the {source} yields {quantity} {name}  +{count}"

# Contents matching no recipe: unreachable behind the lock, but a run ending
# is announced (§14).
wield_nothing = "the {name} settles, and yields nothing"

stop_done = "you still the {name}. what it holds is untouched"
stop_idle = "the {name} is not working"

# The athanor - shared heat, and the one instrument that takes no focus.
#
# Each carries the fuel count, since banked fuel has no node to `survey`.
kindle_done = "the athanor takes light. fuel for {left} ticks"
kindle_banked = "the athanor catches on banked fuel. {left} ticks of it"
kindle_lit = "the athanor is already burning"
kindle_cold = "the athanor has nothing in it to burn, and nothing banked"
athanor_out = "the athanor gutters and goes cold"
damp_done = "you damp the athanor. {left} ticks of fuel keep"
damp_idle = "the athanor is already cold"
wield_cold = "the {name} wants heat, and the athanor is cold"
wield_short = "the {name} wants {kind} quintessence, and you hold {quantity}"
wield_beyond = "the {name} wants {kind} quintessence. a worn barrier holds {quantity}"

# ---------------------------------------------------------------------------
# Experience and concentration (§11.5, §19). The first thing that opens rather
# than refuses, so it names the verb.
# ---------------------------------------------------------------------------
concentration_gained = "the orb can hold a spell now. bind one, and walk away"

# ---------------------------------------------------------------------------
# Renown (§11.5, §19). The tower's second number, and the only one that falls.
#
# Only the loss speaks, and the rank: earning is read off `status`, but a loss
# happened to the player (§6). Not scolding (§11.5).
# ---------------------------------------------------------------------------
renown_lost = "word gets about: {quantity} renown lost, and {count} left"

# ---------------------------------------------------------------------------
# What a whole siege did to the tower's standing (§11.5, §19).
#
# One line a fight, from `settle`, not one a round. It carries `{count}` too,
# being all a narrow pane or a listener gets (§14). Others talking, since a
# siege is standing won in public.
# ---------------------------------------------------------------------------
siege_standing_won = "they are singing about it: {quantity} renown, {count} in all"
siege_standing_lost = "word gets about: the wall cost {quantity} renown, {count} left"

# ---------------------------------------------------------------------------
# The two gauges at the top of every pane (§11.5, §14).
#
# Terse: a nine-cell label beside a bar. `gauge_spoken` is the bar for a
# listener (§14), the numbers and never the glyphs.
# ---------------------------------------------------------------------------
gauge_ley = "ley line"
gauge_renown = "renown"
gauge_toward = "{count}/{quantity}"
gauge_topped = "nothing more authored"
gauge_spoken = "{name}: {count} of {quantity} toward the next"

# ...and a topped track, whose `Toward::FULL` would read one short.
gauge_spoken_topped = "{name}: nothing more authored"

# ---------------------------------------------------------------------------
# THE LEDGER (§19, number go up).
#
# A label per `[[ledger]]` row, a short noun phrase reading as *how many*.
# `ledger_by_spell` stands alone for `sift`; `ledger_share` is the room
# column's short form. No commas, which split a spoken row.
# ---------------------------------------------------------------------------
# Runs, not potions: one brew yields a batch.
ledger_potions = "brews finished"
ledger_scrolls = "scrolls copied"
ledger_walks = "walks of the stacks"
ledger_wards = "wards broken"
ledger_courses = "courses run"
ledger_beasts = "beasts held"
ledger_charms = "charms laid"
ledger_held = "sieges held"
ledger_sieges = "sieges fought"
ledger_bound = "spells bound"
ledger_secrets = "secrets found"
ledger_by_spell = "{name} by your spells"
ledger_share = "your spells' share"
ledger_spells = "done by your spells"

# ---------------------------------------------------------------------------
# STATUS RATES (§19, the tower speaks up).
#
# One row per open room: its ledger row's rate, then what it waits on. No
# commas: a spoken row splits on them. A spell's hold reuses `spell_waiting`
# and `spell_watching`, the sentences its log already says.
# ---------------------------------------------------------------------------
rates_rate = "{name}: {count} an hour"
rates_rate_none = "{name}: none this hour"
rates_rate_unknown = "{name}: too soon to say"
rates_row = "{detail} · {state}"
rates_wait_working = "the {name} is working with {count}t left"
rates_wait_busy = "the {name} is working"
rates_wait_scouring = "the {name} is being scoured with {count}t left"
rates_wait_scrubbing = "the {name} is being scoured"
rates_wait_ready = "the {name} is ready. empty it"
rates_wait_fouled = "the {name} is fouled and will not start"
rates_wait_charged = "the {name} is charged. wield it"
rates_wait_gathering = "the {name} wants {detail}"
rates_wait_more = "the {name} wants more {detail}"
rates_wait_cold = "the {name} is cold"
rates_wait_burning = "the {name} burns with {count}t of fuel"
rates_wait_alight = "the {name} burns"
rates_wait_banked = "the {name} is banked"
rates_wait_empty = "nothing is waiting"
rates_hold_pulling = "{name} waits for the {source} to fill"
rates_hold_biding = "{name} bides with {count}t left"
rates_slot_held = "the {name} is {state} with {count}t left"
rates_slot_free = "free. nothing holds it"

# The rail's detail row, twelve cells at most: the same wait as `status rates`,
# in shorthand. `{name}` is an instrument's two letters; a reader hears the
# `rates_wait_*` sentence instead.
brief_at = "at {name}"
brief_wants = "{name} +{detail}"
brief_after = "after {name}"
brief_watching = "watching"
brief_pulling = "pulling"
brief_biding = "bides {count}t"
# The forge, with nothing working: the charm nearest lapsing, by the word the
# forge publishes for it.
brief_charm = "{state} {count}t"
brief_charm_said = "the {name} charm is {state} with {count}t left"

# How long until the next station, at the pace the last makings set. Coarse,
# as the resume line is: a few makings' average claims no more.
eta_soon = "under a minute"
eta_minutes = "~{count} min"
eta_hours = "~{count} h"

# A Ley fork becoming choosable. A fork opens nothing until it is taken, so
# nothing else ever said it.
ley_fork_opened = "the ley line forks ahead. weave, and choose a lane"

# ---------------------------------------------------------------------------
# THE TEN THINGS THE TOWER IS CALLED (§11.5).
#
# Titles, not gates, short for the gauge's row; the last is what is said of a
# tower after it is gone.
# ---------------------------------------------------------------------------
rank_reached = "they are calling you {name} now"
rank_fallen = "they are back to calling you {name}"
rank_lost = "they have stopped calling you {name}"
renown_hedge_wizard = "hedge-wizard"
renown_cunning_man = "cunning man"
renown_adept = "adept"
renown_conjurer = "conjurer"
renown_magister = "magister"
renown_thaumaturge = "thaumaturge"
renown_archmage = "archmage"
renown_arch_magus = "arch-magus"
renown_the_tower_itself = "the tower itself"
renown_remembered = "remembered"
# On the weave's headings row, at the right edge. Terse because it shares a row.
weave_renown = "renown {count}"

# ---------------------------------------------------------------------------
# `debug_spawn` (§19): debug-only code, but its lines ship here, unreachable,
# rather than earn rule 6 an exemption, and in the orb's voice (§3).
# ---------------------------------------------------------------------------
debug_spawn_done = "the shelf finds it had {name} all along"
debug_spawn_unknown = "nothing in the tower is called '{name}'"
debug_spawn_nowhere = "there is no shelf here to put {name} on"
debug_spawn_unkept = "the arsenal keeps finished work. {name} is not any"
debug_spawn_known = "the shelf could find: {name}"

# `debug_spell`, a known-good spell written out. The refusal names the room,
# since a spell is written for one.
debug_spell_done = "the grimoire remembers {name}, in a hand not yours"
debug_spell_unknown = "no spell in the orb's own hand is called '{name}'"
debug_spell_elsewhere = "that one is written for the {name}. go there first"
debug_spell_known = "the orb could write: {name}"

# ---------------------------------------------------------------------------
# The spellbook (§8). Writing a spell, and the orb writing down what you meant.
# ---------------------------------------------------------------------------

# Opening one. `scribe_new` has to say the file was *made*, or a mistyped name
# looks exactly like the spell you wanted and opens empty.
scribe_new = "a fresh page: {name}, for the {source}"
scribe_open = "you open {name}, written for the {source}"
# Safe, and silent without this: the running copy keeps its own orders, so an
# edit that seems to do nothing has in fact landed - on the next casting.
scribe_running = "{name} is running. the orb reads along as you write"
# **Once per editing session**, not once per save (§19). The buffer writes itself
# out after every pause in the typing, so a line per write is this line every
# couple of seconds - and what it has to teach is a fact about the session.
spell_reloaded = "{name} changes under the orb's hand"

# A spell is written *for* somewhere, so there is nowhere to write one from the
# tower's landing. The first refusal in the game that is about **where you are**
# rather than about what you named, so the sentence has to teach rather than
# scold - a player who has not found a domain yet does not know there are any.
scribe_nowhere = "a spell is written for a place. go where the work is first"

# Saving says nothing at all, and there are no keys here for it (§19). It said
# "{name}: {count} lines, written down" and a count of what it could not read -
# once per pause in the typing, which is sixteen copies of itself behind the
# modal for one editing session. A line the orb could not read is still named
# individually, with its line number, by the runner when the spell is cast.

# Reading back through the transcript (§19). The keys always worked; nothing
# ever said so, and in a game with no mouse a key nobody can discover is a key
# nobody has. The word is the way in, and the row it puts on screen is what the
# player keeps afterwards.
unfurl_begins = "you unfurl the record"

# **Asked before it happens.** Leaving is the one word in the game that cannot
# be undone, waited out or repeated away, and the tower is written on the way -
# so it asks, and the answer is another `quit`. The question names what to type,
# which is what every refusal here does.
quit_asks = "leave the orb? quit again to go. anything else stays"
# **Said before it happens**, so the log ends on a decision rather than simply
# stopping. The tower keeps working whether or not anyone is looking - §5.0's
# clock runs only while the window is open, so this is the wizard stepping away
# rather than the world ending.
quit_begins = "you let the orb go dark. the tower keeps its own counsel"
# The menu is its own word (§19).
menu_begins = "you lift your eyes from the orb"

# The menu's own furniture. Authored against the narrow pane, like the weave's.
menu_title = "orbs"
menu_lead = "the tower waits. what now?"
# The same screen with no tower behind it, after the boot card. `menu_lead`
# cannot be reused: it says the tower is waiting, and at the threshold there is
# not one yet — which is the whole distinction the screen exists to draw.
menu_lead_threshold = "the orb is awake. no tower yet"
menu_too_small_threshold = "the window is too small for the orb's menu"
menu_word_resume = "resume    go back to the tower"
menu_word_play = "play      open a tower, or raise one"
menu_word_settings = "settings  how the orb reads you, and how it looks"
menu_word_manual = "manual    how any of this works"
menu_word_quit = "quit      put the orb down"
# On the play page, under the towers: the other half of the one question that
# page asks. There is no `_threshold` form because there is no tower behind the
# play page either way — "another" would be the lie, so it is not said at all.
menu_word_new = "new       raise a tower"
# The only destructive word in the menu, so it is typed whole and asked about.
# It is drawn dim and only when there is something to abandon.
menu_word_abandon = "abandon <slot>   clear one, asking first"
menu_word_back = "back      the way you came"
menu_too_small = "the pane is too small for the menu. press F4"

# The play page: the towers the orb is keeping, and `new` under them. `{count}`
# is the slot a player types to open one.
menu_play_lead = "open a tower, or raise one"
menu_saves_none = "no towers yet"
menu_saves_row = "{count}  {name}, a {detail} game, {quantity} earned"
# A file in a slot this build cannot read. Listed rather than hidden: the slot is
# not free, and saying nothing made its number answer "there is no tower in 3"
# about a game sitting right there.
menu_saves_unreadable = "{count}  a tower this orb cannot read"

# How long a new game is to be. The tiers are `Length::OFFERED`; baseline is not
# offered, because it is the numbers we happened to author first rather than a
# difficulty. See `content/length.rs`.
menu_new_lead = "how long a game?"
menu_length_short = "short     a brisk one"
menu_length_medium = "medium    the usual"
menu_length_long = "long      the long haul"

# How the orb reads a typed line. `augury` works out what you meant and echoes
# the command it settled on, which is §6's mastery arc; `plain` answers only the
# words it already knows and suggests when it cannot. The mark says which is on,
# because a settings page that does not say what is currently true is a list of
# things you might already have done.
menu_settings_lead = "what would you set?"
menu_settings_sound = "sound     how loud the orb is"
menu_settings_tube = "tube      the glass, and the colour of it"
menu_settings_picture = "picture   each effect on the glass, alone"
menu_settings_access = "access    what the orb does so you can read it"
menu_settings_habits = "habits    how the orb behaves"

# One page of settings. A row says what it is set to, because a page that lists
# what you *could* pick without saying what is picked is a list of things you
# might already have done. Typing the word cycles it; the word and a value sets
# it outright.
menu_sound_lead = "how loud the orb is, and which sounds it makes"
menu_tube_lead = "the glass"
# The picture page's rows are ceilings: `crt` chooses the tube, these say how
# much of each effect it may use.
menu_picture_lead = "how much of each effect the glass may use"
menu_access_lead = "what the orb does so you can read it"
menu_habits_lead = "how the orb behaves"
menu_setting_row = "{name}  [{state}]"
menu_setting_how = "type a word to step it, or the word and a value"

# One line per setting, each padded to 27 cells so the `[value]` that follows
