# **The way in to the whole second half of the game.** Everything above this line
# is a word to type now, and nothing on the page said the orb could be taught to
# type them for you — so a player could read `help` in every room and never learn
# there are spells. §12 puts the in-world grimoire in the "always" column, and a
# reference nobody can find their way into is not one.
man_teachable = "the orb can be taught to do all of it. recall apprentice"

# ---------------------------------------------------------------------------
# The room primer - what `help` says BEFORE the word list.
#
# A lost player's three questions: `man_here_` what the place is, `man_start_`
# how to begin, `man_solve_` how to finish — two instructions, followed at
# different times. `man_`, not `recall_`.
#
# `every_room_a_player_can_stand_in_explains_itself` demands all three of a
# built room. The last two are instructions naming words that work here
# (`a_primer_only_names_words_that_room_actually_offers`).
# ---------------------------------------------------------------------------
man_here_laboratory = "where reagents become potions, one instrument at a time"
man_start_laboratory = "kindle charcoal for heat, then grind sage in the mortar"
man_solve_laboratory = "each stage feeds the next. recall clarity walks a whole brew"

