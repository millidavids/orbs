menu_set_voice = "voice    how loud it all is"
menu_set_keys = "keys     typing and Enter  "
menu_set_chimes = "chimes   good news         "
menu_set_alarms = "alarms   bad news          "
menu_set_refusals = "refusals a line not taken  "
menu_set_crt = "crt      the curved glass  "
menu_set_theme = "theme    the phosphor      "
menu_set_scale = "scale    how the glass fits"
menu_set_curve = "curve    the bulge         "
menu_set_lines = "lines    the scan lines    "
menu_set_glow = "glow     bloom, afterglow  "
menu_set_flicker = "flicker  the rolling band  "
menu_set_mask = "mask     the grille        "
menu_set_split = "split    colour fringes    "
menu_set_edge = "edge     the dark corners  "
menu_set_sight = "sight    hue, or none      "
menu_set_linear = "linear   the plain stream  "
menu_set_motion = "motion   anything moving   "
menu_set_contrast = "contrast how bright text is"
menu_set_weight = "weight   the stroke width  "
menu_set_echo = "echo     the line read back"
menu_set_reading = "reading  how lines are read"
menu_set_focus = "focus    how the panes sit "
menu_set_skip = "skip     the boot sequence "
menu_set_install = "install  setup on a new orb"
menu_set_pace = "pace     typing speed, baud"
menu_set_away = "away     a window set aside"
menu_set_name = "name     the wizard's name "

