# **No key is named here**, and that is not an omission. The numbered lines are
# joined into one paragraph, so each has to flow into the next — and a manual the
# sim owns must not name `f10` or `ctrl-c`, because which keys exist is a
# frontend's answer and the two builds do not agree. The word is the part that is
# true everywhere.
