man_start_grimoire = "a spell is written where its work is. attend a room first"
man_solve_grimoire = "peruse one to read it back. invoke casts it where you stand"

man_here_arsenal = "finished work, kept where every room can reach it"
man_start_arsenal = "move a potion or a scroll here from the room that made it"
man_solve_arsenal = "nothing spends them yet. a siege will be what does"

man_here_tower = "your tower. the rooms are below you"
