[package]
name = "orbs-sim"
description = "O.R.B.S. simulation core — world model, parser, script engine. Headless."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# NOTE: `bevy_ecs` only. Never add `bevy`, or anything pulling in rendering,
# windowing, assets, or a GPU. This crate must compile and test headlessly.
# See CLAUDE.md, architectural rule 1.
[dependencies]
bevy_ecs = { workspace = true }
# The record model — the output vocabulary this crate emits into, not a
# renderer. `orbs-render` has no dependencies of its own, so this stays headless
# and costs milliseconds. Rule 2 still forbids reaching for `Painter` or `Frame`
# from here; `tests/boundaries.rs` is what enforces it.
orbs-render = { path = "../orbs-render" }
rand = { workspace = true }
rand_chacha = { workspace = true }
# Content parsing only. This crate never *watches* a file — a frontend owns the
# watcher and hands new content in at a tick boundary (rule 3, rule 8), which is
# what keeps the sim headless, deterministic and testable without a filesystem.
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
