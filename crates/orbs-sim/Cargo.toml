[package]
name = "orbs-sim"
description = "O.R.B.S. simulation core — world model, parser, script engine. Headless."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# `bevy_ecs` only, never `bevy`: headless (rule 1).
[dependencies]
bevy_ecs = { workspace = true }
# The record model, not a renderer; `tests/boundaries.rs` keeps `Painter` out.
orbs-render = { path = "../orbs-render" }
rand = { workspace = true }
rand_chacha = { workspace = true }
# Content parsing only; a frontend watches files (rules 3, 8).
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

# `debug` for tests, so the save lint can name a missing component; the shipped
# binary never builds it.
[dev-dependencies]
bevy_ecs = { workspace = true, features = ["debug"] }

[lints]
workspace = true
