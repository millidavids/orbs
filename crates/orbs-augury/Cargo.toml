[package]
name = "orbs-augury"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The trained reader (§19): `orbs_sim::Augur`, which the sim never depends on
# (rule 1).
[dependencies]
orbs-sim = { path = "../orbs-sim" }

# No defaults, which pull sqlite and a network client. A reader is `ndarray`
# only, faster for one line and GPU-free; no `burn-train`, which the loop
# does not need.
burn = { version = "0.21", default-features = false, features = [
    "std",
    "ndarray",
] }

# The trainer's own `wgpu`, not Bevy's: Bevy 0.20 is on 30 and this burn on 29.
# The burn on 30 is 0.22, a rewrite held as its own item (DESIGN.md §19, *Bevy
# 0.20*). A `train` build compiles both; a shipped build has only Bevy's.
wgpu = { version = "29", default-features = false, optional = true }

[features]
default = []
# The trainer's alone; the examples require it, so a plain build stays
# inference.
train = ["burn/wgpu", "burn/autodiff", "dep:wgpu"]

[[example]]
name = "train"
required-features = ["train"]

[[example]]
name = "measure"
required-features = ["train"]

[[example]]
name = "device"
required-features = ["train"]

# For `examples/device.rs`'s async `request_adapter`: a blocking shim, no
# runtime (rule 8), never shipped.
[dev-dependencies]
pollster = "1"

[lints]
workspace = true
