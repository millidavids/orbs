[package]
name = "orbs-tui"
description = "O.R.B.S. — terminal frontend. Second-class; the Bevy build never waits for it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
orbs-sim = { path = "../orbs-sim" }
orbs-render = { path = "../orbs-render" }
# **`augury` on, because this is the whole game and not a cut-down one.** The
# reader was left out while it needed `wgpu`; it does not — inference is
# `ndarray` and costs 436µs — so the only thing keeping it out of a terminal was
# a feature split `orbs-augury` had not made yet. A player who prefers the
# terminal gets the same orb, and the driver setting means the same thing in
# both builds.
orbs-shell = { path = "../orbs-shell", features = ["augury"] }

# The whole of this frontend's backend. `orbs-shell` decides what a screen is and
# hands back a `Frame`; crossterm puts the cells on a terminal and reads keys off
# it — architectural rule 2's "how a cell is drawn" and nothing else. A widget
# framework would be a second layout model above the real one.
#
# Defaults are `bracketed-paste`, `events`, `windows` and `derive-more`, kept as
# they come. **Pasting a spell into the editor does not need `bracketed-paste`
# and does not use it**: a terminal sends a paste as ordinary keystrokes, so the
# newlines arrive as `Enter` and the editor splits lines exactly as if they had
# been typed — checked with `tmux paste-buffer`, three lines in, three lines out.
# The feature is simply a default not worth the churn of turning off.
#
# **`event-stream` stays off**, and that one is deliberate: it is the only
# feature that pulls `futures`. Rule 8 permits a frontend its backend's
# concurrency but never to drive the sim, and the cleanest way to hold that line
# is to have no futures in the tree at all. The synchronous `poll`/`read` pair is
# the whole API this needs.
crossterm = "0.29"

# **The one exit `enter()`'s own doc did not cover.** It argues at length that
# restoring the terminal must survive a panic — "no echo, no line editing, no
# prompt… the shell would look dead" — and installs a hook for it. A signal
# reaches the same state by a route the hook cannot see: `kill`, a dropped ssh
# connection (SIGHUP), a session manager stopping the process. Nothing ran
# `leave()`, and the user got their shell back in raw mode.
#
# `flag::register` is safe code — the workspace denies `unsafe` — and sets an
# `AtomicBool` the loop already polls thirty times a second, so the game exits
# through its ordinary return and `term::leave` runs on the way out. Already in
# the tree under `crossterm`, so it costs no build time.
signal-hook = "0.3"
# **To ask one question crossterm cannot answer: has the terminal gone away?**
# A destroyed pty reports `POLLHUP`, and `crossterm::event::read` responds to
# that by looping inside itself for ever rather than returning — so the check has
# to happen before the read, against the file descriptor directly. See
# `hung_up` and `watch_for_hangup` in `drive.rs` for what it costs when nobody asks.
#
# `rustix` rather than `libc` because `unsafe_code` is denied workspace-wide and
# this is one `poll` — a safe wrapper is the whole reason to prefer it. Already
# in the tree via crossterm; declared here because this crate calls it.
rustix = { version = "1.1", features = ["event", "stdio", "pipe"] }

# For the one thing this build can fail at mid-session and cannot put on screen:
# `F6`'s trace export. There is no subscriber installed (see `main.rs` — one
# writing to stderr would scribble across a raw-mode screen), so the macro
# compiles to nothing by default and the warning is there for anyone who attaches
# a subscriber to a file. Swallowing it instead would make a failed export
# indistinguishable from a successful one.
tracing.workspace = true

[lints]
workspace = true
