[package]
name = "orbs-tui"
description = "O.R.B.S. — terminal frontend. Second-class; the Bevy build never waits for it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
orbs-sim = { path = "../orbs-sim" }
orbs-render = { path = "../orbs-render" }
# `augury` on: inference is `ndarray`, so the terminal gets the whole orb.
orbs-shell = { path = "../orbs-shell", features = ["augury"] }

# The whole backend, rule 2's "how a cell is drawn"; no widget framework.
# Defaults as they come (a paste arrives as keystrokes either way).
# `event-stream` stays off, the one feature pulling `futures` (rule 8).
crossterm = "0.29"

# A signal leaves the terminal raw where no panic hook sees; a safe flag the
# loop polls, so `term::leave` runs. Already in the tree.
signal-hook = "0.3"
# Whether the pty has gone (`hangup.rs`), asked before a read that would spin;
# `rustix`, since `unsafe` is denied. Already in the tree.
rustix = { version = "1.1", features = ["event", "stdio", "pipe"] }

# `F6`'s failed export, for a subscriber attached to a file; none is installed.
tracing.workspace = true

[lints]
workspace = true
