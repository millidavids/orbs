[package]
name = "orbs-shell"
description = "O.R.B.S. — the shell every frontend shares: painters, surfaces, and the headless dump."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# **Deliberately engine-free.** This crate decides what a screen *is* — where the
# panel goes, what the rail says, what the editor does with a keystroke — and
# hands back a `Frame`. Drawing that Frame is a frontend's, and there are two:
# `orbs` puts it on a GPU behind a CRT, `orbs-tui` writes it to a terminal.
#
# `bevy_ecs` is here and `bevy` is not, which is architectural rule 1 as written:
# the crate with the strictest headless requirement in the workspace already
# takes exactly this dependency. It buys the `Resource` derive on the nine types
# the Bevy build keeps between frames, costs `orbs-tui` nothing — `bevy_ecs` is
# already in its tree via `orbs-sim` — and adds no renderer, no window and no GPU.
# `tests/boundaries.rs` holds the line.
[dependencies]
orbs-sim = { path = "../orbs-sim" }
orbs-render = { path = "../orbs-render" }
bevy_ecs.workspace = true
tracing.workspace = true

# For `settings.rs` — what the player chose about the orb, kept beside the saves
# rather than inside one. Both are already in the tree via `orbs-sim`, which
# reads every content table with them, so this adds no build time and no new
# licence row (§19's audited table).
#
# **A one-key file did not need a format**, and gets one because the roadmap's
# open `Options, remapping, all toggles` is the rest of that file: a bespoke
# `driver=augury` line is a thing to migrate the first time a second key lands.
serde.workspace = true
toml.workspace = true

# **Optional, and `orbs-tui` deliberately does not turn it on.** The trained
# reader brings `burn` — 150 crates — and the terminal build is kept as the
# no-GPU, instant-startup target. The Bevy build enables `augury`; everything
# else gets a shell that answers `ORBS_AUGURY=model` with "no reader", which is
# the game exactly as it was.
orbs-augury = { path = "../orbs-augury", optional = true }

[features]
default = []
augury = ["dep:orbs-augury"]

[lints]
workspace = true
