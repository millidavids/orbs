[package]
name = "orbs-shell"
description = "O.R.B.S. — the shell every frontend shares: painters, surfaces, and the headless dump."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Engine-free: what a screen is, as a `Frame` both frontends draw. `bevy_ecs`
# for the `Resource` derive, never `bevy` (rule 1, `tests/boundaries.rs`).
[dependencies]
orbs-sim = { path = "../orbs-sim" }
orbs-render = { path = "../orbs-render" }
bevy_ecs.workspace = true
tracing.workspace = true

# The settings file, already in the tree via `orbs-sim`.
toml.workspace = true
# The tour's catalogue, read into types.
serde.workspace = true

# Where towers and settings live (the workspace manifest).
dirs.workspace = true

# Optional, so a build without it answers `ORBS_AUGURY=model` with "no reader".
orbs-augury = { path = "../orbs-augury", optional = true }

[features]
default = []
augury = ["dep:orbs-augury"]

[lints]
workspace = true
