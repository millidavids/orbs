# The tour (DESIGN.md §19, *the tour*): every surface of the game, posed and
# then played, one scene at a time.
#
#     scripts/tour.sh                  # this list
#     scripts/tour.sh forge.lattice    # one scene, yours when its steps end
#     scripts/tour.sh forge,lens       # groups and names
#     scripts/tour.sh all
#
# `setup` runs at once, through the dump's own driver, before the scene is
# shown. `steps` are then typed at the keyboard as a player types them, each
# waiting for the one before it to land. `expect` is checked after setup and
# `ends` after the steps, by `cargo test`, so a scene cannot claim a state it
# never reached. Setups are taken from `scripts/dumps.sh` lines that already
# capture the state.

# --- the boot card -----------------------------------------------------------

[[scene]]
name = "boot.card"
about = "the orb waking: the dark, the card's letters, its close, the tower opening"
boot = true
hold = 13
shots = [0.5, 2.0, 4.0, 7.0, 9.3, 10.2, 12.0]
steps = [{ type = "status", when = "live", pause = 1.0, shots = [0.3] }]

[[scene]]
name = "boot.still"
about = "the card with motion off: it arrives whole, holds, and leaves by a cut"
boot = true
settings = { motion = "off" }
hold = 11
shots = [1.0, 5.0, 10.0]

# --- the orb's own screens -----------------------------------------------------

[[scene]]
name = "orb.threshold"
about = "the orb before any tower: its menu, a settings page, the play page"
tower = "threshold"
expect = { surface = "threshold" }
steps = [
  { type = "settings", when = "menu", shots = [0.3] },
  { type = "picture", shots = [0.3] },
  { keys = "<esc>", pause = 1.5 },
  { type = "play", shots = [0.3, 1.0] },
]
ends = { surface = "threshold" }

[[scene]]
name = "orb.menu"
about = "the menu over a tower: a page, then resumed back to the room"
setup = "attend laboratory; kindle charcoal; grind sage; menu"
expect = { surface = "menu" }
steps = [
  { type = "settings", when = "menu", shots = [0.3] },
  { type = "tube", shots = [0.3] },
  { keys = "<esc>", pause = 1.5 },
  { type = "resume", shots = [0.2, 0.6] },
]
ends = { room = "laboratory" }

[[scene]]
name = "orb.settings"
about = "settings rows stepped from the picture page: the glass softens as you watch"
setup = "attend laboratory; kindle charcoal; grind sage; menu"
expect = { surface = "menu" }
steps = [
  { type = "settings", when = "menu" },
  { type = "picture", shots = [0.3] },
  { type = "glow soft", pause = 1.5, shots = [0.3] },
  { type = "curve off", pause = 1.5, shots = [0.3] },
  { type = "edge off", pause = 1.5, shots = [0.3, 1.0] },
]
ends = { surface = "menu" }

[[scene]]
name = "orb.manual"
about = "the manual, from the threshold: a chapter paged through"
tower = "threshold"
steps = [
  { type = "manual", when = "menu" },
  { type = "keys", when = "manual", shots = [0.3] },
  { keys = "<pgdn><pgdn>", shots = [0.3] },
  { keys = "<esc>", pause = 1.5, shots = [0.3] },
]
ends = { surface = "manual" }

[[scene]]
name = "orb.install"
about = "a new tower's practice run: the strip, help, a survey, a first step"
tower = "install"
expect = { surface = "install" }
steps = [
  { type = "help", shots = [0.5] },
  { type = "survey", shots = [0.5] },
  { type = "attend laboratory", shots = [0.3, 1.0] },
]
ends = { surface = "install" }

[[scene]]
name = "orb.wake"
about = "the practice tower waking into the real one"
tower = "install"
setup = "help; survey; attend laboratory; go to the tower; status"
expect = { surface = "install" }
steps = [{ type = "wake", shots = [0.1, 0.5, 1.2] }]

[[scene]]
name = "orb.quit"
about = "`quit` asks once before it goes"
setup = "attend laboratory"
steps = [{ type = "quit", shots = [0.3] }]
ends = { said = "leave the orb?" }

[[scene]]
name = "orb.resumed"
about = "a tower reopened after an hour away"
setup = "attend laboratory; kindle charcoal; grind sage"
resumed = 3600
expect = { said = "it was dark for" }

