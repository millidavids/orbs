# --- a whole cycle ------------------------------------------------------------
#
# Every picture repeats every 24 seconds (`CYCLE_SECS`), and the clock starts
# with the scene, so these hold past the wrap and shoot either side of it.

[[scene]]
name = "cycle.prism"
about = "the prism through a whole cycle: the focus never jumps at the wrap"
seed = 3
hold = 26
setup = "attend lens; probe; dial second borax; probe"
expect = { room = "lens", working = ["prism"] }
shots = [1.0, 12.0, 23.4, 23.8, 24.2, 24.6, 25.5]

[[scene]]
name = "cycle.lectern"
about = "the lectern through the wrap: its seams knit one a beat, never two"
hold = 26
setup = "debug_spawn fragment 4 lectern; attend archive"
expect = { room = "archive", states = { lectern = "charged" } }
steps = [{ type = "wield lectern", pause = 6.0 }]
shots = [1.0, 12.0, 23.4, 23.8, 24.2, 24.6, 25.5]
ends = { working = ["lectern"] }
