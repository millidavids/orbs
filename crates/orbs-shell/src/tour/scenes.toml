[[scene]]
name = "spell.write"
about = "a spell scribed, typed with its highlighting, read as the orb hears it, saved and cast"
hold = 12
setup = "attend laboratory; kindle charcoal"
expect = { room = "laboratory" }
steps = [
  { type = "scribe brewing" },
  { keys = "edit<enter>repeat 2<enter>grind the sage<enter>empty mortar_and_pestle<enter>end", when = "editor", shots = [0.5] },
  { keys = "<esc>interpret<enter>", shots = [0.5] },
  # Out of the reading, then `quit` saves and closes.
  { keys = "<esc>quit<enter>", pause = 2.0, shots = [0.2, 0.8] },
