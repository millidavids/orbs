# Restoring this changes the shape of the whole flow, not just this file, so the
# reasoning is kept here rather than rewritten from scratch later:
#
#   * `locate-dev-build` exists so the release ships **the bytes someone
#     play-tested**. dev-release.yml built and uploaded this exact SHA to the
#     Steam `staging` branch; promotion fast-forwards `main` onto that very
#     commit, which is how the SHAs match and the run can be found. Freshly
#     building here would attach different bytes than players receive.
#     Restoring it also lets the `gate` job above go away — that job only exists
#     because there is currently nothing to reuse.
#
#   * `steam-request-promotion` **cannot complete unattended**, and that is
#     Valve's design, not a bug: since Oct 2023, assigning a build to the default
#     branch of a released app sends an authorization prompt to the Steam Mobile
#     app. HTTP 201 is the NORMAL response and means "pending your confirmation"
#     — not "done". What the job actually buys is picking the right build id,
#     which is where dashboard mistakes happen.
#
