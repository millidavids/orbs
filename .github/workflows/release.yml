name: Release

# The `main` half of the two-branch flow. **This workflow ships no binaries.**
#
# `main` is reached by fast-forwarding `dev` onto it — see the `game-release`
# skill — so the commit here is one `dev-release.yml` has already gated, and the
# version block in docs/CHANGELOG.md was written on `dev` before that.
#
# Adapted from court_wizard, with the Steam half **commented out rather than
# deleted** (see the block at the end). That subtraction changes one thing about
# the shape: court_wizard announces from a *separate scheduled workflow*, because
# setting a Steam build live needs a human to tap a prompt on their phone, so
# "released" and "players have it" are hours apart and only the second is worth
# announcing. Without Steam the release is atomic — the tag is the artefact — so
# announcing happens in this same run, and the `promoted/` + `announced/` marker
# tags that made an async promotion resumable are gone with the thing they
# tracked. They come back with it.
#
# What it does:
#   1. read the version from Cargo.toml, and decide whether this is a release
#      at all — a changelog block is the opt-in
#   2. confirm the project's own gate passed on this commit — on `dev`, where it
#      already ran, or here if it did not — because a tag on a broken commit is
#      worse than no tag
#   3. tag + GitHub Release, with the body from docs/CHANGELOG.md
#   4. post to Discord and Bluesky
#
# Step 2 used to run the whole gate again, on the reasoning that with no
# artifacts to reuse there was nothing to trust. **It was re-testing identical
# bytes**: `main` is only ever a fast-forward of `dev`, so the SHA here is one
# `dev-release.yml` gated already, and the second run cost twenty minutes a
# release — the test step alone is eighteen. It asks for that verdict instead
# (`dev-verdict`), waiting when the dev run is still going. Anything but a pass
# — no run, a failure, a cancellation — runs the full gate here, so a commit
# nobody gated is still never tagged on trust.
#
# Secrets, all optional — a missing one skips its step rather than failing:
#   DISCORD_WEBHOOK_URL
#   BLUESKY_USERNAME       handle, e.g. orbs.bsky.social
#   BLUESKY_APP_PASSWORD   an app password, never the account password

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: >-
          Re-run even if the tag already exists. Re-announces: without a Steam
          promotion to be idempotent about, nothing else stops a second post.
        required: false
        type: boolean
        default: false

# A second push to main while the first release is still tagging would race for
# the same tag. Queue instead, and never cancel a run that may already have
# announced.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      should_release: ${{ steps.check_tag.outputs.should_release }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Extract version from Cargo.toml
        id: get_version
        run: |
          set -euo pipefail
          # `[workspace.package]`'s version, which every crate inherits. The
          # first `^version = ` in the file is that one; the guard below is what
          # catches it moving rather than letting an empty tag through.
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [ -z "$VERSION" ]; then
            echo "::error::No version found in Cargo.toml."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Decide whether this is a release
        id: check_tag
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          # **A changelog block is the opt-in, and its absence is not an error.**
          #
          # CLAUDE.md bumps the version on every roadmap *step*, so most versions
          # are internal progress rather than something to announce. Failing here
          # would put a red X on main for the ordinary case of doing work; always
          # releasing would post to Discord and Bluesky several times a phase.
          #
          # So writing the block is the deliberate act that says "ship this" —
          # which is the same design court_wizard uses from the other end, where
          # dev-release.yml only builds on pushes that touch the changelog.
          # `/game-release` is the skill that writes it.
          if ! grep -qF "## [v$VERSION]" docs/CHANGELOG.md; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "No '## [v$VERSION]' block in docs/CHANGELOG.md — not a release."
            {
              echo "### v$VERSION: no release"
              echo ""
              echo "\`docs/CHANGELOG.md\` has no \`## [v$VERSION]\` block, so this push is"
              echo "ordinary work rather than a release. Run \`/game-release\` to write one."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$FORCE" = "true" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "force=true — ignoring the tag-exists guard"
          elif git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Tag v$VERSION already exists, skipping release"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing v$VERSION"
          fi

  dev-verdict:
    # **The gate already ran on this commit, on `dev`.** Found by SHA and
    # awaited if it is still going — `/game-release main` allows promoting while
    # the dev run is in progress. `gated` is true only for a run that passed;
    # everything else sends the full gate below.
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
    outputs:
      gated: ${{ steps.find.outputs.gated }}
    steps:
      - name: Find the dev-release run for this commit, and await it
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run=$(gh run list --repo "$REPO" --workflow dev-release.yml \
            --commit "$GITHUB_SHA" --limit 1 --json databaseId \
            --jq '.[0].databaseId // empty')
          if [ -z "$run" ]; then
            echo "No dev-release run for $GITHUB_SHA — the full gate runs here."
            echo "gated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Blocks until the run finishes, and fails unless it passed. The
          # `play` job there is `continue-on-error`, so a red scenario does not
          # fail the run — the same standing it has on `dev`.
          if gh run watch "$run" --repo "$REPO" --exit-status --compact --interval 30 > /dev/null; then
            echo "dev-release run $run passed on $GITHUB_SHA — not gating twice."
            echo "gated=true" >> "$GITHUB_OUTPUT"
          else
            echo "dev-release run $run did not pass — the full gate runs here."
            echo "gated=false" >> "$GITHUB_OUTPUT"
          fi

  gate:
    # CLAUDE.md's gate, verbatim and in the same order — **the fallback**, for a
    # commit `dev-release.yml` never passed. A fast-forward promotion never
    # needs it; a `force` re-run of a commit dev never saw would.
    needs: [check-version, dev-verdict]
    # **`!cancelled()`, or the fallback is not one.** Without a status function
    # this reads as `success() && …`, so a `dev-verdict` that *failed* — a `gh`
    # error under `set -e`, or its wait timing out — would skip this job, and
    # `release` with it: a promotion that tagged nothing and said nothing.
    if: >-
      !cancelled()
      && needs.check-version.outputs.should_release == 'true'
      && needs.dev-verdict.outputs.gated != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable channel (pinned)
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install Linux build dependencies
        # Bevy's linux backends. Needed for `cargo build -p orbs` to *link*,
        # which is the step CLAUDE.md singles out as the one `cargo check` does
        # not replace.
        #
        # **`mold` with them**, because `.cargo/config.toml` names it as this
        # target's linker and a machine without it fails at the link step rather
        # than falling back — which is the right way round on a desk and simply
        # a broken job here.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev pkg-config \
            mold

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        # The feature is not optional — see `dev-release.yml`.
        run: cargo clippy --workspace --all-targets --features orbs-augury/train -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: Link the game
        run: cargo build -p orbs

  release:
    needs: [check-version, dev-verdict, gate]
    # **Spelled out, because a skipped need skips everything after it.** `gate`
    # is skipped whenever dev already passed, and GitHub skips every job further
    # down a chain with a skipped job in it unless its own condition says
    # otherwise. `!cancelled()` rather than `always()`, so a cancelled run still
    # tags nothing.
    if: >-
      !cancelled()
      && needs.check-version.outputs.should_release == 'true'
      && (needs.dev-verdict.outputs.gated == 'true' || needs.gate.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      title: ${{ steps.changelog.outputs.title }}
      body: ${{ steps.changelog.outputs.body }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Extract the changelog block
        id: changelog
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          # **Selected by version, not "the top block".** They are the same in
          # the normal flow, but a `force` dispatch can target an older release
          # while the changelog has moved on, and announcing the top block there
          # would ship the wrong notes.
          #
          # Literal prefix matching rather than a regex: a version is full of
          # dots, and escaping "## [v0.1.24]" into an awk regex is a reliable way
          # to silently match nothing.
          title=$(sed -n "s/^## \[v$VERSION\] - \(.*\)/v$VERSION - \1/p" docs/CHANGELOG.md | head -1)
          body=$(awk -v hdr="## [v$VERSION]" '
              index($0, hdr) == 1 { inblock = 1; next }
              inblock && index($0, "## [") == 1 { exit }
              inblock { print }
            ' docs/CHANGELOG.md)
          if [ -z "$title" ] || [ -z "$body" ]; then
            echo "::error::No changelog block for v$VERSION in docs/CHANGELOG.md."
            exit 1
          fi
          # Trim leading and trailing blank lines.
          body=$(echo "$body" | sed '/./,$!d' | sed -e :a -e '/^[[:space:]]*$/d;N;ba')
          # Discord's embed description hard-limits at 4096 characters. Trimmed
          # with python so multi-byte characters count correctly — this changelog
          # is full of em-dashes — ending on a clean line break.
          body=$(printf '%s' "$body" | python3 -c 'import sys; s = sys.stdin.read(); s = (s[:3990].rsplit(chr(10), 1)[0] + chr(10) + "…") if len(s) > 4000 else s; sys.stdout.write(s)')
          echo "title=$title" >> "$GITHUB_OUTPUT"
          # Random delimiter: a changelog body can contain anything, including a
          # line that looks like a heredoc terminator.
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists (force re-run) — keeping it"
          else
            git tag -a "v$VERSION" -m "Release v$VERSION"
            git push origin "v$VERSION"
          fi

      - name: Create GitHub Release
        # **v3 is the Node 24 line, and the bump is only that.** v0.8.18 released
        # with an annotation saying this action targets Node 20 and was being
        # *forced* onto Node 24 — which works until the forcing stops, and then
        # the one workflow that cannot be tested before it runs would fail on the
        # step that publishes the release.
        #
        # v3.0.0's notes are explicit that the major is the runtime move and
        # nothing else: no input changed, and this passes `tag_name`, `name` and
        # `body` exactly as it did. Verified rather than assumed — v2.6.2's
        # `action.yml` declares `using: node20` and v3's declares `node24`.
        #
        # **The SHA is the commit, not the tag object.** v3's tag is *annotated*
        # where v2.6.2's was lightweight, so `git/ref/tags` answers with a tag
        # object that has to be dereferenced — pinning that hash instead would
        # be a ref no `uses:` can resolve.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}

  announce:
    # Immediately after the release, because without Steam there is nothing
    # between "tagged" and "anyone can have it". court_wizard waits because its
    # build is one untapped phone prompt away from the players.
    needs: [check-version, release]
    # Two jobs down from `gate`, so its skip would reach here too — see
    # `release`. `needs` holds direct dependencies only, hence `release`.
    if: >-
      !cancelled()
      && needs.check-version.outputs.should_release == 'true'
      && needs.release.result == 'success'
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Post to Discord
        if: env.DISCORD_WEBHOOK_URL != ''
        env:
          FULL_TITLE: ${{ needs.release.outputs.title }}
          BODY: ${{ needs.release.outputs.body }}
          VERSION: ${{ needs.check-version.outputs.version }}
          GAME_SITE: https://orbs.blackhearthgames.com
          STUDIO_SITE: https://blackhearthgames.com
        run: |
          set -euo pipefail
          # **The embed names the game.** It used to title itself `v0.1.24 -
          # <date>` and nothing else, which reads fine in a channel dedicated to
          # one game and is anonymous anywhere else — a webhook can be pointed at
          # a shared studio channel, and a version number alone does not say
          # whose.
          #
          # `url` is what makes the title clickable; Discord has no way to link
          # part of a title, so the whole `O.R.B.S. v0.1.24 - <date>` points at
          # the GitHub release for that tag. Built from `github.server_url` and
          # `github.repository` rather than hardcoded, so a fork or a rename does
          # not silently 404.
          #
          # **No Steam link**, because there is no store page — see the commented
          # block at the foot of this file. When it exists, add it first in the
          # list to match court_wizard:
          #   [Steam](https://store.steampowered.com/app/<appid>/) ·
          release_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION"
          links="[Website]($GAME_SITE) · [Studio]($STUDIO_SITE) · [Source]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY)"
          payload=$(jq -n \
            --arg title "O.R.B.S. $FULL_TITLE" \
            --arg url "$release_url" \
            --arg desc "$BODY" \
            --arg links "$links" \
            '{embeds: [{
               title: $title,
               url: $url,
               description: $desc,
               color: 16744448,
               fields: [{name: "Links", value: $links}]
             }]}')
          curl -sS --fail-with-body -H "Content-Type: application/json" \
            -d "$payload" "$DISCORD_WEBHOOK_URL"

      # `continue-on-error` on purpose: a Bluesky outage or a rotated app
      # password must not fail a release that has already been tagged and
      # announced on Discord. The post is the least recoverable-from thing here
      # and the least important.
      - name: Post to Bluesky
        if: env.BLUESKY_USERNAME != '' && env.BLUESKY_APP_PASSWORD != ''
        continue-on-error: true
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: python3 scripts/post_to_bluesky.py --version "$VERSION"

      - name: Summary
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          {
            echo "### v$VERSION released"
            echo ""
            echo "Tagged, released, and announced wherever a secret was set."
          } >> "$GITHUB_STEP_SUMMARY"

# =============================================================================
