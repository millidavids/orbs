#     play-tested**. dev-release.yml built and uploaded this exact SHA to the
#     Steam `staging` branch; promotion fast-forwards `main` onto that very
#     commit, which is how the SHAs match and the run can be found. Freshly
#     building here would attach different bytes than players receive.
#     Restoring it also lets the `gate` job above go away — that job only exists
#     because there is currently nothing to reuse.
#
